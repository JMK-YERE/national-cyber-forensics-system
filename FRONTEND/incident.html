<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidents - Cyber Forensics</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🇹🇿 CYBER FORENSICS TZ</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">🏠 Dashboard</a>
        <a th:href="@{/incidents}">📋 Incidents</a>
        <a th:href="@{/incidents/new}">➕ Report</a>
        <a th:href="@{/audit}">📊 Audit</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="logout-btn">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1>📋 Security Incidents</h1>
        <div style="margin-top:15px;">
            <a th:href="@{/incidents/new}" class="btn">➕ Report New</a>
            <a th:href="@{/incidents/search}" class="btn">🔍 Search</a>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Incident ID</th>
                <th>Title</th>
                <th>Severity</th>
                <th>Status</th>
                <th>Region</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${incidents.isEmpty()}">
                <td colspan="7" style="text-align:center;">Hakuna matukio bado.</td>
            </tr>
            <tr th:each="inc : ${incidents}" th:class="${inc.statusClass}">
                <td th:text="${inc.incidentId}"></td>
                <td th:text="${inc.title}"></td>
                <td th:text="${inc.severity}"></td>
                <td th:text="${inc.status}"></td>
                <td th:text="${inc.region}"></td>
                <td th:text="${#temporals.format(inc.dateReported, 'yyyy-MM-dd HH:mm')}"></td>
                <td><a th:href="@{'/incidents/' + ${inc.id}}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
