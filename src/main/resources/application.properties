# ===== Server — Render Port Binding =====
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=always
server.forward-headers-strategy=framework

# ===== PostgreSQL — Performance =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/incident_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===== JPA — Faster Startup =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=true

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ===== Custom App =====
app.upload.dir=${UPLOAD_DIR:uploads/evidence}
app.encryption.key=${ENCRYPTION_KEY:TanzaniaCyberSecurityKey2024!!!}
app.name=Cyber Forensics System
app.url=${APP_URL:https://cyber-forensics-tz.onrender.com}
app.admin.email=${ADMIN_EMAIL:}

# ===== Email =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== WhatsApp =====
whatsapp.default.phone=${WHATSAPP_DEFAULT_PHONE:}
whatsapp.default.apikey=${WHATSAPP_DEFAULT_APIKEY:}
whatsapp.admin.phone=${WHATSAPP_ADMIN_PHONE:}
whatsapp.admin.apikey=${WHATSAPP_ADMIN_APIKEY:}

# ===== VirusTotal =====
virustotal.api.key=${VIRUSTOTAL_API_KEY:}

# ===== Groq AI =====
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# ===== i18n =====
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

# ===== Logging — Less =====
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.com.tz.forensics=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n
