# ===== Server =====
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===== Database =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/incident_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== i18n =====
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# ===== File Upload =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ===== Custom App =====
app.name=${APP_NAME:Cyber Forensics TZ}
app.url=${APP_URL:https://cyber-forensics-tz.onrender.com}
# Evidence storage: local for development, s3 for production/object storage.
# Render Free local filesystem is ephemeral and MUST NOT be used as a production evidence vault.
app.storage.provider=${EVIDENCE_STORAGE_PROVIDER:local}
app.storage.s3.bucket=${EVIDENCE_STORAGE_BUCKET:}
app.storage.s3.region=${EVIDENCE_STORAGE_REGION:auto}
app.storage.s3.endpoint=${EVIDENCE_STORAGE_ENDPOINT:}
app.storage.s3.access-key=${EVIDENCE_STORAGE_ACCESS_KEY:}
app.storage.s3.secret-key=${EVIDENCE_STORAGE_SECRET_KEY:}
app.storage.s3.prefix=${EVIDENCE_STORAGE_PREFIX:cyber-forensics/}
app.upload.dir=${UPLOAD_DIR:/app/uploads/evidence}
# No insecure hardcoded production encryption key. Evidence encryption requires ENCRYPTION_KEY.
app.encryption.key=${ENCRYPTION_KEY:}

# ===== Logging =====
logging.level.root=INFO
logging.level.com.tz.forensics=INFO

# ===== Bean Overriding =====
spring.main.allow-bean-definition-overriding=true

# ===== Email / SMTP =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=${MAIL_SMTP_SSL_PROTOCOLS:TLSv1.2}

# ===== Google OAuth2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===== HTTP Email Provider (works on Render Free) =====
email.provider=${EMAIL_PROVIDER:auto}
email.resend.api-key=${RESEND_API_KEY:}
email.resend.from=${RESEND_FROM_EMAIL:}

# Let Spring Boot/browser handle unexpected HTTP errors without a custom application error screen
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
