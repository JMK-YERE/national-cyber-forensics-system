# ===== Server =====
server.port=${PORT:8080}
server.error.include-message=always
server.forward-headers-strategy=framework

# ===== PostgreSQL =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/incident_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ===== Custom App =====
app.upload.dir=${UPLOAD_DIR:uploads/evidence}
app.encryption.key=${ENCRYPTION_KEY:TanzaniaCyberSecurityKey2024!!!}
app.name=National Cyber Forensics System
app.url=https://cyber-forensics-tz.onrender.com
app.admin.email=${ADMIN_EMAIL:}

# ===== Email (Gmail SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== WhatsApp (CallMeBot) =====
whatsapp.default.phone=${WHATSAPP_DEFAULT_PHONE:255627827053}
whatsapp.default.apikey=${WHATSAPP_DEFAULT_APIKEY:3467843}
whatsapp.admin.phone=${WHATSAPP_ADMIN_PHONE:255627827053}
whatsapp.admin.apikey=${WHATSAPP_ADMIN_APIKEY:3467843}

# ===== VirusTotal =====
virustotal.api.key=${VIRUSTOTAL_API_KEY:}

# ===== Groq AI =====
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# ===== Logging =====
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.tz.forensics=DEBUG
logging.level.com.tz.forensics.service.AIChatService=DEBUG
