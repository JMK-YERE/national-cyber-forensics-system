<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.dashboard} + ' - ' + #{app.title}">Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card">
        <h1><span th:text="#{dashboard.welcome}">Welcome</span>, <span th:text="${username}">User</span>!</h1>
        <p>Professional Dashboard</p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${totalIncidents}">0</div>
            <div class="stat-label" th:text="#{dashboard.totalIncidents}">Total Incidents</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${openCases}">0</div>
            <div class="stat-label">Open Cases</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${investigatingCases}">0</div>
            <div class="stat-label">Investigating</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${closedCases}">0</div>
            <div class="stat-label">Closed</div>
        </div>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.quickActions}">Quick Actions</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;">
            <a th:href="@{/incidents/new}" class="btn btn-primary">➕ <span th:text="#{nav.report}">Report</span></a>
            <a th:href="@{/incidents}" class="btn">📋 <span th:text="#{nav.incidents}">Incidents</span></a>
            <a th:href="@{/cases}" class="btn">📁 <span th:text="#{nav.cases}">Cases</span></a>
            <a th:href="@{/threat-map}" class="btn">🗺️ <span th:text="#{nav.threatMap}">Threat Map</span></a>
            <a th:href="@{/audit}" class="btn">📊 <span th:text="#{nav.audit}">Audit</span></a>
        </div>
    </div>
</div>
</body>
</html>
