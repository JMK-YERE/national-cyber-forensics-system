<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.dashboard}">Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;">👑 Admin Dashboard</h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">
            <span th:text="#{dashboard.welcome}">Welcome</span>, <span th:text="${username}"></span>
        </p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${totalIncidents != null ? totalIncidents : 0}">0</div>
            <div class="stat-label">Total Incidents</div>
        </div>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.quickActions}">Quick Actions</h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-top:15px;">
            <a th:href="@{/report-attack/admin}" class="btn btn-primary" style="text-align:center; padding:20px; text-decoration:none;">
                📋 <span th:text="#{report.allReports}">All Reports</span>
            </a>
            <a th:href="@{/whistleblower/admin}" class="btn btn-primary" style="text-align:center; padding:20px; text-decoration:none;">
                🕵️ <span th:text="#{whistleblower.title}">Whistleblower</span>
            </a>
            <a th:href="@{/notifications}" class="btn" style="text-align:center; padding:20px; text-decoration:none;">
                🔔 <span th:text="#{nav.notifications}">Notifications</span>
            </a>
            <a th:href="@{/report-attack}" class="btn" style="text-align:center; padding:20px; text-decoration:none;">
                🚨 <span th:text="#{nav.report}">Report</span>
            </a>
        </div>
    </div>
</div>
</body>
</html>
