<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}"><style id="deep-green-dashboard-polish">.app-main{background:radial-gradient(circle at 90% 0%,#eff6ff 0,#f6f8fb 32%,#f6f8fb 100%)}.app-card,.db-card,.fc,.pc,.a-card{border-color:#e2e8f0;box-shadow:0 8px 24px rgba(2,44,34,.06)}.app-stat-box{border-top-color:#2563EB!important}.app-stat-box .value{color:#2563EB!important}.app-btn-primary{background:linear-gradient(135deg,#1D4ED8,#2563EB)!important}.fc a,.pc a{background:#2563EB!important}.fc a:hover,.pc a:hover{background:#1D4ED8!important}</style><style>.dashboard-identity{margin:0 0 14px;padding:0 2px;color:#64748b;font-size:13px;line-height:1.5}.dashboard-identity strong{color:#334155;font-weight:700}@media(max-width:600px){.dashboard-identity{font-size:12px;margin-bottom:11px}}</style></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main"><div class="app-container"><div class="dashboard-identity" aria-label="Current signed-in user">Umeingia kama <strong th:text="${role}">ADMIN</strong><span th:if="${username != null}"> · <span th:text="${username}"></span></span></div><div th:replace="~{fragments/incident-map :: incidentMap}"></div>

        <div class="app-stats-grid">
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${totalReports != null ? totalReports : 0}">0</div>
                <div class="label">Total Reports</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#DC2626;">
                <div class="value" style="color:#DC2626;" th:text="${newReports != null ? newReports : 0}">0</div>
                <div class="label">New Reports</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${totalWb != null ? totalWb : 0}">0</div>
                <div class="label">Whistleblower</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${totalUsers != null ? totalUsers : 0}">0</div>
                <div class="label">Total Users</div>
            </div>
        </div>

        <div class="app-card" th:if="${recentReports != null && !recentReports.isEmpty()}">
            <h2>📋 Recent Reports</h2>
            <div th:each="r : ${recentReports}" class="app-list-item">
                <div>
                    <strong style="color:#0F172A; font-family:monospace;" th:text="${r.reportId}"></strong>
                    <span style="margin-left:10px; color:#2563EB; font-weight:600;" th:text="${r.attackTypeLabel}"></span>
                    <br>
                    <span style="font-size:13px;" th:text="${r.title}"></span>
                    <br>
                    <small style="color:#64748B;">
                        <span th:text="${r.reporterName}"></span> |
                        <span th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="app-btn app-btn-primary">View</a>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
