<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main">
    <div class="app-container">
        <h1 class="page-title">👑 Admin Dashboard</h1>

        <div class="app-stats-grid">
            <div class="app-stat-box">
                <div class="value" th:text="${totalReports != null ? totalReports : 0}">0</div>
                <div class="label">Total Reports</div>
            </div>
            <div class="app-stat-box">
                <div class="value" style="color:#DC2626;" th:text="${newReports != null ? newReports : 0}">0</div>
                <div class="label">New Reports</div>
            </div>
            <div class="app-stat-box">
                <div class="value" style="color:#06B6D4;" th:text="${totalWb != null ? totalWb : 0}">0</div>
                <div class="label">Whistleblower</div>
            </div>
            <div class="app-stat-box">
                <div class="value" style="color:#16A34A;" th:text="${totalUsers != null ? totalUsers : 0}">0</div>
                <div class="label">Total Users</div>
            </div>
        </div>

        <div class="app-card" th:if="${recentReports != null && !recentReports.isEmpty()}">
            <h2>📋 Recent Reports</h2>
            <div th:each="r : ${recentReports}" class="app-list-item">
                <div>
                    <strong style="color:#0A1628; font-family:monospace;" th:text="${r.reportId}"></strong>
                    <span style="margin-left:10px; color:#1A3A5C; font-weight:600;" th:text="${r.attackTypeLabel}"></span>
                    <br>
                    <span style="font-size:13px;" th:text="${r.title}"></span>
                    <br>
                    <small style="color:#64748B;">
                        <span th:text="${r.reporterName}"></span> |
                        <span th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="app-btn app-btn-primary">View</a>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
