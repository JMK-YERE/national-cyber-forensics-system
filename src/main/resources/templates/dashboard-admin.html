<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Cyber Forensics</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main">
    <div class="app-container">
        <h1 class="page-title">👑 Admin Dashboard</h1>

        <div class="app-stats-grid">
            <div class="app-stat-box">
                <div class="value" th:text="${totalReports != null ? totalReports : 0}">0</div>
                <div class="label">Total Reports</div>
            </div>
            <div class="app-stat-box">
                <div class="value" style="color: #DC2626;" th:text="${newReports != null ? newReports : 0}">0</div>
                <div class="label">New Reports</div>
            </div>
            <div class="app-stat-box">
                <div class="value" style="color: #06B6D4;" th:text="${totalWb != null ? totalWb : 0}">0</div>
                <div class="label">Whistleblower</div>
            </div>
            <div class="app-stat-box">
                <div class="value" style="color: #16A34A;" th:text="${totalUsers != null ? totalUsers : 0}">0</div>
                <div class="label">Total Users</div>
            </div>
        </div>

        <div class="app-card" th:if="${recentReports != null && !recentReports.isEmpty()}">
            <h2>📋 Recent Reports</h2>
            <div th:each="r : ${recentReports}" style="display:flex; justify-content:space-between; align-items:center; padding:14px; margin:8px 0; background:rgba(240,253,244,0.7); border-left:4px solid #14532D; border-radius:10px; flex-wrap:wrap; gap:10px;">
                <div>
                    <strong style="color:#0B3D2E; font-family:monospace;" th:text="${r.reportId}"></strong>
                    <span style="margin-left:10px; color: #166534;" th:text="${r.attackTypeLabel}"></span>
                    <br>
                    <span style="font-size:13px;" th:text="${r.title}"></span>
                    <br>
                    <small style="color:#888;">
                        <span th:text="${r.reporterName}"></span> |
                        <span th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="app-btn app-btn-primary">View</a>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
