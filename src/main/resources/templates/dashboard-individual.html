<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.dashboard} + ' - ' + #{app.title}">Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="nav-links">
        <a th:href="@{/dashboard}" th:text="#{nav.dashboard}">Dashboard</a>
        <a th:href="@{/report-attack}" th:text="#{nav.report}">Report</a>
        <a th:href="@{/my-accounts}" th:text="#{nav.myAccounts}">My Accounts</a>
        <a th:href="@{/ai/assistant}" th:text="#{nav.ai}">AI</a>
        <a th:href="@{/tools/security-center}" th:text="#{nav.tools}">Tools</a>
        <!-- LANGUAGE SWITCHER -->
        <span style="color:var(--gold); margin-left:15px;">
            <a th:href="@{/lang?lang=sw&redirect=/dashboard}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'sw'} ? 'active-lang'">SW</a>
            <a th:href="@{/lang?lang=en&redirect=/dashboard}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'en'} ? 'active-lang'">EN</a>
            <a th:href="@{/lang?lang=fr&redirect=/dashboard}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'fr'} ? 'active-lang'">FR</a>
            <a th:href="@{/lang?lang=ar&redirect=/dashboard}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'ar'} ? 'active-lang'">AR</a>
        </span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="logout-btn" th:text="#{nav.logout}">Logout</button>
        </form>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1><span th:text="#{dashboard.welcome}">Welcome</span>, <span th:text="${username}">User</span>!</h1>
        <p>Hii ni dashboard yako ya kibinafsi.</p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${user.securityScore != null ? user.securityScore : 0}">0</div>
            <div class="stat-label" th:text="#{dashboard.securityScore}">Security Score</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user.countSocialAccounts()}">0</div>
            <div class="stat-label" th:text="#{dashboard.socialAccounts}">Social Accounts</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
            <div class="stat-label" th:text="#{dashboard.twoFactor}">2FA</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
            <div class="stat-label" th:text="#{dashboard.breachChecked}">Breach Checked</div>
        </div>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.quickActions}">Quick Actions</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;">
            <a th:href="@{/report-attack}" class="btn btn-primary" th:text="#{nav.report}">Report</a>
            <a th:href="@{/ai/assistant}" class="btn" th:text="#{nav.ai}">AI</a>
            <a th:href="@{/my-accounts}" class="btn" th:text="#{nav.myAccounts}">My Accounts</a>
            <a th:href="@{/tools/security-center}" class="btn" th:text="#{nav.tools}">Tools</a>
        </div>
    </div>
</div>
</body>
</html>
