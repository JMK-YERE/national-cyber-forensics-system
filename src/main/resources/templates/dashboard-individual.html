<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Security Dashboard | Cyber Forensics TZ</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
<style>
.section-mark{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;border-radius:6px;background:#e8f6f2;color:#15803d;font-size:9px;letter-spacing:.05em;font-weight:900;vertical-align:middle;margin-right:5px}
.report-type{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#eef6ff;color:#1769aa;font-size:10px;font-weight:800;vertical-align:middle}
.app-list-item{transition:.18s;border-radius:12px}.app-list-item:hover{background:#f7fcfa;box-shadow:0 5px 16px rgba(4,70,55,.07);transform:translateY(-1px)}
<style>.cyber-visual{position:relative;min-height:150px;margin:0 0 22px;overflow:hidden;background:linear-gradient(120deg,#022c22,#064e3b 52%,#087443);color:#dffbf1;padding:24px;border-left:3px solid #22c55e}.cyber-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(134,239,172,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(134,239,172,.08) 1px,transparent 1px);background-size:26px 26px;transform:perspective(300px) rotateX(58deg) scale(1.5);transform-origin:center bottom;opacity:.65}.cyber-scan{position:absolute;top:-20%;left:0;width:2px;height:140%;background:#5eead4;box-shadow:0 0 18px #34d399;animation:cyberScan 5s linear infinite}.cyber-orbit{position:absolute;right:8%;top:50%;width:90px;height:90px;border:1px solid rgba(167,243,208,.35);border-radius:50%;transform:translateY(-50%);box-shadow:0 0 30px rgba(16,185,129,.15)}.cyber-orbit:before{content:"";position:absolute;inset:14px;border:1px dashed rgba(167,243,208,.45);border-radius:50%}.cyber-orbit i{position:absolute;width:7px;height:7px;background:#6ee7b7;border-radius:50%;top:50%;left:50%;transform-origin:0 0;box-shadow:0 0 12px #34d399}.cyber-orbit i:nth-child(1){animation:orbit1 3.5s linear infinite}.cyber-orbit i:nth-child(2){animation:orbit2 5s linear infinite}.cyber-orbit i:nth-child(3){animation:orbit3 7s linear infinite}.cyber-visual-copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:5px}.cyber-visual-copy span{font:800 9px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;color:#86efac}.cyber-visual-copy strong{font-size:23px;color:#fff}.cyber-visual-copy small{font-size:11px;color:#b7e8d4}@keyframes cyberScan{from{transform:translateX(0)}to{transform:translateX(100vw)}}@keyframes orbit1{to{transform:rotate(360deg) translateX(42px)}}@keyframes orbit2{to{transform:rotate(-360deg) translateX(30px)}}@keyframes orbit3{to{transform:rotate(360deg) translateX(20px)}}@media(max-width:560px){.cyber-visual{min-height:125px;padding:18px 14px}.cyber-visual-copy strong{font-size:18px}.cyber-orbit{right:-10px;width:72px;height:72px}.cyber-visual-copy small{max-width:65%;font-size:10px}}</style></style><style id="deep-green-dashboard-polish">.app-main{background:radial-gradient(circle at 90% 0%,#e2f8ea 0,#f4faf6 32%,#f4faf6 100%)}.app-card,.db-card,.fc,.pc,.a-card{border-color:#d6e9df;box-shadow:0 8px 24px rgba(2,44,34,.06)}.app-stat-box{border-top-color:#16a34a!important}.app-stat-box .value{color:#15803d!important}.app-btn-primary{background:linear-gradient(135deg,#065f46,#16a34a)!important}.fc a,.pc a{background:#15803d!important}.fc a:hover,.pc a:hover{background:#166534!important}</style></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main"><div class="app-container"><section class="cyber-visual" aria-label="Cyber forensics overview">
<div class="cyber-grid"></div><div class="cyber-scan"></div><div class="cyber-orbit"><i></i><i></i><i></i></div>
<div class="cyber-visual-copy"><span>CYBER FORENSICS // LIVE OVERVIEW</span><strong>Operational intelligence</strong><small>Incidents • Evidence • Response • Risk</small></div>
</section></div>
    <div class="app-container">
        <div style="background:linear-gradient(135deg, #063b2c, #15803d 55%, #15803d); color:white; padding:30px; border-radius:16px; margin-bottom:20px; box-shadow:0 10px 30px rgba(6,78,59,0.3);">
            <h1 style="color:white; margin:0; font-size:28px;">Karibu, <span th:text="${username}">User</span>!</h1>
            <p style="color:rgba(255,255,255,0.9); margin-top:8px;">Dashibodi yako ya usalama wa mtandao</p>
        </div>

        <div class="app-stats-grid">
            <div class="app-stat-box" style="border-top-color:#16A34A;">
                <div class="value" style="color:#16A34A;" th:text="${user != null && user.securityScore != null ? user.securityScore : 0}">0</div>
                <div class="label">Security Score</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#16A34A;">
                <div class="value" style="color:#16A34A;" th:text="${user != null ? user.countSocialAccounts() : 0}">0</div>
                <div class="label">Social Accounts</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#16A34A;">
                <div class="value" style="color:#16A34A;" th:text="${user != null && user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
                <div class="label">2FA</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#16A34A;">
                <div class="value" style="color:#16A34A;" th:text="${user != null && user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
                <div class="label">Breach</div>
            </div>
        </div>

        <div class="app-card">
            <h2><span class="section-mark">REPORTS</span> Ripoti Zangu</h2>
            <div th:if="${myReports == null || myReports.isEmpty()}" style="text-align:center; padding:30px; color:#64748B;">
                <p>Hakuna ripoti bado.</p>
                <a th:href="@{/report-attack}" class="app-btn app-btn-primary" style="margin-top:15px;">Report Incident</a>
            </div>
            <div th:each="r : ${myReports}" class="app-list-item">
                <div>
                    <strong style="color:#064E3B; font-family:monospace;" th:text="${r.reportId}"></strong>
                    <span class="report-type" th:text="${r.attackTypeLabel}"></span>
                    <br>
                    <small style="color:#64748B;">
                        <span th:text="${r.title}"></span> |
                        <strong th:text="${r.status}"></strong>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="app-btn app-btn-primary">Open Report</a>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
