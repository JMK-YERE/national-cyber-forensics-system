<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{nav.dashboard}">Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;">
            👤 <span th:text="#{dashboard.welcome}">Welcome</span>, <span th:text="${username}">User</span>!
        </h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 10px;" th:text="#{dashboard.personal}">
            This is your personal dashboard.
        </p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.securityScore != null ? user.securityScore : 0}">0</div>
            <div class="stat-label" th:text="#{dashboard.securityScore}">Security Score</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null ? user.countSocialAccounts() : 0}">0</div>
            <div class="stat-label" th:text="#{dashboard.socialAccounts}">Social Accounts</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
            <div class="stat-label" th:text="#{dashboard.twoFactor}">2FA</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
            <div class="stat-label" th:text="#{dashboard.breachChecked}">Breach Checked</div>
        </div>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.quickActions}">Quick Actions</h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-top:15px;">
            <a th:href="@{/report-attack}" class="btn btn-danger" style="text-align:center; padding:20px; text-decoration:none;">
                🚨 <span th:text="#{nav.report}">Report Attack</span>
            </a>
            <a th:href="@{/ai/assistant}" class="btn btn-primary" style="text-align:center; padding:20px; text-decoration:none;">
                🤖 <span th:text="#{nav.ai}">AI Assistant</span>
            </a>
            <a th:href="@{/notifications}" class="btn" style="text-align:center; padding:20px; text-decoration:none;">
                🔔 <span th:text="#{nav.notifications}">Notifications</span>
            </a>
            <a th:href="@{/tools/security-center}" class="btn" style="text-align:center; padding:20px; text-decoration:none;">
                🛡️ <span th:text="#{nav.tools}">Security Tools</span>
            </a>
        </div>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.myReports}">My Reports</h2>
        <p th:text="#{dashboard.reportsDesc}">View your reports and communication with admin.</p>
        <a th:href="@{/report-attack}" class="btn btn-primary" style="margin-top:15px; text-decoration:none;">
            📋 <span th:text="#{dashboard.viewMyReports}">View My Reports</span>
        </a>
    </div>
</div>
</body>
</html>
