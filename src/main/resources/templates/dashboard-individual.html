<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        .user-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .user-btn { display: flex; align-items: center; gap: 12px; padding: 18px 20px; background: white; border: 2px solid rgba(15,37,87,0.15); border-radius: 10px; text-decoration: none; color: #0f2557; font-weight: 600; transition: all 0.2s; }
        .user-btn:hover { background: #0f2557; color: white; transform: translateY(-2px); }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;">👤 Karibu, <span th:text="${username}">User</span>!</h1>
        <p style="color: rgba(255,255,255,0.9);">Hii ni dashibodi yako binafsi.</p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.securityScore != null ? user.securityScore : 0}">0</div>
            <div class="stat-label">Security Score</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null ? user.countSocialAccounts() : 0}">0</div>
            <div class="stat-label">Social Accounts</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
            <div class="stat-label">2FA</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
            <div class="stat-label">Breach Checked</div>
        </div>
    </div>

    <div class="card">
        <h2>⚡ Vitendo vya Haraka</h2>
        <div class="user-grid">
            <a th:href="@{/report-attack}" class="user-btn"><span style="font-size: 24px;">🚨</span><span>Ripoti Tukio</span></a>
            <a th:href="@{/ai/assistant}" class="user-btn"><span style="font-size: 24px;">🤖</span><span>Msaidizi wa AI</span></a>
            <a th:href="@{/notifications}" class="user-btn"><span style="font-size: 24px;">🔔</span><span>Taarifa</span></a>
            <a th:href="@{/tools/security-center}" class="user-btn"><span style="font-size: 24px;">🛡️</span><span>Zana za Usalama</span></a>
        </div>
    </div>

    <div class="card">
        <h2>📋 Ripoti Zangu</h2>
        <div th:if="${myReports == null || myReports.isEmpty()}" style="text-align:center; padding:30px; color:#888;">
            <p>Hakuna ripoti bado. <a th:href="@{/report-attack}">Anza kuunda ripoti</a></p>
        </div>
        <div th:each="r : ${myReports}"
             style="display:flex; justify-content:space-between; align-items:center; padding:12px 15px; margin:8px 0; background:rgba(15,37,87,0.03); border-left:4px solid #0f2557; border-radius:8px; flex-wrap:wrap; gap:10px;">
            <div>
                <strong style="color:#c9a227; font-family:monospace;" th:text="${r.reportId}"></strong>
                <span style="margin-left:10px;" th:text="${r.attackTypeLabel}"></span>
                <br>
                <small style="color:#888;">
                    <span th:text="${r.title}"></span> |
                    <strong th:text="${r.status}"></strong> |
                    <span th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                </small>
            </div>
            <a th:href="@{'/report-attack/view/' + ${r.id}}"
               style="background:#0f2557; color:white; padding:6px 15px; border-radius:6px; text-decoration:none; font-size:12px;">
               👁️ View
            </a>
        </div>
    </div>
</div>
</body>
</html>
