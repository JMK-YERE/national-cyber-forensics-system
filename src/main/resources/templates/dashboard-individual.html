<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Security Dashboard | Cyber Forensics TZ</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
<style>
.section-mark{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;border-radius:6px;background:#e8f6f2;color:#2563EB;font-size:9px;letter-spacing:.05em;font-weight:900;vertical-align:middle;margin-right:5px}
.report-type{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#eef6ff;color:#1769aa;font-size:10px;font-weight:800;vertical-align:middle}
.app-list-item{transition:.18s;border-radius:12px}.app-list-item:hover{background:#f7fcfa;box-shadow:0 5px 16px rgba(4,70,55,.07);transform:translateY(-1px)}</style><style id="deep-green-dashboard-polish">.app-main{background:radial-gradient(circle at 90% 0%,#eff6ff 0,#f6f8fb 32%,#f6f8fb 100%)}.app-card,.db-card,.fc,.pc,.a-card{border-color:#e2e8f0;box-shadow:0 8px 24px rgba(2,44,34,.06)}.app-stat-box{border-top-color:#2563EB!important}.app-stat-box .value{color:#2563EB!important}.app-btn-primary{background:linear-gradient(135deg,#1D4ED8,#2563EB)!important}.fc a,.pc a{background:#2563EB!important}.fc a:hover,.pc a:hover{background:#1D4ED8!important}</style><style>.dashboard-identity{margin:0 0 14px;padding:0 2px;color:#64748b;font-size:13px;line-height:1.5}.dashboard-identity strong{color:#334155;font-weight:700}@media(max-width:600px){.dashboard-identity{font-size:12px;margin-bottom:11px}}</style></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main"><div class="app-container"><div class="dashboard-identity" aria-label="Current signed-in user"><span th:text="#{nav.signedInAs}">Signed in as</span> <strong th:text="${role}">INDIVIDUAL</strong><span th:if="${username != null}"> · <span th:text="${username}"></span></span></div><div th:replace="~{fragments/incident-map :: incidentMap}"></div>

        <div class="app-stats-grid">
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null && user.securityScore != null ? user.securityScore : 0}">0</div>
                <div class="label" th:text="#{dashboard.securityScore}">Security Score</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null ? user.countSocialAccounts() : 0}">0</div>
                <div class="label" th:text="#{dashboard.socialAccounts}">Social Accounts</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null && user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
                <div class="label">2FA</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null && user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
                <div class="label" th:text="#{dashboard.breachChecked}">Breach</div>
            </div>
        </div>

        <div class="app-card">
            <h2><span class="section-mark">REPORTS</span> Ripoti Zangu</h2>
            <div th:if="${myReports == null || myReports.isEmpty()}" style="text-align:center; padding:30px; color:#64748B;">
                <p th:text="#{dashboard.noReports}">Hakuna ripoti bado.</p>
                <a th:href="@{/report-attack}" class="app-btn app-btn-primary" style="margin-top:15px;" th:text="#{nav.report}">Report Incident</a>
            </div>
            <div th:each="r : ${myReports}" class="app-list-item">
                <div>
                    <strong style="color:#0F172A; font-family:monospace;" th:text="${r.reportId}"></strong>
                    <span class="report-type" th:text="${r.attackTypeLabel}"></span>
                    <br>
                    <small style="color:#64748B;">
                        <span th:text="${r.title}"></span> |
                        <strong th:text="${r.status}"></strong>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="app-btn app-btn-primary" th:text="#{general.openReport}">Open Report</a>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
