<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Security Dashboard | Cyber Forensics TZ</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
<style>
.section-mark{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;border-radius:6px;background:#e8f6f2;color:#2563EB;font-size:9px;letter-spacing:.05em;font-weight:900;vertical-align:middle;margin-right:5px}
.report-type{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#eef6ff;color:#1769aa;font-size:10px;font-weight:800;vertical-align:middle}
.app-list-item{transition:.18s;border-radius:12px}.app-list-item:hover{background:#f7fcfa;box-shadow:0 5px 16px rgba(4,70,55,.07);transform:translateY(-1px)}
</style><style id="deep-green-dashboard-polish">.app-main{background:radial-gradient(circle at 90% 0%,#eff6ff 0,#f6f8fb 32%,#f6f8fb 100%)}.app-card,.db-card,.fc,.pc,.a-card{border-color:#e2e8f0;box-shadow:0 8px 24px rgba(2,44,34,.06)}.app-stat-box{border-top-color:#2563EB!important}.app-stat-box .value{color:#2563EB!important}.app-btn-primary{background:linear-gradient(135deg,#1D4ED8,#2563EB)!important}.fc a,.pc a{background:#2563EB!important}.fc a:hover,.pc a:hover{background:#1D4ED8!important}</style></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main"><div class="app-container">
        <div style="background:linear-gradient(135deg, #334155, #2563EB 55%, #2563EB); color:white; padding:30px; border-radius:16px; margin-bottom:20px; box-shadow:0 10px 30px rgba(6,78,59,0.3);">
            <h1 style="color:white; margin:0; font-size:28px;">Karibu, <span th:text="${username}">User</span>!</h1>
            <p style="color:rgba(255,255,255,0.9); margin-top:8px;">Dashibodi yako ya usalama wa mtandao</p>
        </div>

        <div th:replace="~{fragments/incident-map :: incidentMap}"></div>

        <div class="app-stats-grid">
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null && user.securityScore != null ? user.securityScore : 0}">0</div>
                <div class="label">Security Score</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null ? user.countSocialAccounts() : 0}">0</div>
                <div class="label">Social Accounts</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null && user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
                <div class="label">2FA</div>
            </div>
            <div class="app-stat-box" style="border-top-color:#2563EB;">
                <div class="value" style="color:#2563EB;" th:text="${user != null && user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
                <div class="label">Breach</div>
            </div>
        </div>

        <div class="app-card">
            <h2><span class="section-mark">REPORTS</span> Ripoti Zangu</h2>
            <div th:if="${myReports == null || myReports.isEmpty()}" style="text-align:center; padding:30px; color:#64748B;">
                <p>Hakuna ripoti bado.</p>
                <a th:href="@{/report-attack}" class="app-btn app-btn-primary" style="margin-top:15px;">Report Incident</a>
            </div>
            <div th:each="r : ${myReports}" class="app-list-item">
                <div>
                    <strong style="color:#0F172A; font-family:monospace;" th:text="${r.reportId}"></strong>
                    <span class="report-type" th:text="${r.attackTypeLabel}"></span>
                    <br>
                    <small style="color:#64748B;">
                        <span th:text="${r.title}"></span> |
                        <strong th:text="${r.status}"></strong>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="app-btn app-btn-primary">Open Report</a>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
