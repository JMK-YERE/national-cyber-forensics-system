<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main">
    <div class="app-container">
        <h1 class="page-title">👤 Karibu, <span th:text="${username}">User</span>!</h1>

        <div class="app-stats-grid">
            <div class="app-stat-box">
                <div class="value" th:text="${user != null && user.securityScore != null ? user.securityScore : 0}">0</div>
                <div class="label">Security Score</div>
            </div>
            <div class="app-stat-box">
                <div class="value" th:text="${user != null ? user.countSocialAccounts() : 0}">0</div>
                <div class="label">Social Accounts</div>
            </div>
            <div class="app-stat-box">
                <div class="value" th:text="${user != null && user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
                <div class="label">2FA</div>
            </div>
            <div class="app-stat-box">
                <div class="value" th:text="${user != null && user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
                <div class="label">Breach</div>
            </div>
        </div>

        <div class="app-card">
            <h2>📋 Ripoti Zangu</h2>
            <div th:if="${myReports == null || myReports.isEmpty()}" style="text-align:center; padding:30px; color:#64748B;">
                <p>Hakuna ripoti bado.</p>
                <a th:href="@{/report-attack}" class="app-btn app-btn-primary" style="margin-top:15px;">🚨 Anza Ripoti</a>
            </div>
            <div th:each="r : ${myReports}" class="app-list-item">
                <div>
                    <strong style="color:#0A1628; font-family:monospace;" th:text="${r.reportId}"></strong>
                    <span style="margin-left:10px; color:#1A3A5C; font-weight:600;" th:text="${r.attackTypeLabel}"></span>
                    <br>
                    <small style="color:#64748B;">
                        <span th:text="${r.title}"></span> |
                        <strong th:text="${r.status}"></strong>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="app-btn app-btn-primary">View</a>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
