<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;">👤 Karibu, <span th:text="${username}">User</span>!</h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Hii ni dashibodi yako binafsi.</p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.securityScore != null ? user.securityScore : 0}">0</div>
            <div class="stat-label">Security Score</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null ? user.countSocialAccounts() : 0}">0</div>
            <div class="stat-label">Social Accounts</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.has2fa != null && user.has2fa ? '✅' : '❌'}">❌</div>
            <div class="stat-label">2FA</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${user != null && user.breachChecked != null && user.breachChecked ? '✅' : '❌'}">❌</div>
            <div class="stat-label">Breach Checked</div>
        </div>
    </div>

    <div class="card">
        <h2>Vitendo vya Haraka</h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-top:15px;">
            <a th:href="@{/report-attack}" class="btn btn-danger" style="text-align:center; padding:20px; text-decoration:none;">
                🚨 Ripoti Tukio
            </a>
            <a th:href="@{/ai/assistant}" class="btn btn-primary" style="text-align:center; padding:20px; text-decoration:none;">
                🤖 Msaidizi wa AI
            </a>
            <a th:href="@{/notifications}" class="btn" style="text-align:center; padding:20px; text-decoration:none;">
                🔔 Taarifa
            </a>
            <a th:href="@{/tools/security-center}" class="btn" style="text-align:center; padding:20px; text-decoration:none;">
                🛡️ Zana za Usalama
            </a>
        </div>
    </div>

    <div class="card">
        <h2>Ripoti Zangu</h2>
        <p>Ona ripoti zako na mawasiliano na admin.</p>
        <a th:href="@{/report-attack}" class="btn btn-primary" style="margin-top:15px; text-decoration:none;">
            📋 Ona Ripoti Zangu
        </a>
    </div>
</div>
</body>
</html>
