<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Details</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ Whistleblower Portal</div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}">Home</a>
        <a th:href="@{/whistleblower/track}">Track Report</a>
    </div>
</div>

<div class="container" style="max-width: 800px; margin: 30px auto;">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 25px;">
        <h1 style="color: white; margin: 0;" th:text="${report.title}">Report Title</h1>
        <p style="color: rgba(255,255,255,0.9); margin: 10px 0 0 0;">
            Tracking: <strong th:text="${report.trackingCode}"></strong> |
            Status: <strong th:text="${report.status}"></strong>
        </p>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h2>💬 Messages & Updates</h2>
        <p style="color: #666; font-size: 13px;">Mawasiliano kati yako na timu yetu</p>

        <div th:each="m : ${messages}" style="padding: 15px; margin: 10px 0; border-radius: 8px;"
             th:style="${m.senderType == 'ADMIN'} ? 'background: rgba(201,162,39,0.12); border-left: 4px solid #c9a227;' : (${m.senderType == 'SYSTEM'} ? 'background: rgba(27,122,74,0.08); border-left: 4px solid #1b7a4a;' : 'background: rgba(15,37,87,0.08); border-left: 4px solid #0f2557;')">
            <div style="font-size: 12px; font-weight: bold; margin-bottom: 8px;">
                <span th:if="${m.senderType == 'ADMIN'}">👤 Security Team</span>
                <span th:if="${m.senderType == 'REPORTER'}">👤 You</span>
                <span th:if="${m.senderType == 'SYSTEM'}">⚙️ System</span>
                <span style="float: right; font-weight: normal; color: #888;"
                      th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <div th:text="${m.message}" style="white-space: pre-wrap;"></div>
        </div>

        <form th:action="@{'/whistleblower/track/' + ${report.id} + '/reply'}" method="post" style="margin-top: 25px;">
            <input type="hidden" name="code" th:value="${report.trackingCode}">
            <textarea name="message" rows="3" required placeholder="Andika ujumbe wako..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(15,37,87,0.2);"></textarea>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">📤 Send Message</button>
        </form>
    </div>
</div>
</body>
</html>
