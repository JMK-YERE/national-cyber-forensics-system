<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{notifications.title}">Notifications</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;">🔔 <span th:text="#{notifications.title}">Notifications</span></h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Taarifa zako binafsi</p>
    </div>

    <div class="card">
        <form th:action="@{/notifications/read-all}" method="post" style="display:inline;">
            <button type="submit" class="btn">✅ <span th:text="#{notifications.markAll}">Mark All as Read</span></button>
        </form>
    </div>

    <div class="card">
        <div th:if="${notifications == null || notifications.isEmpty()}" style="text-align:center; padding:40px; color:#888;">
            <p style="font-size:50px;">🔔</p>
            <p th:text="#{notifications.empty}">Hakuna taarifa bado.</p>
        </div>

        <div th:each="n : ${notifications}" style="padding:15px; margin:10px 0; border-radius:8px;"
             th:style="${!n.isRead} ? 'background: rgba(0,255,157,0.08); border-left: 4px solid #00ff9d;' : 'background: rgba(0,0,0,0.03); border-left: 4px solid #ccc;'">
            <div style="display:flex; justify-content:space-between; font-size:12px;">
                <strong th:text="${n.title}"></strong>
                <span style="color:#888;" th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <p style="margin:8px 0;" th:text="${n.message}"></p>
            <div>
                <span th:if="${!n.isRead}" style="background:#00ff9d; color:#0f2557; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold;">NEW</span>
                <!-- Open Report — inaonekana tu kama linkUrl ipo -->
                <a th:if="${n.linkUrl != null && !n.linkUrl.isEmpty()}"
                   th:href="${n.linkUrl}"
                   class="btn"
                   style="padding:4px 10px; font-size:11px; margin-left:10px; text-decoration:none; background:#0f2557; color:white; border-radius:4px;">
                   Open Report
                </a>
                <form th:if="${!n.isRead}" th:action="@{'/notifications/read/' + ${n.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn" style="padding:4px 10px; font-size:11px; margin-left:10px;">Mark Read</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
