<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Cyber Forensics TZ</title><link rel="stylesheet" th:href="@{/css/theme.css}">
<style>.notice{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:14px;margin:9px 0;background:#fff}.notice.unread{background:#effaf6;border-left-color:var(--cyan)}.notice-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px}.notice-time{color:var(--muted);font-size:10px}.notice-msg{font-size:12px;margin:8px 0;color:var(--ink)}.notice-actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--mint);color:var(--forest-800);font-size:9px;font-weight:900}</style></head><body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container">
<div class="app-card" style="background:linear-gradient(135deg,var(--forest-950),var(--forest-800));color:#fff"><h1 style="color:#fff;margin:0">🔔 Notifications</h1><p style="color:#dff8ee;margin-top:6px;font-size:12px">Updates za reports, cases na majibu ya timu.</p></div>
<div class="app-card"><form th:action="@{/notifications/read-all}" method="post"><button class="app-btn app-btn-outline" type="submit">✓ Mark all as read</button></form></div>
<section class="app-card"><div th:if="${notifications == null || notifications.isEmpty()}" style="text-align:center;padding:45px;color:var(--muted)"><div style="font-size:42px">🔔</div><p>Hakuna notifications bado.</p></div>
<div th:each="n : ${notifications}" class="notice" th:classappend="${!n.isRead ? ' unread' : ''}"><div class="notice-top"><strong th:text="${n.title}">Notification</strong><span class="notice-time" th:text="${#temporals.format(n.createdAt,'yyyy-MM-dd HH:mm')}">date</span></div><span th:if="${!n.isRead}" class="pill">NEW</span><div class="notice-msg" th:text="${n.message}">Message</div><div class="notice-actions"><a th:if="${n.linkUrl != null && !n.linkUrl.isEmpty()}" th:href="${n.linkUrl}" class="app-btn app-btn-primary">Open</a><form th:if="${!n.isRead}" th:action="@{'/notifications/read/' + ${n.id}}" method="post"><button class="app-btn app-btn-outline" type="submit">Mark read</button></form><form th:action="@{'/notifications/delete/' + ${n.id}}" method="post" onsubmit="return confirm('Delete this notification?')"><button class="app-btn app-btn-outline" type="submit">Delete</button></form></div></div></section>
</div></main><script th:src="@{/js/app.js}"></script></body></html>
