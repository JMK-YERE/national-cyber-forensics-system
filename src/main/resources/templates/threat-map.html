<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.threatMap} + ' - ' + #{app.title}">Threat Map</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; border-radius: 8px; border: 2px solid var(--dark-blue); box-shadow: 0 10px 30px rgba(15,37,87,0.2); }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card">
        <h1 th:text="#{nav.threatMap}">Threat Map</h1>
    </div>
    <div class="card">
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    const regionCounts = /*[[${regionCounts}]]*/ {};
    const regionCoords = /*[[${regionCoords}]]*/ {};
    const map = L.map('map').setView([-6.3690, 34.8888], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    for (const [region, count] of Object.entries(regionCounts)) {
        const coords = regionCoords[region];
        if (!coords) continue;
        let color = count === 0 ? '#1b7a4a' : count <= 5 ? '#d97706' : count <= 15 ? '#c73030' : '#8b1a1a';
        L.circleMarker([coords[0], coords[1]], { radius: 10, fillColor: color, color: '#0f2557', weight: 2, fillOpacity: 0.7 })
            .bindPopup('<b>' + region + '</b><br>' + count + ' incidents').addTo(map);
    }
</script>
</body>
</html>
