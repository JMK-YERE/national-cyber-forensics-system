<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:inline="javascript"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Incident Map</title><link rel="stylesheet" th:href="@{/css/theme.css}">
<style>.map-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow)}#threatMap{height:560px;border-radius:11px;overflow:hidden}.map-meta{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.map-pill{background:#f4faf7;border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:800}.map-note{font-size:12px;color:var(--muted);margin-bottom:14px}@media(max-width:700px){#threatMap{height:440px}}</style></head><body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container"><h1 class="page-title">◉ Cyber Incident Map</h1>
<div class="map-wrap"><div class="map-note">Locations are aggregated by region from submitted reports. No reporter identity is exposed on this public map.</div><div class="map-meta"><div class="map-pill">Total: <span id="totalCount">0</span></div><div class="map-pill">High: <span id="highCount">0</span></div><div class="map-pill">Medium: <span id="medCount">0</span></div><div class="map-pill">Low: <span id="lowCount">0</span></div></div><div id="threatMap"></div></div>
</div></main>
<script th:src="@{/js/app.js}"></script>
<script>
const reports=/*[[${mapPoints}]]*/[];
const regions={Arusha:[-3.3869,36.6830],Dar:[-6.7924,39.2083],"Dar es Salaam":[-6.7924,39.2083],Dodoma:[-6.1630,35.7516],Geita:[-2.8728,32.2294],Iringa:[-7.7696,35.6914],Kagera:[-1.3290,31.8090],Katavi:[-6.8270,31.0750],Kigoma:[-4.8769,29.6267],Kilimanjaro:[-3.0674,37.3556],Lindi:[-9.9931,39.7165],Manyara:[-4.3150,36.9541],Mara:[-1.7757,34.1532],Mbeya:[-8.9094,33.4608],Morogoro:[-6.8278,37.6591],Mtwara:[-10.2736,40.1828],Mwanza:[-2.5164,32.9175],Njombe:[-9.3333,34.7667],Pwani:[-7.3238,38.7660],Rukwa:[-8.0109,31.6107],Ruvuma:[-10.6870,35.6500],Shinyanga:[-3.6619,33.4232],Simiyu:[-2.9995,33.7940],Singida:[-4.8149,34.7439],Songwe:[-8.2582,32.5325],Tabora:[-5.0160,32.8009],Tanga:[-5.0689,39.0982],Zanzibar:[-6.1659,39.2026]};
const map=document.getElementById('threatMap');function project(lat,lon){return{x:((lon+180)/360)*100,y:((90-lat)/180)*100}}
const grouped={};let high=0,med=0,low=0;reports.forEach(r=>{const k=r.region;grouped[k]??={region:k,total:0,high:0,medium:0,low:0,types:{}};grouped[k].total++;const p=(r.priority||'MEDIUM').toUpperCase();if(p==='HIGH'){grouped[k].high++;high++}else if(p==='LOW'){grouped[k].low++;low++}else{grouped[k].medium++;med++}grouped[k].types[r.type]=(grouped[k].types[r.type]||0)+1});
Object.values(grouped).forEach(g=>{const pos=regions[g.region]||regions[g.region.trim()];if(!pos)return;const severity=g.high?'HIGH':g.medium?'MEDIUM':'LOW';const color=severity==='HIGH'?'#dc3b45':severity==='MEDIUM'?'#d99000':'#08a879';const c=document.createElement('button');c.type='button';c.className='map-dot '+(severity==='LOW'?'low':severity==='MEDIUM'?'medium':'');const p=project(pos[0],pos[1]);c.style.cssText='position:absolute;z-index:5;width:15px;height:15px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;background:'+color+';box-shadow:0 0 8px '+color+';cursor:pointer;left:'+p.x+'%;top:'+p.y+'%;';c.title=g.region+' | Reports: '+g.total;c.innerHTML='<span><b>'+g.region+'</b><br>Reports: '+g.total+'<br>High: '+g.high+' · Medium: '+g.medium+' · Low: '+g.low+'</span>';map.appendChild(c)});
document.getElementById('totalCount').textContent=reports.length;document.getElementById('highCount').textContent=high;document.getElementById('medCount').textContent=med;document.getElementById('lowCount').textContent=low;
</script></body></html>
