<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forensics Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main">
    <div class="app-container">
        <div style="background:linear-gradient(135deg, #064E3B, #16A34A); color:white; padding:30px; border-radius:16px; margin-bottom:20px;">
            <h1 style="color:white; margin:0;">🔬 Forensics Dashboard</h1>
            <p style="color:rgba(255,255,255,0.9); margin-top:8px;">Karibu, <strong th:text="${username}"></strong></p>
        </div>
        <div class="app-stats-grid">
            <div class="app-stat-box"><div class="value" style="color:#16A34A;" th:text="${totalReports != null ? totalReports : 0}">0</div><div class="label">Reports</div></div>
            <div class="app-stat-box"><div class="value" style="color:#DC2626;" th:text="${newReports != null ? newReports : 0}">0</div><div class="label">New</div></div>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
