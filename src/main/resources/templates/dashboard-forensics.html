<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.dashboard} + ' - FORENSICS'">Forensics</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card">
        <h1>🔬 <span th:text="#{nav.dashboard}">Forensics Dashboard</span></h1>
        <p><span th:text="#{dashboard.welcome}">Welcome</span>, <strong th:text="${username}"></strong>!</p>
    </div>

    <div class="stats-grid">
        <div class="stat-box"><div class="stat-value">🔬</div><div class="stat-label">Evidence Files</div></div>
        <div class="stat-box"><div class="stat-value">🔐</div><div class="stat-label">Encrypted</div></div>
        <div class="stat-box"><div class="stat-value">📊</div><div class="stat-label">Chain of Custody</div></div>
        <div class="stat-box"><div class="stat-value">✅</div><div class="stat-label">Verified</div></div>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.quickActions}">Quick Actions</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;">
            <a th:href="@{/incidents}" class="btn btn-primary">📋 <span th:text="#{nav.incidents}">Incidents</span></a>
            <a th:href="@{/cases}" class="btn">📁 <span th:text="#{nav.cases}">Cases</span></a>
            <a th:href="@{/audit}" class="btn">📊 <span th:text="#{nav.audit}">Audit</span></a>
        </div>
    </div>
</div>
</body>
</html>
