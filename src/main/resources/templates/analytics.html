<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Analytics | Cyber Forensics TZ</title>
<link rel="stylesheet" th:href="@{/css/theme.css}">
<style>
.analytics-head{border-left:3px solid #20d6e5;padding:4px 0 4px 15px;margin-bottom:24px}
.analytics-head h1{color:#06382c;margin:0;font-size:28px}.analytics-head p{color:#61736d;margin:4px 0 0;font-size:12px}
.analytics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}
.metric{padding:10px 4px;border-bottom:2px solid #b8dfcb}.metric strong{display:block;font-size:30px;color:#08785a}.metric span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#657b72}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:28px}.chart-block{min-width:0;border-top:1px solid rgba(6,95,70,.14);padding-top:15px}
.chart-block h2{font-size:16px;color:#063b2c;margin:0 0 14px}.chart-box{min-height:280px}
.bar-row{display:grid;grid-template-columns:minmax(100px,.7fr) minmax(120px,1.3fr) 38px;gap:10px;align-items:center;margin:10px 0;font-size:11px}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#31584c}.bar-track{height:12px;background:#e5f1ec;border-radius:999px;overflow:hidden}.bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#08785a,#20d6e5);transition:width .35s ease}.bar-value{text-align:right;font-weight:900;color:#06382c}
.status-list{display:grid;gap:10px}.status-row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #d8e7e1;font-size:12px}.status-row strong{color:#06382c}.status-row span{font-weight:900;color:#08785a}
.empty-chart{color:#71867e;font-size:12px;padding:24px 0}
@media(max-width:800px){.analytics-grid{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}
@media(max-width:480px){.metric strong{font-size:24px}.analytics-head h1{font-size:23px}.bar-row{grid-template-columns:90px minmax(90px,1fr) 30px;font-size:10px}}
html[data-theme="dark"] .analytics-head h1,html[data-theme="dark"] .chart-block h2,html[data-theme="dark"] .bar-value,html[data-theme="dark"] .status-row strong{color:#d9f6ec}
html[data-theme="dark"] .analytics-head p,html[data-theme="dark"] .bar-label,html[data-theme="dark"] .empty-chart{color:#9fc5b6}
html[data-theme="dark"] .metric span{color:#9fc5b6}.bar-track{background:#17382d}.status-row{border-color:#285847}
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container">
<header class="analytics-head"><h1>Data Analytics</h1><p>Incident patterns, geographic concentration, severity and workflow intelligence.</p></header>
<section class="analytics-grid">
<div class="metric"><strong th:text="${total}">0</strong><span>Total reports</span></div>
<div class="metric"><strong th:text="${open}">0</strong><span>Open reports</span></div>
<div class="metric"><strong th:text="${high}">0</strong><span>High / critical</span></div>
<div class="metric"><strong th:text="${users}">0</strong><span>Registered users</span></div>
</section>
<section class="charts">
<article class="chart-block"><h2>Incident categories</h2><div class="chart-box" id="categoryChart"></div></article>
<article class="chart-block"><h2>Reports by region</h2><div class="chart-box" id="regionChart"></div></article>
<article class="chart-block"><h2>Workflow status</h2><div class="chart-box" id="statusChart"></div></article>
</section>
</div></main>
<script th:src="@{/js/app.js}"></script>
<script>
const catLabels=/*[[${categoryLabels}]]*/[],catValues=/*[[${categoryValues}]]*/[];
const regLabels=/*[[${regionLabels}]]*/[],regValues=/*[[${regionValues}]]*/[];
const statLabels=/*[[${statusLabels}]]*/[],statValues=/*[[${statusValues}]]*/[];

function renderBars(id, labels, values){
  const box=document.getElementById(id); if(!box) return;
  if(!labels.length){box.innerHTML='<div class="empty-chart">No data available for this view.</div>';return;}
  const max=Math.max(...values,1);
  box.innerHTML=labels.map((label,i)=>{
    const value=Number(values[i]||0);
    const width=Math.max(2,(value/max)*100);
    return '<div class="bar-row"><span class="bar-label" title="'+escapeHtml(label)+'">'+escapeHtml(label)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+width+'%"></span></span><span class="bar-value">'+value+'</span></div>';
  }).join('');
}
function renderStatus(id,labels,values){
  const box=document.getElementById(id); if(!box) return;
  if(!labels.length){box.innerHTML='<div class="empty-chart">No workflow data available.</div>';return;}
  box.innerHTML='<div class="status-list">'+labels.map((label,i)=>'<div class="status-row"><strong>'+escapeHtml(label)+'</strong><span>'+Number(values[i]||0)+'</span></div>').join('')+'</div>';
}
function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
renderBars('categoryChart',catLabels,catValues);
renderBars('regionChart',regLabels,regValues);
renderStatus('statusChart',statLabels,statValues);
</script>
</body></html>
