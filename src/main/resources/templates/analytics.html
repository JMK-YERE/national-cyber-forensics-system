<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:inline="javascript"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Analytics | Cyber Forensics TZ</title>
<link rel="stylesheet" th:href="@{/css/theme.css}"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>.analytics-head{border-left:3px solid #2563EB;padding:4px 0 4px 15px;margin-bottom:24px}.analytics-head h1{color:#022c22;margin:0;font-size:28px}.analytics-head p{color:#61736d;margin:4px 0 0;font-size:12px}.analytics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}.metric{padding:10px 4px;border-bottom:2px solid #b8dfcb}.metric strong{display:block;font-size:30px;color:#15803d}.metric span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#657b72}.charts{display:grid;grid-template-columns:1fr 1fr;gap:28px}.chart-block{min-width:0;border-top:1px solid rgba(6,95,70,.14);padding-top:15px}.chart-block h2{font-size:16px;color:#063b2c;margin-bottom:12px}.chart-box{height:300px}@media(max-width:800px){.analytics-grid{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}@media(max-width:480px){.metric strong{font-size:24px}.analytics-head h1{font-size:23px}}</style></head><body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="app-main"><div class="app-container">
<header class="analytics-head"><h1>Data Analytics</h1><p>Incident patterns, geographic concentration, severity and workflow intelligence.</p></header>
<section class="analytics-grid"><div class="metric"><strong th:text="${total}">0</strong><span>Total reports</span></div><div class="metric"><strong th:text="${open}">0</strong><span>Open reports</span></div><div class="metric"><strong th:text="${high}">0</strong><span>High / critical</span></div><div class="metric"><strong th:text="${users}">0</strong><span>Registered users</span></div></section>
<section class="charts"><article class="chart-block"><h2>Incident categories</h2><div class="chart-box"><canvas id="categoryChart"></canvas></div></article><article class="chart-block"><h2>Reports by region</h2><div class="chart-box"><canvas id="regionChart"></canvas></div></article><article class="chart-block"><h2>Workflow status</h2><div class="chart-box"><canvas id="statusChart"></canvas></div></article></section>
</div></main><script th:src="@{/js/app.js}"></script><script>
const catLabels=/*[[${categoryLabels}]]*/[],catValues=/*[[${categoryValues}]]*/[];const regLabels=/*[[${regionLabels}]]*/[],regValues=/*[[${regionValues}]]*/[];const statLabels=/*[[${statusLabels}]]*/[],statValues=/*[[${statusValues}]]*/[];
const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}};
new Chart(document.getElementById('categoryChart'),{type:'bar',data:{labels:catLabels,datasets:[{label:'Reports',data:catValues,borderWidth:1}]},options:opts});
new Chart(document.getElementById('regionChart'),{type:'bar',data:{labels:regLabels,datasets:[{label:'Reports',data:regValues,borderWidth:1}]},options:{...opts,indexAxis:'y'}});
new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:statLabels,datasets:[{data:statValues,borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
</script></body></html>
