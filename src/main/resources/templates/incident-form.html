<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Incident | Cyber Forensics TZ</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container"><section class="app-card"><h1>🚨 Report Security Incident</h1><p>Toa taarifa ya tukio la kimtandao kwa incident workflow.</p>
<form th:action="@{/incidents/new}" th:object="${incident}" method="post" style="margin-top:20px"><label>INCIDENT TITLE *</label><input type="text" th:field="*{title}" required><label>DESCRIPTION *</label><textarea th:field="*{description}" rows="5" required></textarea><label>REPORTER NAME *</label><input type="text" th:field="*{reporter}" required><label>SEVERITY</label><select th:field="*{severity}"><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select><label>CATEGORY</label><select th:field="*{category}"><option value="Malware">Malware</option><option value="Phishing">Phishing</option><option value="Data Breach">Data Breach</option><option value="Ransomware">Ransomware</option><option value="DDoS">DDoS</option><option value="Insider Threat">Insider Threat</option><option value="Other">Other</option></select><label>REGION</label><select th:field="*{region}"><option value="Dar es Salaam">Dar es Salaam</option><option value="Arusha">Arusha</option><option value="Mwanza">Mwanza</option><option value="Dodoma">Dodoma</option><option value="Mbeya">Mbeya</option><option value="Morogoro">Morogoro</option><option value="Tanga">Tanga</option><option value="Zanzibar">Zanzibar</option><option value="Other">Other</option></select><label>ORGANIZATION</label><input type="text" th:field="*{organization}" placeholder="mfano: Bank, Hospital, Government"><label>DIRECT LOSS (TZS)</label><input type="number" th:field="*{directLossTzs}" step="0.01"><label>RECOVERY COST (TZS)</label><input type="number" th:field="*{recoveryCostTzs}" step="0.01"><label>DOWNTIME COST (TZS)</label><input type="number" th:field="*{downtimeCostTzs}" step="0.01"><label>LEGAL FEES (TZS)</label><input type="number" th:field="*{legalFeesTzs}" step="0.01"><label>REPUTATION DAMAGE (TZS)</label><input type="number" th:field="*{reputationDamageTzs}" step="0.01"><button type="submit" class="app-btn app-btn-primary" style="width:100%;margin-top:18px">🚀 Submit Incident</button></form>
</section></div></main><script th:src="@{/js/app.js}"></script></body></html>
