<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investigations | Cyber Forensics TZ</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container">
<section class="app-card" style="background:linear-gradient(135deg,#0A1628,#0F2744);color:#fff">
<h1 style="color:#fff">🔎 Investigations</h1><p style="color:#dbeafe">Incident cases zinazoshughulikiwa na authorized staff.</p>
<div style="margin-top:15px"><a th:href="@{/incidents/new}" class="app-btn app-btn-primary">➕ Report Incident</a><a th:href="@{/incidents/search}" class="app-btn app-btn-outline" style="margin-left:8px">🔍 Search</a></div>
</section>
<section class="app-card">
<div th:if="${incidents == null || incidents.isEmpty()}" style="text-align:center;padding:45px;color:#61736d"><div style="font-size:45px">📭</div><p>Hakuna investigation/case bado.</p></div>
<div th:if="${incidents != null && !incidents.isEmpty()}" style="overflow:auto">
<table style="width:100%;border-collapse:collapse"><thead><tr><th>Incident ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Region</th><th>Date</th><th>Action</th></tr></thead>
<tbody><tr th:each="inc : ${incidents}">
<td th:text="${inc.incidentId}"></td><td th:text="${inc.title}"></td><td th:text="${inc.severity}"></td><td th:text="${inc.status}"></td><td th:text="${inc.region}"></td><td th:text="${#temporals.format(inc.dateReported,'yyyy-MM-dd HH:mm')}"></td>
<td><a th:href="@{/incidents/{id}(id=${inc.id})}" class="app-btn app-btn-outline">View</a></td>
</tr></tbody></table></div>
</section></div></main>
<script th:src="@{/js/app.js}"></script>
</body></html>
