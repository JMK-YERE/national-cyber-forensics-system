<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Audit &amp; Security</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container">
<section class="app-card" style="background:linear-gradient(135deg,#07543e,#0aa879);color:white;"><h1 style="color:white;margin:0;">Audit &amp; Security</h1><p style="color:rgba(255,255,255,.9);margin:8px 0 0;">Kumbukumbu za vitendo vya mfumo kwa ajili ya ufuatiliaji na accountability.</p></section>
<section class="app-card" style="margin-top:18px;">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><div><h2 style="margin:0;">Recent Audit Records</h2><p style="margin:6px 0 0;color:var(--muted,#60766e);" th:text="\$\{#lists.size(logs) + ' records'\$\{">0 records</p></div><a th:href="@{/dashboard}" class="app-btn app-btn-outline">← Dashboard</a></div>
<div style="overflow-x:auto;margin-top:16px;"><table style="width:100%;border-collapse:collapse;min-width:820px;">
<thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th><th>IP</th></tr></thead>
<tbody>
<tr th:each="log : \$\{logs\$\{"><td th:text="\$\{log.timestamp\$\{">—</td><td th:text="\$\{log.username != null ? log.username : 'system'\$\{">system</td><td th:text="\$\{log.action\$\{">ACTION</td><td th:text="\$\{log.entityType != null ? log.entityType + (log.entityId != null ? ' #' + log.entityId : '') : '—'\$\{">—</td><td th:text="\$\{log.details\$\{">—</td><td th:text="\$\{log.ipAddress\$\{">—</td></tr>
<tr th:if="\$\{#lists.isEmpty(logs)\$\{"><td colspan="6" style="padding:24px;text-align:center;">Hakuna audit record bado.</td></tr>
</tbody></table></div>
</section></div><script th:src="@{/js/app.js}"></script></main>
</body></html>
