<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Audit Log</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div></main>
<div th:replace="~{fragments/sidebar :: sidebar}"></div></main>

<main class="app-main"><div class="app-container">
    <div class="app-card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 25px;">
        <h1 style="color: white; margin: 0;">📊 Audit Log</h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Kumbukumbu za vitendo vyote kwenye mfumo</p>
    </div></main>

    <div class="app-card">
        <h2>📋 Recent Activities</h2>
        <p style="color: #666;">Kumbukumbu za hivi karibuni</p>

        <div style="padding: 15px; margin: 8px 0; background: rgba(15,37,87,0.03); border-left: 4px solid #0f2557; border-radius: 8px;">
            <strong style="color: #0f2557;">📝 Note:</strong>
            <p style="margin: 5px 0;">Audit log inaonyesha vitendo vyote vinavyofanywa na watumiaji. Kwa sasa hakuna audit entries.</p>
            <p style="font-size: 13px; color: #888; margin: 0;">Kila kitendo (login, report, update) kinahifadhiwa hapa.</p>
        </div></main>
    </div></main>

    <div style="margin: 20px 0;">
        <a th:href="@{/dashboard}" class="app-btn app-btn-outline" style="text-decoration: none;">← Back to Dashboard</a>
    </div></main>
</div></main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
