<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Report</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ Cyber Forensics System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/compliance}">📋 Compliance</a>
        <button onclick="window.print()" class="btn" style="margin-left:10px;">🖨️ Print</button>
    </div>
</div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;" th:text="${report.title}"></h1>
        <p style="color: rgba(255,255,255,0.9);">Report ID: <span th:text="${report.reportId}"></span></p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${report.complianceScore} + '%'">0</div>
            <div class="stat-label">Compliance Score</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${report.totalControls}">0</div>
            <div class="stat-label">Total Controls</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${report.passedControls}" style="color: #1b7a4a;">0</div>
            <div class="stat-label">Passed</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${report.failedControls}" style="color: #8b1a1a;">0</div>
            <div class="stat-label">Failed</div>
        </div>
    </div>

    <div class="card">
        <h2>📝 Summary</h2>
        <p th:text="${report.summary}"></p>
    </div>

    <div class="card">
        <h2>🔍 Findings</h2>
        <p th:text="${report.findings}" style="white-space: pre-line; line-height: 2;"></p>
    </div>

    <div class="card" style="background: rgba(27,122,74,0.05); border-left: 4px solid #1b7a4a;">
        <h2 style="color: #1b7a4a;">💡 Recommendations</h2>
        <p th:text="${report.recommendations}" style="white-space: pre-line; line-height: 2;"></p>
    </div>

    <div class="card">
        <h3>Report Details</h3>
        <p><strong>Type:</strong> <span th:text="${report.reportTypeLabel}"></span></p>
        <p><strong>Period:</strong> <span th:text="${#temporals.format(report.periodStart, 'yyyy-MM-dd')}"></span> — <span th:text="${#temporals.format(report.periodEnd, 'yyyy-MM-dd')}"></span></p>
        <p><strong>Generated By:</strong> <span th:text="${report.generatedByName}"></span></p>
        <p><strong>Status:</strong> <span th:text="${report.status}"></span></p>
    </div>

    <div style="text-align: center; margin: 30px 0;">
        <a th:href="@{/compliance}" class="btn">← Back</a>
    </div>
</div>
</body>
</html>
