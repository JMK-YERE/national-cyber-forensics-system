<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Report</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main"><div class="app-container">
    <div class="app-card" style="background: linear-gradient(135deg, #07543e, #0aa879); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;" th:text="${report.title}"></h1>
        <p style="color: rgba(255,255,255,0.9);">Report ID: <span th:text="${report.reportId}"></span></p>
    </div>

    <div class="app-stats-grid">
        <div class="app-stat-box">
            <div class="stat-value" th:text="${report.complianceScore} + '%'">0</div>
            <div class="stat-label">Compliance Score</div>
        </div>
        <div class="app-stat-box">
            <div class="stat-value" th:text="${report.totalControls}">0</div>
            <div class="stat-label">Total Controls</div>
        </div>
        <div class="app-stat-box">
            <div class="stat-value" th:text="${report.passedControls}" style="color: #0aa879;">0</div>
            <div class="stat-label">Passed</div>
        </div>
        <div class="app-stat-box">
            <div class="stat-value" th:text="${report.failedControls}" style="color: #8b1a1a;">0</div>
            <div class="stat-label">Failed</div>
        </div>
    </div>

    <div class="app-card">
        <h2>📝 Summary</h2>
        <p th:text="${report.summary}"></p>
    </div>

    <div class="app-card">
        <h2>🔍 Findings</h2>
        <p th:text="${report.findings}" style="white-space: pre-line; line-height: 2;"></p>
    </div>

    <div class="app-card" style="background: rgba(27,122,74,0.05); border-left: 4px solid #0aa879;">
        <h2 style="color: #0aa879;">💡 Recommendations</h2>
        <p th:text="${report.recommendations}" style="white-space: pre-line; line-height: 2;"></p>
    </div>

    <div class="app-card">
        <h3>Report Details</h3>
        <p><strong>Type:</strong> <span th:text="${report.reportTypeLabel}"></span></p>
        <p><strong>Period:</strong> <span th:text="${#temporals.format(report.periodStart, 'yyyy-MM-dd')}"></span> — <span th:text="${#temporals.format(report.periodEnd, 'yyyy-MM-dd')}"></span></p>
        <p><strong>Generated By:</strong> <span th:text="${report.generatedByName}"></span></p>
        <p><strong>Status:</strong> <span th:text="${report.status}"></span></p>
    </div>

    <div style="text-align: center; margin: 30px 0;">
        <a th:href="@{/compliance/view/{id}/pdf(id=${report.id})}" class="app-btn app-btn-primary">⬇ Download PDF</a><a th:href="@{/compliance}" class="app-btn app-btn-outline">← Back</a>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</main></body>
</html>
