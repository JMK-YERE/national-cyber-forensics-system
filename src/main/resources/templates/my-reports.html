<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Reports | Cyber Forensics TZ</title><link rel="stylesheet" th:href="@{/css/theme.css}"><style>
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:16px}.page-head h1{margin:0;color:#073b2e;font-size:25px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.report-list{display:grid;gap:10px}.report-row{background:#fff;border:1px solid #dcece7;border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;box-shadow:0 5px 18px rgba(4,70,55,.05)}.type-icon{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:#effaf6;color:#087d68}.report-row h3{font-size:13px;margin:0;color:#073b2e}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.badge{font-size:9px;font-weight:900;border-radius:999px;padding:5px 8px;background:#f1f5f4;color:#48645b}.status{background:#eaf6ff;color:#1769aa}.severity{background:#fff3e8;color:#b45309}.date{font-size:10px;color:var(--muted);margin-top:5px}.open{background:#063b2c;color:#fff;text-decoration:none;border-radius:9px;padding:8px 11px;font-size:10px;font-weight:900;white-space:nowrap}.empty{padding:35px;text-align:center;background:#fff;border:1px dashed #c9ddd6;border-radius:14px;color:var(--muted);font-size:12px}.new{background:#0a9b78;color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;font-size:10px;font-weight:900}@media(max-width:620px){.page-head{align-items:flex-start;flex-direction:column}.report-row{grid-template-columns:auto 1fr}.report-row .open{grid-column:2;width:max-content}}
</style></head><body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="app-main"><div class="app-container">
<div class="page-head"><div><h1>📋 My Reports</h1><p>Reports ulizowasilisha. Unaona taarifa zako tu.</p></div><a class="new" th:href="@{/report-attack}">＋ New Incident</a></div>
<div class="report-list" th:if="${reports != null && !reports.isEmpty()}"><div class="report-row" th:each="r : ${reports}">
<div class="type-icon" th:switch="${r.attackType}"><span th:case="'PHISHING'">🎣</span><span th:case="'MALWARE'">🦠</span><span th:case="'RANSOMWARE'">🔒</span><span th:case="'SOCIAL_MEDIA_HACKED'">📱</span><span th:case="'ACCOUNT_COMPROMISED'">👤</span><span th:case="'DATA_BREACH'">🗄️</span><span th:case="'FRAUD'">💳</span><span th:case="'CYBER_BULLYING'">⚠️</span><span th:case="'IDENTITY_THEFT'">🪪</span><span th:case="'OTHER'">🛡️</span><span th:case="*">🛡️</span></div>
<div><h3 th:text="${r.reportId + ' — ' + (r.title != null ? r.title : 'Incident Report')}">SEC-REPORT — Incident</h3><div class="meta"><span class="badge" th:text="${r.attackTypeLabel != null ? r.attackTypeLabel : 'CYBER INCIDENT'}">CYBER INCIDENT</span><span class="badge status" th:text="${r.status != null ? r.status : 'NEW'}">NEW</span><span class="badge severity" th:text="${r.severity != null ? r.severity : 'UNSPECIFIED'}">MEDIUM</span></div><div class="date" th:text="${r.createdAt != null ? #temporals.format(r.createdAt,'dd MMM yyyy HH:mm') : 'Date unavailable'}">03 Oct 2026 11:00</div></div>
<a class="open" th:href="@{/report-attack/view/{id}(id=${r.id})}">View Report →</a></div></div>
<div class="empty" th:if="${reports == null || reports.isEmpty()}">Hakuna report bado. Ukikumbana na tukio la mtandao, tumia <strong>Report Incident</strong>.</div>
</div></main><script th:src="@{/js/app.js}"></script></body></html>
