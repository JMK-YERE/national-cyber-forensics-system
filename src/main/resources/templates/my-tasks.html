<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Tasks | Cyber Forensics TZ</title>
<link rel="stylesheet" th:href="@{/css/theme.css}">
<style>
.task-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.task-head h1{margin:0;color:#0f172a;font-size:24px}.task-head p{margin:4px 0 0;color:#64748b;font-size:12px}
.task-summary{display:flex;gap:8px;flex-wrap:wrap}.task-pill{padding:7px 10px;border:1px solid #e2e8f0;border-radius:999px;background:#fff;color:#475569;font-size:11px;font-weight:800}.task-pill.overdue{color:#b91c1c;border-color:#fecaca;background:#fff7f7}
.task-table{width:100%;border-collapse:collapse}.task-table th,.task-table td{padding:12px 10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:12px;vertical-align:top}.task-table th{color:#475569;background:#f8fafc;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.task-table tr:hover{background:#f8fafc}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.open{background:#eff6ff;color:#1d4ed8}.progress{background:#ecfeff;color:#0e7490}.blocked{background:#fff7ed;color:#c2410c}.done{background:#ecfdf5;color:#047857}.cancelled{background:#f1f5f9;color:#64748b}.late{color:#b91c1c;font-weight:800}
.actions{display:flex;gap:5px;flex-wrap:wrap}.actions form{margin:0}.actions button{font-size:10px;padding:6px 8px}
@media(max-width:700px){.task-head{align-items:flex-start;flex-direction:column}.task-table{min-width:760px}.table-wrap{overflow-x:auto}}
</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container">
<div class="task-head"><div><h1 th:text="#{tasks.title}">My Tasks</h1><p th:text="#{tasks.subtitle}">Case work assigned to you.</p></div>
<div class="task-summary"><span class="task-pill"><span th:text="#{tasks.total}">Total</span>: <b th:text="${tasks != null ? tasks.size() : 0}">0</b></span><span class="task-pill overdue"><span th:text="#{tasks.overdue}">Overdue</span>: <b th:text="${tasks != null ? #lists.size(tasks.?[overdue]) : 0}">0</b></span></div></div>
<div class="app-card"><div class="table-wrap"><table class="task-table"><thead><tr>
<th th:text="#{tasks.case}">Case</th><th th:text="#{tasks.task}">Task</th><th th:text="#{general.priority}">Priority</th><th th:text="#{report.status}">Status</th><th th:text="#{tasks.due}">Due</th><th th:text="#{general.action}">Action</th>
</tr></thead><tbody>
<tr th:if="${tasks == null or tasks.isEmpty()}"><td colspan="6" style="text-align:center;padding:32px;color:#64748b" th:text="#{tasks.empty}">No tasks assigned.</td></tr>
<tr th:each="t : ${tasks}">
<td><a th:href="@{'/cases/' + ${t.caseId}}" style="font-family:monospace;font-weight:800;color:#1d4ed8" th:text="${'CASE-' + t.caseId}">CASE</a></td>
<td><strong th:text="${t.title}">Task</strong><div th:if="${t.description != null}" style="margin-top:3px;color:#64748b" th:text="${t.description}"></div></td>
<td th:text="${t.priority}">MEDIUM</td>
<td><span class="badge" th:classappend="${t.status == 'OPEN' ? ' open' : (t.status == 'IN_PROGRESS' ? ' progress' : (t.status == 'BLOCKED' ? ' blocked' : (t.status == 'COMPLETED' ? ' done' : ' cancelled')))}" th:text="${t.status}">OPEN</span></td>
<td><span th:if="${t.dueDate != null}" th:text="${#temporals.format(t.dueDate,'yyyy-MM-dd HH:mm')}" th:classappend="${t.overdue ? ' late' : ''}">—</span><span th:if="${t.dueDate == null}" th:text="#{tasks.noDue}">No deadline</span></td>
<td><div class="actions">
<form th:if="${t.status == 'OPEN'}" th:action="@{/case-tasks/{id}/status(id=${t.id})}" method="post"><input type="hidden" name="status" value="IN_PROGRESS"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-outline" th:text="#{tasks.start}">Start</button></form>
<form th:if="${t.status == 'OPEN'}" th:action="@{/case-tasks/{id}/status(id=${t.id})}" method="post"><input type="hidden" name="status" value="CANCELLED"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-outline" th:text="#{tasks.cancel}">Cancel</button></form>
<form th:if="${t.status == 'IN_PROGRESS'}" th:action="@{/case-tasks/{id}/status(id=${t.id})}" method="post"><input type="hidden" name="status" value="BLOCKED"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-outline" th:text="#{tasks.block}">Block</button></form>
<form th:if="${t.status == 'IN_PROGRESS'}" th:action="@{/case-tasks/{id}/status(id=${t.id})}" method="post"><input type="hidden" name="status" value="COMPLETED"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-primary" th:text="#{tasks.complete}">Complete</button></form>
<form th:if="${t.status == 'IN_PROGRESS'}" th:action="@{/case-tasks/{id}/status(id=${t.id})}" method="post"><input type="hidden" name="status" value="CANCELLED"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-outline" th:text="#{tasks.cancel}">Cancel</button></form>
<form th:if="${t.status == 'BLOCKED'}" th:action="@{/case-tasks/{id}/status(id=${t.id})}" method="post"><input type="hidden" name="status" value="IN_PROGRESS"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-primary" th:text="#{tasks.resume}">Resume</button></form>
<form th:if="${t.status == 'BLOCKED'}" th:action="@{/case-tasks/{id}/status(id=${t.id})}" method="post"><input type="hidden" name="status" value="CANCELLED"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-outline" th:text="#{tasks.cancel}">Cancel</button></form>
<a th:href="@{'/cases/' + ${t.caseId}}" class="app-btn app-btn-outline" th:text="#{general.view}">View</a>
</div></td></tr></tbody></table></div></div>
</div></main><script th:src="@{/js/app.js}"></script>
</body></html>
