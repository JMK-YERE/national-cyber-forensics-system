<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tasks - <span th:text="#{app.title}">Cyber Forensics</span></title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card">
        <h1>✅ My Tasks</h1>
        <p>Your assigned work items</p>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Incident ID</th>
                <th th:text="#{report.title2}">Title</th>
                <th th:text="#{general.priority}">Priority</th>
                <th th:text="#{report.status}">Status</th>
                <th th:text="#{general.action}">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${tasks.isEmpty()}"><td colspan="5" style="text-align:center;">No tasks assigned. 🎉</td></tr>
            <tr th:each="t : ${tasks}" th:class="${t.statusClass}">
                <td th:text="${t.incidentId}"></td>
                <td th:text="${t.title}"></td>
                <td th:text="${t.priority}"></td>
                <td th:text="${t.workflowStatus}"></td>
                <td><a th:href="@{'/incidents/' + ${t.id}}" th:text="#{general.view}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
