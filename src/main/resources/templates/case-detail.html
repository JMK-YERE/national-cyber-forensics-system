<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><style>.case-detail-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:4px 0 20px;border-bottom:1px solid #d6e9df;margin-bottom:20px}.case-kicker{font-size:10px;font-weight:900;letter-spacing:.12em;color:#08785a}.case-detail-head h1{margin:3px 0;color:#022c22;font-size:28px}.case-detail-head p{margin:0;color:#61736d;font-size:13px}@media(max-width:600px){.case-detail-head{align-items:flex-start;flex-direction:column}.case-detail-head h1{font-size:22px}}</style>
    <meta charset="UTF-8">
    <title>Case Detail - Cyber Forensics</title>
    <link rel="stylesheet" th:href="@{/css/theme.css(v=20261004)}">
</head>
<body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main"><div class="app-container"><header class="case-detail-head"><div><div class="case-kicker">FORENSIC CASE FILE</div><h1 th:text="${caseFile.caseNumber}"></h1><p th:text="${caseFile.title}"></p></div><a th:href="@{/cases}" class="app-btn app-btn-outline">← Cases</a></header>
    <div class="app-card case-summary">
        <a th:href="@{'/reports/case/{id}/pdf'(id=${caseFile.id})}" class="app-btn app-btn-primary" style="margin-top:10px;display:inline-block;" target="_blank">📄 Download PDF Report</a>
        <p><strong>Title:</strong> <span th:text="${caseFile.title}"></span></p>
        <p><strong>Priority:</strong> <span th:text="${caseFile.priority}"></span></p>
        <p><strong>Status:</strong> <span th:text="${caseFile.status}"></span></p>
        <p><strong>Created:</strong> <span th:text="${#temporals.format(caseFile.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
        <hr style="border-color:rgba(0,255,157,0.2);margin:20px 0;">
        <h3>📝 Description</h3>
        <p th:text="${caseFile.description}"></p>
    </div>

    <div class="app-card" th:if="${caseFile.status != 'CLOSED'}">
        <h3>Close Case</h3>
        <form th:action="@{/cases/{value}/close(value=${caseFile.id})}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label>Closure Reason</label>
            <textarea name="reason" rows="3" required></textarea>
            <button type="submit" class="app-btn app-btn-primary" style="margin-top:10px;">Close Case</button>
        </form>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</main></body>
</html>
