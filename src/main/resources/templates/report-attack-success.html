<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Submitted</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ Cyber Forensics System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/report-attack}">Report</a>
    </div>
</div>

<div class="container">
    <div class="card" style="text-align:center; padding:40px;">
        <div style="font-size:80px;">✅</div>
        <h1 style="color:#1b7a4a;">Report Submitted!</h1>
        <p>Your report has been received. We will help you.</p>
    </div>

    <div class="card" th:if="${report != null}" style="background:rgba(201,162,39,0.1); border-left:4px solid #c9a227;">
        <h2>📋 Report ID</h2>
        <div style="background:#0f2557; padding:20px; border-radius:8px; text-align:center; margin:15px 0;">
            <span style="font-family:monospace; font-size:28px; color:#ffd700; letter-spacing:3px; font-weight:bold;"
                  th:text="${report.reportId}"></span>
        </div>
        <p>Save this ID to track your report.</p>
    </div>

    <div class="card" th:if="${report != null && report.aiRecommendation != null}">
        <h2>🤖 AI Recommendations</h2>
        <div style="background:rgba(15,37,87,0.05); padding:20px; border-radius:8px; border-left:4px solid #0f2557; white-space:pre-line; line-height:1.9;"
             th:text="${report.aiRecommendation}"></div>
    </div>

    <div style="text-align:center; margin:30px 0;">
        <a th:href="@{'/report-attack/view/' + ${report.id}}" class="btn btn-primary" style="padding:15px 30px;">📄 View Your Report</a>
        <a th:href="@{/report-attack}" class="btn" style="padding:15px 30px;">← Report Another</a>
    </div>
</div>
</body>
</html>
