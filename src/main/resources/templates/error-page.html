<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar" style="background: #0f2557; color: white; padding: 15px 30px; display: flex; justify-content: space-between;">
    <div class="logo" style="font-weight: bold;">🛡️ Cyber Forensics System</div>
    <div>
        <a th:href="@{/dashboard}" style="color: white; margin-right: 15px; text-decoration: none;">Dashboard</a>
        <a th:href="@{/login}" style="color: white; text-decoration: none;">Login</a>
    </div>
</div>

<div class="container" style="max-width: 700px; margin: 50px auto; padding: 0 15px;">
    <div class="card" style="text-align: center; padding: 40px; background: rgba(220,38,38,0.08); border: 3px solid #dc2626; border-radius: 12px;">
        <div style="font-size: 70px; margin-bottom: 20px;">⚠️</div>
        <h1 style="color: #dc2626; margin: 0 0 15px 0;">Hitilafu Imetokea</h1>
        <p style="font-size: 16px; color: #333;">
            <strong>Status:</strong> <span th:text="${statusCode}">500</span>
        </p>
        <p style="color: #666;" th:text="${errorMessage}">An unexpected error occurred</p>
    </div>

    <div class="card" style="text-align: center; margin-top: 20px; padding: 30px; background: white; border-radius: 12px;">
        <p>Samahani kwa usumbufu. Tafadhali jaribu tena au rudi kwenye ukurasa wa mwanzo.</p>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
            <a th:href="@{/dashboard}" style="background: #0f2557; color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold;">🏠 Dashboard</a>
            <a th:href="@{/login}" style="background: white; color: #0f2557; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 2px solid #0f2557;">🔐 Login</a>
        </div>
    </div>
</div>
</body>
</html>
