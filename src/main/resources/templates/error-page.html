<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Error | Cyber Security &amp; Digital Forensics</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef8f5,#f7fbff);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#102033;display:grid;place-items:center;padding:24px}
.error-shell{width:min(760px,94vw);background:#fff;border:1px solid #dce8ef;border-radius:22px;box-shadow:0 24px 70px rgba(4,28,48,.14);overflow:hidden}
.error-head{padding:22px 28px;background:linear-gradient(110deg,#071b3c,#123d78);color:#fff;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:850}.badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:7px 11px;border-radius:20px;font-size:11px}
.error-body{text-align:center;padding:48px 30px}.icon{font-size:64px}.status{display:inline-block;margin:15px 0 8px;padding:7px 13px;border-radius:20px;background:#fff1f1;color:#b4232c;font-weight:900;font-size:12px}
h1{margin:8px 0;color:#b4232c;font-size:30px}.message{color:#607184;max-width:560px;margin:0 auto;line-height:1.6;font-size:14px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-block;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:800;font-size:12px}.primary{background:#0b3f85;color:#fff}.secondary{border:1px solid #b8c8d8;color:#0b3f85;background:#fff}
@media(max-width:560px){.error-head{padding:18px}.error-body{padding:38px 20px}.error-head .badge{display:none}}
</style>
</head>
<body>
<main class="error-shell">
<header class="error-head"><div class="brand">🛡 Cyber Security &amp; Digital Forensics</div><div class="badge">System Error</div></header>
<section class="error-body">
<div class="icon">⚠️</div>
<div class="status">HTTP <span th:text="${statusCode}">500</span></div>
<h1>Hitilafu Imetokea</h1>
<p class="message">Samahani kwa usumbufu. Mfumo umepata hitilafu wakati wa kufungua ukurasa huu. Jaribu tena au rudi kwenye ukurasa wa kuingia.</p>
<div class="actions">
<a class="btn primary" th:href="@{/login}">🔐 Rudi Login</a>
<a class="btn secondary" th:href="@{/}">🏠 Mwanzo</a>
</div>
</section>
</main>
</body>
</html>
