<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | Cyber Forensics TZ</title><style>:root{--g:#07543e;--g2:#0aa879;--c:#08c7d8;--ink:#10251f;--muted:#667b74;--line:#d8e8e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#d9fff0,#f7fbfa 48%,#eaf8f5);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}.card{width:min(430px,95vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 55px rgba(3,70,48,.16);overflow:hidden}.bar{height:7px;background:linear-gradient(90deg,var(--g),var(--g2),var(--c))}.inner{padding:26px 28px 24px}.icon{width:48px;height:48px;margin:0 auto 10px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:24px}.brand{text-align:center;color:var(--g);font-weight:900;font-size:15px}.brand span{color:var(--c)}h1{text-align:center;color:var(--g);font-size:23px;margin:16px 0 5px}.sub{text-align:center;color:var(--muted);font-size:11px;margin:0 0 17px}.alert{padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:12px}.ok{background:#effcf6;color:#08785a;border:1px solid #ccefe0}.err{background:#fff1f2;color:#b4232c;border:1px solid #ffd2d7}.field{margin-bottom:12px}label{display:block;font-size:10px;font-weight:850;color:var(--g);margin-bottom:5px}input{width:100%;height:41px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:12px;outline:0}input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(10,168,121,.1)}.pw{position:relative}.pw input{padding-right:43px}.eye{position:absolute;right:8px;top:5px;width:30px;height:30px;border:0;background:transparent;cursor:pointer}.submit{width:100%;height:42px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:12px;font-weight:900;cursor:pointer}.back{display:block;text-align:center;margin-top:13px;color:#08785a;font-size:10px;font-weight:850;text-decoration:none}@media(max-width:430px){body{padding:10px}.inner{padding:22px 18px}} </style></head><body><main class="card"><div class="bar"></div><section class="inner"><div class="icon">🛡</div><div class="brand">Cyber Forensics <span>TZ</span></div><h1>Umesahau Password?</h1><p class="sub">Chagua njia ya kupata link au code ya kubadilisha password.</p><div class="alert ok" th:if="${param.sent}">Maombi yamepokelewa. Kama taarifa zipo, utapokea link/code.</div><form th:action="@{/forgot-password}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Barua Pepe</label><input type="email" name="email" required placeholder="you@example.com"></div><button class="submit" type="submit">📧 Tuma Reset Link kwa Email</button></form><div style="height:1px;background:#e6eee9;margin:17px 0"></div><form th:action="@{/forgot-password/sms}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Namba ya Simu</label><input name="phone" required placeholder="+255..."></div><button class="submit" type="submit" style="background:linear-gradient(135deg,#087d93,#08c7d8)">📱 Tuma OTP kwa SMS</button></form><a class="back" th:href="@{/login}">← Rudi Login</a></section></main></body></html>
