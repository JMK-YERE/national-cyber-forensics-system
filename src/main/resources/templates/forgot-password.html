<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | Cyber Forensics TZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#202124;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;padding:34px 20px;min-height:100svh}main{width:min(400px,100%);text-align:center}
.brand{font-size:18px;font-weight:700;color:#202124;margin-bottom:24px}.brand span{color:#1a73e8}.shield{font-size:28px;margin-bottom:10px}
h1{font-size:22px;font-weight:500;margin:0 0 10px;color:#202124}.sub{font-size:13px;color:#5f6368;line-height:1.55;margin:0 auto 28px;max-width:390px}
.alert{font-size:13px;line-height:1.55;margin:0 auto 20px;max-width:410px}.err{color:#b3261e}.ok{color:#137333}
.field{text-align:left;margin-bottom:12px}label{display:block;font-size:13px;font-weight:600;color:#3c4043;margin-bottom:7px}
input{width:100%;height:46px;border:1px solid #dadce0;border-radius:4px;padding:0 13px;font-size:15px;outline:none;background:#fff}input:focus{border:2px solid #1a73e8}
button{width:100%;height:44px;border:0;border-radius:23px;background:#1a73e8;color:#fff;font-size:14px;font-weight:600;cursor:pointer}button:hover{background:#185abc}
.back{display:inline-block;margin-top:22px;color:#1a73e8;font-size:14px;font-weight:600;text-decoration:none}.note{font-size:12px;color:#5f6368;line-height:1.55;margin-top:28px}
@media(max-width:480px){body{padding:28px 18px}.brand{margin-bottom:20px}.shield{font-size:25px;margin-bottom:8px}h1{font-size:21px}.sub{font-size:12px;margin-bottom:18px}.note{margin-top:20px}}
</style>

<style>
/* CFTZ final recovery/OTP design */
html,body{background:#f5f9f7!important;color:#10241f!important;font-family:Inter,"Segoe UI",system-ui,sans-serif!important}
body{padding:28px 18px!important;align-items:flex-start!important}main{width:min(430px,100%)!important;text-align:center!important}.brand{color:#06382c!important;font-size:17px!important;font-weight:900!important}.brand span{color:#10a56f!important}.shield{font-size:25px!important}
h1{color:#031f18!important;font-weight:800!important}.sub{color:#60766e!important}.field label{color:#075a43!important}input{border-color:#bfd6cc!important;border-radius:8px!important;background:#fff!important;color:#10241f!important}input:focus{border-color:#10a56f!important;box-shadow:0 0 0 3px rgba(16,165,111,.10)!important}button{background:linear-gradient(135deg,#06382c,#10a56f)!important;border-radius:8px!important;height:44px!important}button:hover{background:#08785a!important}.timer{color:#60766e!important}.timer strong{color:#b4232c!important}.back{color:#08785a!important}.note{color:#60766e!important}
html[data-theme="dark"] body{background:#061710!important;color:#e5f5ef!important}html[data-theme="dark"] .brand,html[data-theme="dark"] h1{color:#e5f5ef!important}html[data-theme="dark"] .sub,html[data-theme="dark"] .note,html[data-theme="dark"] .timer{color:#a8c8bd!important}html[data-theme="dark"] input{background:#0b261e!important;color:#e5f5ef!important;border-color:#285646!important}html[data-theme="dark"] .back{color:#7df0cf!important}
</style></head>
<body><main>
<div class="shield">🛡️</div><div class="brand">Cyber Forensics <span>TZ</span></div>
<h1>Umesahau password?</h1>
<p class="sub">Ingiza email ya akaunti yako. Tutakutumia OTP ya tarakimu 6 kwa uthibitisho.</p>
<div class="alert err" th:if="${error}" th:text="${error}"></div>
<div class="alert ok" th:if="${param.sent}">OTP imetumwa kwenye email yako. Ita-expire ndani ya sekunde 60.</div>
<form th:action="@{/forgot-password}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label for="email">Barua pepe</label><input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com"></div>
<button type="submit">Tuma OTP kwa Email</button>
</form>
<a class="back" th:href="@{/login}">← Rudi Login</a>
<div class="note">Usimpe mtu mwingine OTP yako. Kwa usalama, OTP ni halali kwa sekunde 60 tu.</div>
</main></body></html>
