<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{password.forgot}">Forgot Password</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        body { background: linear-gradient(135deg, #0F4C3A, #1B7A4A); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .forgot-container { background: white; border-radius: 20px; padding: 40px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .forgot-header { text-align: center; margin-bottom: 30px; }
        .forgot-header h1 { color: #0F4C3A; font-size: 24px; margin: 10px 0 0; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; color: #0F4C3A; margin-bottom: 8px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #E2E8F0; border-radius: 10px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #1B7A4A; box-shadow: 0 0 0 4px rgba(27,122,74,0.1); }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #0F4C3A, #1B7A4A); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(15,76,58,0.4); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #1B7A4A; text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
<div class="forgot-container">
    <div class="forgot-header">
        <div style="font-size: 50px;">🔐</div>
        <h1 th:text="#{password.resetTitle}">Reset Password</h1>
        <p style="color: #64748B; font-size: 13px;" th:text="#{password.resetSubtitle}">Enter your email</p>
    </div>

    <div th:if="${param.sent}" style="background: rgba(16,185,129,0.1); border-left: 4px solid #10B981; padding: 12px; border-radius: 8px; margin-bottom: 20px; color: #10B981;" th:text="#{password.sent}">
        Reset link sent!
    </div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label th:text="#{register.email}">Email</label>
            <input type="email" name="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn-submit" th:text="#{password.sendReset}">SEND RESET LINK</button>
    </form>

    <a th:href="@{/login}" class="back-link">← <span th:text="#{password.backToLogin}">Back to Login</span></a>
</div>
</body>
</html>
