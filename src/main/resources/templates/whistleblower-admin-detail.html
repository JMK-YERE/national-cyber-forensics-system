<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WB Report — Admin</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div></main>
<div th:replace="~{fragments/sidebar :: sidebar}"></div></main>

<main class="app-main"><div class="app-container">
    <div style="margin: 15px 0;">
        <a th:href="@{/whistleblower/admin}" class="app-btn app-btn-outline" style="text-decoration: none;">← Back to WB Reports</a>
    </div></main>

    <div class="app-card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 25px;">
        <h1 style="color: white; margin: 0;" th:text="${report.title}"></h1>
        <p style="color: rgba(255,255,255,0.9);">
            <span th:text="${report.trackingCode}" style="font-family: monospace; color: #c9a227;"></span> |
            <span th:text="${report.categoryLabel}"></span>
        </p>
    </div></main>

    <div class="app-card" style="margin-top: 20px;">
        <h2>📋 Report Details</h2>
        <p><strong>Status:</strong> <span th:text="${report.status}"></span></p>
        <p><strong>Priority:</strong> <span th:text="${report.priority}"></span></p>
        <p><strong>Urgency:</strong> <span th:text="${report.urgency}"></span></p>
        <p><strong>Region:</strong> <span th:text="${report.region}"></span></p>
        <p><strong>Location:</strong> <span th:text="${report.location}"></span></p>
        <p><strong>Date:</strong> <span th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
    </div></main>

    <div class="app-card">
        <h2>📝 Description</h2>
        <p th:text="${report.description}" style="white-space: pre-wrap;"></p>
    </div></main>

    <div class="app-card" th:if="${report.involvedParties != null}">
        <h2>👥 Involved Parties</h2>
        <p th:text="${report.involvedParties}" style="white-space: pre-wrap;"></p>
    </div></main>

    <div class="app-card" th:if="${report.evidenceFilePath != null}">
        <h2>📎 Evidence</h2>
        <p><strong>Type:</strong> <span th:text="${report.evidenceFileType}"></span></p>
        <p><strong>Size:</strong> <span th:text="${report.evidenceFileSize != null ? (report.evidenceFileSize / 1024) + ' KB' : 'N/A'}"></span></p>
    </div></main>

    <div class="app-card">
        <h2>💬 Messages</h2>
        <div th:each="m : ${messages}" style="padding: 12px; margin: 8px 0; border-radius: 8px;"
             th:style="${m.senderType == 'ADMIN'} ? 'background: rgba(201,162,39,0.12); border-left: 4px solid #c9a227;' : (${m.senderType == 'SYSTEM'} ? 'background: rgba(27,122,74,0.08); border-left: 4px solid #1b7a4a;' : 'background: rgba(15,37,87,0.08); border-left: 4px solid #0f2557;')">
            <div style="font-size: 12px; font-weight: bold;">
                <span th:if="${m.senderType == 'ADMIN'}">👤 Admin</span>
                <span th:if="${m.senderType == 'REPORTER'}">🕵️ Reporter (Anonymous)</span>
                <span th:if="${m.senderType == 'SYSTEM'}">⚙️ System</span>
                <span style="float: right; color: #888; font-weight: normal;" th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div></main>
            <div th:text="${m.message}" style="margin-top: 8px; white-space: pre-wrap;"></div></main>
        </div></main>
    </div></main>

    <div class="app-card">
        <h2>⚙️ Update Report</h2>
        <form th:action="@{'/whistleblower/admin/' + ${report.id} + '/update'}" method="post">
            <label>Status:</label>
            <select name="status" required style="width:100%; padding:10px; margin:5px 0 15px 0;">
                <option value="NEW" th:selected="${report.status == 'NEW'}">NEW</option>
                <option value="INVESTIGATING" th:selected="${report.status == 'INVESTIGATING'}">INVESTIGATING</option>
                <option value="RESOLVED" th:selected="${report.status == 'RESOLVED'}">RESOLVED</option>
                <option value="CLOSED" th:selected="${report.status == 'CLOSED'}">CLOSED</option>
            </select>
            <label>Response to Reporter:</label>
            <textarea name="adminResponse" rows="4" placeholder="Jibu litaonekana kwa reporter..." style="width:100%; padding:10px; margin:5px 0 15px 0;"></textarea>
            <label>Internal Notes (sio kwa reporter):</label>
            <textarea name="internalNotes" rows="3" style="width:100%; padding:10px; margin:5px 0 15px 0;" th:text="${report.internalNotes}"></textarea>
            <button type="submit" class="app-btn app-btn-primary" style="padding:12px 25px;">💾 Update Report</button>
        </form>
    </div></main>
</div></main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

<style>
/* ===== WHISTLEBLOWER / SECRET REPORTING — ENTERPRISE NEUTRAL THEME ===== */
html,body{background:#f6f8fb!important;color:#1f2937!important}
.wb-nav,.top{background:#fff!important;border-color:#e2e8f0!important}
.wb-nav a,.top a{color:#475569!important;transition:color .15s ease,background-color .15s ease}
.wb-nav a:hover,.top a:hover{color:#2563eb!important;background:transparent!important}
.wb-hero,.wb-head{background:#0f172a!important;color:#fff!important;border-radius:12px!important}
.wb-hero p,.wb-head p{color:#dbeafe!important}
.wb-btn{background:#2563eb!important;color:#fff!important;border:1px solid #2563eb!important;transition:background-color .16s ease,color .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.wb-btn:hover{background:#1d4ed8!important;color:#fff!important;transform:translateY(-1px);box-shadow:0 6px 14px rgba(37,99,235,.18)!important}
.wb-btn.alt{background:#fff!important;color:#1d4ed8!important;border-color:#bfdbfe!important}
.wb-btn.alt:hover{background:#eff6ff!important;color:#1d4ed8!important;border-color:#93c5fd!important}
.wb-card,.app-card{background:#fff!important;border-color:#e2e8f0!important;box-shadow:0 3px 12px rgba(15,23,42,.04)!important;color:#1f2937!important}
.wb-card h2,.app-card h2{color:#0f172a!important}
.wb-card p,.wb-card li{color:#64748b!important}
.wb-note,.note{background:#eff6ff!important;border-color:#bfdbfe!important;color:#334155!important}
.field label{color:#334155!important}
.field input,.field select,.field textarea,input,select,textarea{background:#fff!important;color:#1f2937!important;border-color:#cbd5e1!important}
.field input:focus,.field select:focus,.field textarea:focus,input:focus,select:focus,textarea:focus{border-color:#2563eb!important;box-shadow:0 0 0 3px rgba(37,99,235,.10)!important;outline:0}
.submit{background:#2563eb!important;color:#fff!important;border:1px solid #2563eb!important;transition:background-color .16s ease,transform .16s ease,box-shadow .16s ease}
.submit:hover{background:#1d4ed8!important;color:#fff!important;transform:translateY(-1px);box-shadow:0 6px 14px rgba(37,99,235,.18)!important}
.app-btn-primary{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important}
.app-btn-primary:hover{background:#1d4ed8!important;color:#fff!important}
.app-btn-outline{background:#fff!important;color:#1d4ed8!important;border-color:#bfdbfe!important}
.app-btn-outline:hover{background:#eff6ff!important;color:#1d4ed8!important}
a:not(.app-btn):hover{color:#1d4ed8!important;background:transparent!important}
@media(max-width:700px){.wb-page,.wb-form-page{padding-left:12px;padding-right:12px}.wb-hero,.wb-head{padding:22px!important}.wb-actions{width:100%}.wb-btn{width:100%;text-align:center}}
</style>
