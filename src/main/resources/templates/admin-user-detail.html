<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>👤 User Detail - Cyber Forensics</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo"> CYBER FORENSICS TZ - ADMIN</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">🏠 Dashboard</a>
        <a th:href="@{/admin/users}">👥 Users</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="logout-btn">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1 th:text="'👤 ' + ${user.username}"></h1>
        <p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
        <p><strong>Full Name:</strong> <span th:text="${user.fullName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${user.phone != null ? user.phone : 'N/A'}"></span></p>
        <p><strong>Organization:</strong> <span th:text="${user.organization != null ? user.organization : 'N/A'}"></span></p>
        <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
        <p><strong>Enabled:</strong> <span th:text="${user.enabled}"></span></p>
        <p><strong>Locked:</strong> <span th:text="${user.accountLocked}"></span></p>
        <p><strong>Failed Attempts:</strong> <span th:text="${user.failedAttempts}"></span></p>
        <p><strong>Created:</strong> <span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>

        <hr style="border-color:rgba(0,255,157,0.2);margin:20px 0;">

        <h3>⚡ Actions</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
            <form th:action="@{'/admin/users/' + ${user.id} + '/unlock'}" method="post">
                <button type="submit" class="btn">🔓 Unlock Account</button>
            </form>
            <form th:action="@{'/admin/users/' + ${user.id} + '/delete'}" method="post"
                  onsubmit="return confirm('Una uhakika? Hii haiwezi kurudishwa.');">
                <button type="submit" class="btn btn-danger">🗑️ Delete User</button>
            </form>
            <a th:href="@{/admin/users}" class="btn">← Back to Users</a>
        </div>
    </div>
</div>
</body>
</html>
