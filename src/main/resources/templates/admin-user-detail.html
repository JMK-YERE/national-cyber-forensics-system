<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 25px;">
        <h1 style="color: white; margin: 0;">👤 <span th:text="${user.username}">User</span></h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Maelezo ya Mtumiaji</p>
    </div>

    <div class="card">
        <h2>📋 Details</h2>
        <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Full Name:</strong> <span th:text="${user.fullName}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${user.phone}"></span></p>
        <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
        <p><strong>Organization:</strong> <span th:text="${user.organization}"></span></p>
        <p><strong>Enabled:</strong> <span th:text="${user.enabled != null && user.enabled ? '✅ Yes' : '❌ No'}"></span></p>
        <p><strong>Account Locked:</strong> <span th:text="${user.accountLocked != null && user.accountLocked ? '🔒 Yes' : '✅ No'}"></span></p>
        <p><strong>Last Login:</strong> <span th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'yyyy-MM-dd HH:mm') : 'Never'}"></span></p>
        <p><strong>Created:</strong> <span th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A'}"></span></p>
    </div>

    <div style="margin: 20px 0;">
        <a th:href="@{/admin/users}" class="btn" style="text-decoration: none;">← Back to Users</a>
    </div>
</div>
</body>
</html>
