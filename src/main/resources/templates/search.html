<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Cyber Forensics TZ</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container"><section class="app-card"><h1>🔍 Search Investigation</h1><form th:action="@{/incidents/search}" method="get" style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><input type="text" name="incidentId" placeholder="Incident ID" th:value="${searchId}" style="flex:1;min-width:240px;padding:11px;border:1px solid var(--line);border-radius:9px"><button class="app-btn app-btn-primary" type="submit">🔍 Search</button></form></section>
<section class="app-card" th:if="${results != null}"><h2>Results</h2><div th:if="${results.isEmpty()}" style="padding:30px;text-align:center;color:var(--muted)">Hakuna tukio lililopatikana: <span th:text="${searchId}"></span></div>
<div th:if="${!results.isEmpty()}" style="overflow:auto"><table style="width:100%"><thead><tr><th>Incident ID</th><th>Title</th><th>Status</th><th>Severity</th><th>Action</th></tr></thead><tbody><tr th:each="inc : ${results}"><td th:text="${inc.incidentId}"></td><td th:text="${inc.title}"></td><td th:text="${inc.status}"></td><td th:text="${inc.severity}"></td><td><a th:href="@{/incidents/{id}(id=${inc.id})}" class="app-btn app-btn-outline">View</a></td></tr></tbody></table></div></section></div></main>
<script th:src="@{/js/app.js}"></script></body></html>
