<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Assistant — Cyber Forensics TZ</title><link rel="stylesheet" th:href="@{/css/theme.css}"><style>.chat-wrap{max-width:980px;margin:0 auto}.ai-hero{background:linear-gradient(135deg,#03261d,#07543e 60%,#087d93);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}.ai-hero h1{color:#fff;font-size:23px;margin:0 0 5px}.ai-hero p{color:#dff8ee;font-size:12px}.chat-container{background:#f7fcfa;border:1px solid var(--line);border-radius:14px;padding:18px;min-height:390px;max-height:560px;overflow-y:auto}.chat-msg{margin-bottom:12px;padding:11px 14px;border-radius:11px;max-width:82%;word-wrap:break-word;font-size:13px;line-height:1.55}.chat-user{background:#063b2c;color:#fff;margin-left:auto}.chat-ai{background:#fff;color:#10251f;border:1px solid var(--line)}.chat-label{font-size:10px;font-weight:800;margin-bottom:4px}.chat-user .chat-label{color:#8ff5df}.chat-ai .chat-label{color:#087d93}.quick-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.quick-btn{background:#fff;border:1px solid #9bcdbd;color:#07543e;padding:7px 11px;border-radius:18px;cursor:pointer;font-size:11px;font-weight:700}.ai-form{margin-top:15px;display:flex;gap:8px}.ai-form input{flex:1;border:1px solid #cfe0da;border-radius:9px;padding:10px 12px}.clear-form{margin-top:8px;text-align:right}</style></head><body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="app-main"><div class="app-container chat-wrap"><section class="ai-hero"><h1>🤖 AI Security Assistant</h1><p>Uliza kuhusu phishing, account security, incident response, digital forensics au usalama wa kawaida.</p><p th:if="${isConfigured${" style="color:#9ff7d8;font-weight:800">● AI Connected</p><p th:unless="${isConfigured${" style="color:#ffe49b;font-weight:800">● AI haijaunganishwa</p></section><section class="app-card"><div class="chat-container" id="chatContainer"><div th:if="${history == null || history.isEmpty()${" style="text-align:center;color:#61736d;padding:40px 10px">💬 Uliza swali lako hapa.</div><div th:each="msg : ${history${" class="chat-msg" th:classappend="${msg.type == 'user' ? 'chat-user' : 'chat-ai'${"><div class="chat-label" th:text="${msg.type == 'user' ? '👤 Wewe' : '🤖 AI'${"></div><div th:text="${msg.text${" style="white-space:pre-wrap"></div><div style="font-size:9px;opacity:.65;margin-top:4px" th:text="${msg.time${"></div></div></div><div class="quick-btns"><button type="button" class="quick-btn" onclick="setMsg('Nisaidie kutambua phishing')">🎣 Phishing</button><button type="button" class="quick-btn" onclick="setMsg('Nifanye nini nikihisi account yangu imehackiwa?')">🔐 Account</button><button type="button" class="quick-btn" onclick="setMsg('Nisaidie kuhifadhi digital evidence')">🧪 Digital Evidence</button></div><form th:action="@{/ai/assistant}" method="post" class="ai-form"><input type="text" name="message" required placeholder="Andika swali..." id="messageInput"><button type="submit" class="app-btn app-btn-primary">📤 Tuma</button></form><form th:action="@{/ai/clear}" method="post" class="clear-form"><button type="submit" class="app-btn app-btn-outline">Futa mazungumzo</button></form></section></div></main><script th:src="@{/js/app.js}"></script><script>function setMsg(t){const e=document.getElementById('messageInput');if(e){e.value=t;e.focus()}}window.addEventListener('load',()=>{const c=document.getElementById('chatContainer');if(c)c.scrollTop=c.scrollHeight});</script></body></html>
