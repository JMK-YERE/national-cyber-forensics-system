<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Assistant — Cyber Forensics TZ</title>
<link rel="stylesheet" th:href="@{/css/theme.css}">
<style>.chat-wrap{width:100%;max-width:980px;margin:0 auto}.ai-hero{width:100%;background:#0f172a;color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}.ai-hero h1{color:#fff;font-size:23px;margin:0 0 5px}.ai-hero p{color:#dff8ee;font-size:12px}.chat-container{width:100%;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:18px;min-height:390px;max-height:560px;overflow-y:auto}.chat-msg{margin-bottom:12px;padding:11px 14px;border-radius:11px;max-width:82%;word-wrap:break-word;font-size:13px;line-height:1.55}.chat-user{background:#2563eb;color:#fff;margin-left:auto}.chat-ai{background:#fff;color:#10251f;border:1px solid var(--line)}.chat-label{font-size:10px;font-weight:800;margin-bottom:4px}.chat-user .chat-label{color:#dbeafe}.chat-ai .chat-label{color:#2563eb}.quick-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.quick-btn{background:#fff;border:1px solid #bfdbfe;color:#1d4ed8;padding:7px 11px;border-radius:18px;cursor:pointer;font-size:11px;font-weight:700}.ai-form{margin-top:15px;display:flex;gap:8px}.ai-form input{flex:1;border:1px solid #cfe0da;border-radius:9px;padding:10px 12px}.clear-form{margin-top:8px;text-align:right}@media(max-width:600px){.chat-wrap{max-width:100%;padding:0 2px}.ai-hero{padding:14px;border-radius:12px;margin-bottom:10px}.ai-hero h1{font-size:18px;line-height:1.25}.ai-hero p{font-size:11px;line-height:1.45;margin-top:3px}.chat-container{min-height:300px;max-height:58vh;padding:10px;border-radius:11px}.chat-msg{max-width:92%;padding:9px 10px;font-size:12px;line-height:1.45;border-radius:10px}.quick-btns{gap:5px;margin-top:9px}.quick-btn{font-size:10px;padding:6px 8px}.ai-form{gap:6px;margin-top:10px}.ai-form input{min-width:0;padding:9px 10px;font-size:12px}.ai-form .app-btn{min-height:40px;padding:8px 10px;font-size:11px}.clear-form{margin-top:6px}.clear-form .app-btn{min-height:36px;font-size:10px}}@media(max-width:380px){.ai-hero h1{font-size:17px}.chat-container{max-height:55vh}.chat-msg{font-size:11.5px}.quick-btn{font-size:9.5px}.ai-form input{font-size:11px}.ai-form .app-btn{font-size:10px}}</style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container chat-wrap">
<section class="ai-hero"><h1>🤖 AI Security Assistant</h1><p>Uliza kuhusu phishing, account security, incident response, digital forensics au usalama wa kawaida.</p>
</section>
<section class="app-card"><div class="chat-container" id="chatContainer">
<div th:if="${history == null || history.isEmpty()}" style="text-align:center;color:#61736d;padding:40px 10px">💬 Uliza swali lako hapa.</div>
<div th:each="msg : ${history}" class="chat-msg" th:classappend="${msg.type == 'user' ? 'chat-user' : 'chat-ai'}">
<div class="chat-label" th:text="${msg.type == 'user' ? '👤 Wewe' : '🤖 AI'}"></div><div th:text="${msg.text}" style="white-space:pre-wrap"></div>
<div style="font-size:9px;opacity:.65;margin-top:4px" th:text="${msg.time}"></div></div></div>
<div class="quick-btns"><button type="button" class="quick-btn" onclick="setMsg('Nisaidie kutambua phishing')">🎣 Phishing</button><button type="button" class="quick-btn" onclick="setMsg('Nifanye nini nikihisi account yangu imehackiwa?')">🔐 Account</button><button type="button" class="quick-btn" onclick="setMsg('Nisaidie kuhifadhi digital evidence')">🧪 Digital Evidence</button></div>
<form th:action="@{/ai/assistant}" method="post" class="ai-form">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="text" name="message" required placeholder="Andika swali..." id="messageInput"><button type="submit" class="app-btn app-btn-primary">📤 Tuma</button></form>
<form th:action="@{/ai/clear}" method="post" class="clear-form">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="app-btn app-btn-outline">Futa mazungumzo</button></form>
</section></div></main>
<script th:src="@{/js/app.js}"></script><script>function setMsg(t){const e=document.getElementById('messageInput');if(e){e.value=t;e.focus()}}window.addEventListener('load',()=>{const c=document.getElementById('chatContainer');if(c)c.scrollTop=c.scrollHeight});</script>
</body></html>
