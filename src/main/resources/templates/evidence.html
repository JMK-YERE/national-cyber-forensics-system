<!DOCTYPE html><html lang="sw" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="#{nav.evidence}">Evidence</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="app-main"><div class="page-header"><div><h1 th:text="#{nav.evidence}">Evidence</h1><p class="muted">Evidence inayopatikana kwako kulingana na incident assignment na case access.</p></div></div><section class="table-wrap" aria-label="Evidence list"><table class="data-table"><thead><tr><th>ID</th><th>Filename</th><th>Type</th><th>Size</th><th>SHA-256</th><th>Custody</th><th>Action</th></tr></thead><tbody><tr th:each="e : ${evidenceList}"><td th:text="${e.id}">1</td><td th:text="${e.originalFilename}">evidence.bin</td><td th:text="${e.fileType}">FILE</td><td th:text="${e.fileSize != null ? e.fileSize + ' bytes' : '-'}">-</td><td><code th:text="${e.sha256Hash}">-</code></td><td th:text="${e.custodyStatus}">UPLOADED</td><td><a class="btn btn-secondary btn-sm" th:href="@{/evidence/custody/{id}(id=${e.id})}">View custody</a></td></tr><tr th:if="${#lists.isEmpty(evidenceList)}"><td colspan="7" class="muted">Hakuna evidence inayopatikana kwa access yako.</td></tr></tbody></table></section></main></body></html>
