<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<body>
<section th:fragment="incidentMap" class="dashboard-intelligence">
<style>
.intel-stage{position:relative;width:100%;height:clamp(290px,42vw,500px);overflow:hidden;background:#02140f;border:1px solid rgba(34,197,94,.18)}
.intel-splash,.intel-map-layer{position:absolute;inset:0}
.intel-splash{z-index:3;display:flex;align-items:center;justify-content:center;background:#02140f;opacity:1;transform:translateX(0);transition:opacity .9s ease,transform 1s ease}
.intel-splash img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.intel-splash:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,20,15,.72),rgba(1,20,15,.05) 55%,rgba(1,20,15,.35))}
.intel-splash-copy{position:absolute;z-index:2;left:clamp(18px,4vw,58px);bottom:clamp(22px,5vw,52px);color:#fff;max-width:650px}
.intel-splash-copy small{display:block;color:#86efac;font:900 10px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.18em}
.intel-splash-copy strong{display:block;margin-top:8px;font-size:clamp(25px,4vw,48px);line-height:1.04}
.intel-splash-copy span{display:block;margin-top:9px;color:#c9f7e4;font-size:12px}
.intel-map-layer{z-index:1;opacity:0;transition:opacity 1s ease}
.intel-stage.map-ready .intel-splash{opacity:0;transform:translateX(-8%);pointer-events:none}
.intel-stage.map-ready .intel-map-layer{opacity:1}
.cyber-map{position:relative;width:100%;height:100%;background:#031b14 url('/images/cyber-world-map.svg') center/cover no-repeat;overflow:hidden}.cyber-map:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 62% 65%,rgba(34,197,94,.12),transparent 30%),linear-gradient(rgba(2,44,34,.05),rgba(2,44,34,.25));pointer-events:none}.cyber-dot{position:absolute;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:#ff3b30;border:2px solid #fff;box-shadow:0 0 8px #ff3b30,0 0 18px #ff3b30,0 0 34px rgba(255,59,48,.75);animation:incidentPulse 1.05s ease-in-out infinite;z-index:5;cursor:pointer}.cyber-dot.medium{background:#22c55e;box-shadow:0 0 7px #22c55e,0 0 20px rgba(34,197,94,.85)}.cyber-dot.low{background:#facc15;box-shadow:0 0 7px #facc15,0 0 20px rgba(250,204,21,.8)}.cyber-map-empty{position:absolute;inset:0;display:grid;place-items:center;color:#86efac;font:900 12px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;text-align:center;z-index:4;background:rgba(2,20,15,.22)}.cyber-dot-label{position:absolute;left:12px;top:14px;display:none;min-width:155px;padding:8px 10px;background:rgba(1,20,15,.94);border:1px solid rgba(134,239,172,.35);color:#eafff5;font-size:10px;line-height:1.45;z-index:10}.cyber-dot:hover .cyber-dot-label,.cyber-dot:focus .cyber-dot-label{display:block}@keyframes incidentPulse{0%,100%{transform:scale(.72);opacity:.72}50%{transform:scale(1.35);opacity:1}}@media(max-width:600px){.intel-stage{height:300px}.intel-splash-copy strong{font-size:26px}.dashboard-map-head{display:block}.dashboard-map-meta{margin-top:6px}.cyber-dot{width:10px;height:10px;margin:-5px 0 0 -5px}.cyber-dot-label{font-size:9px;min-width:135px}}</style>
<div id="incidentIntelligenceStage" class="intel-stage" aria-label="Forensics intelligence map">
  <div class="intel-splash">
    <img src="/images/forensics-splash.svg" alt="Cyber forensics investigation workspace">
    <div class="intel-splash-copy">
      <small>DIGITAL FORENSICS • INCIDENT INTELLIGENCE</small>
      <strong>Evidence. Investigation. Response.</strong>
      <span>Muonekano wa forensic unaandaa ramani ya matukio yaliyoripotiwa.</span>
    </div>
  </div>
  <div class="intel-map-layer"><div id="dashboardIncidentMap" class="cyber-map"></div></div>
</div>
<div class="dashboard-map-head">
  <div><h2>Ramani ya Matukio</h2><p>Dot inayowaka inaonyesha tukio lililoripotiwa; taarifa binafsi za aliyeripoti hazionyeshwi.</p></div>
  <div class="dashboard-map-meta">● LIVE INCIDENT INTELLIGENCE</div>
</div>
<script>
const dashboardReports=/*[[${mapPoints}]]*/[]||[];
const regionCoords={Arusha:[-3.3869,36.6830],Dar:[-6.7924,39.2083],"Dar es Salaam":[-6.7924,39.2083],Dodoma:[-6.1630,35.7516],Geita:[-2.8728,32.2294],Iringa:[-7.7696,35.6914],Kagera:[-1.3290,31.8090],Katavi:[-6.8270,31.0750],Kigoma:[-4.8769,29.6267],Kilimanjaro:[-3.0674,37.3556],Lindi:[-9.9931,39.7165],Manyara:[-4.3150,36.9541],Mara:[-1.7757,34.1532],Mbeya:[-8.9094,33.4608],Morogoro:[-6.8278,37.6591],Mtwara:[-10.2736,40.1828],Mwanza:[-2.5164,32.9175],Njombe:[-9.3333,34.7667],Pwani:[-7.3238,38.7660],Rukwa:[-8.0109,31.6107],Ruvuma:[-10.6870,35.6500],Shinyanga:[-3.6619,33.4232],Simiyu:[-2.9995,33.7940],Singida:[-4.8149,34.7439],Songwe:[-8.2582,32.5325],Tabora:[-5.0160,32.8009],Tanga:[-5.0689,39.0982],Zanzibar:[-6.1659,39.2026]};
function project(lat,lon){return{x:((lon+180)/360)*100,y:((90-lat)/180)*100}}
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const map=document.getElementById('dashboardIncidentMap');if(!map)return;const reports=Array.isArray(dashboardReports)?dashboardReports:[];const empty=map.querySelector('.cyber-map-empty');if(!reports.length){if(!empty)map.insertAdjacentHTML('beforeend','<div class="cyber-map-empty">NO REPORTED INCIDENTS YET</div>');}else if(empty){empty.remove();}const seen={};reports.forEach((r,index)=>{const raw=String(r?.region||'').trim(),key=raw.replace(/\\s+(Region|Mkoa)$/i,'').replace(/^Mkoa wa\\s+/i,'').replace(/^Region of\\s+/i,'').trim();let base=regionCoords[key]||regionCoords[key.replace(/\\s+Region$/i,'')];if(!base){const seed=[...raw].reduce((a,ch)=>a+ch.charCodeAt(0),0);base=[-6.2,35.8+((seed%17)-8)*0.55];}const count=seen[key||'Unknown']||0;seen[key||'Unknown']=count+1;const jitter=count?((count%3)-1)*1.3:0;const p=project(base[0],base[1]);p.x=Math.max(2,Math.min(98,p.x+jitter));p.y=Math.max(4,Math.min(96,p.y+jitter));const priority=String(r?.priority||'MEDIUM').toUpperCase(),cls=priority==='LOW'?' low':priority==='MEDIUM'?' medium':'';const dot=document.createElement('button');dot.type='button';dot.className='cyber-dot'+cls;dot.style.left=p.x+'%';dot.style.top=p.y+'%';dot.setAttribute('aria-label','Incident '+(key||'Unknown region'));dot.innerHTML='<span class="cyber-dot-label"><strong>'+safe(key||'Unknown region')+'</strong><br>'+safe(r?.type||'Other')+'<br>'+safe(r?.status||'NEW')+' • '+safe(priority)+'</span>';map.appendChild(dot)});setTimeout(()=>document.getElementById('incidentIntelligenceStage')?.classList.add('map-ready'),1800)
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',initCyberIncidentMap):initCyberIncidentMap();
</script>
</section>
</body>
</html>
