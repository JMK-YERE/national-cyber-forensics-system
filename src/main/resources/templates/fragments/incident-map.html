<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:inline="javascript"><body>
<section th:fragment="incidentMap" class="dashboard-map"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>.intel-welcome{padding:4px 0 17px;border-left:3px solid #22c55e;padding-left:15px;margin-bottom:14px}.intel-welcome span{font-size:9px;font-weight:900;letter-spacing:.14em;color:#15803d}.intel-welcome h2{font-size:25px;color:#022c22;margin:5px 0}.intel-welcome p{font-size:12px;color:#61736d;margin:0;line-height:1.6}.intel-world{width:100%;margin:0 0 20px;overflow:hidden;background:#022c22}.intel-world img{display:block;width:100%;height:auto;min-height:180px;object-fit:cover}.dashboard-map{margin:0 0 26px;border-bottom:1px solid rgba(6,95,70,.14);padding:0 0 20px}.dashboard-map-head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:12px}.dashboard-map-head h2{font-size:17px;color:#022c22;margin:0}.dashboard-map-head p{font-size:10px;color:#71807d;margin:3px 0 0}.dashboard-map-meta{font-size:10px;color:#047857;font-weight:800}.dashboard-map-canvas{height:330px;width:100%;overflow:hidden}.dashboard-map-canvas .leaflet-container{font:11px Inter,"Segoe UI",sans-serif}@media(max-width:600px){.dashboard-map-canvas{height:270px}.dashboard-map-head{display:block}.dashboard-map-meta{margin-top:6px}}</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const dashboardReports=/*[[${mapPoints}]]*/[];
const dashboardRegions={Arusha:[-3.3869,36.6830],Dar:[-6.7924,39.2083],"Dar es Salaam":[-6.7924,39.2083],Dodoma:[-6.1630,35.7516],Geita:[-2.8728,32.2294],Iringa:[-7.7696,35.6914],Kagera:[-1.3290,31.8090],Katavi:[-6.8270,31.0750],Kigoma:[-4.8769,29.6267],Kilimanjaro:[-3.0674,37.3556],Lindi:[-9.9931,39.7165],Manyara:[-4.3150,36.9541],Mara:[-1.7757,34.1532],Mbeya:[-8.9094,33.4608],Morogoro:[-6.8278,37.6591],Mtwara:[-10.2736,40.1828],Mwanza:[-2.5164,32.9175],Njombe:[-9.3333,34.7667],Pwani:[-7.3238,38.7660],Rukwa:[-8.0109,31.6107],Ruvuma:[-10.6870,35.6500],Shinyanga:[-3.6619,33.4232],Simiyu:[-2.9995,33.7940],Singida:[-4.8149,34.7439],Songwe:[-8.2582,32.5325],Tabora:[-5.0160,32.8009],Tanga:[-5.0689,39.0982],Zanzibar:[-6.1659,39.2026]};
const dashboardMap=L.map('dashboardIncidentMap',{scrollWheelZoom:false}).setView([-6.369,34.8888],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(dashboardMap);const groups={};dashboardReports.forEach(r=>{const k=r.region;groups[k]??={total:0,high:0,types:{}};groups[k].total++;if(['HIGH','CRITICAL'].includes((r.priority||'MEDIUM').toUpperCase()))groups[k].high++;groups[k].types[r.type]=(groups[k].types[r.type]||0)+1});Object.entries(groups).forEach(([region,g])=>{const pos=dashboardRegions[region]||dashboardRegions[region.trim()];if(!pos)return;const color=g.high?'#dc2626':'#15803d';const marker=L.circleMarker(pos,{radius:Math.min(22,7+g.total*1.5),color,fillColor:color,fillOpacity:.58,weight:2}).addTo(dashboardMap);const types=Object.entries(g.types).map(x=>x[0]+' ('+x[1]+')').join(', ');marker.bindPopup('<b>'+region+'</b><br>Reports: '+g.total+'<br>High/Critical: '+g.high+'<br>'+types)});setTimeout(()=>dashboardMap.invalidateSize(),250);
</script></section></body></html>
