<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div class="navbar" th:fragment="navbar">
    <div class="logo">🛡️ <span th:text="#{app.title}">Cyber Forensics</span></div>
    <div class="nav-links">
        <a th:href="@{/dashboard}" th:text="#{nav.dashboard}">Dashboard</a>
        <a th:href="@{/report-attack}" th:text="#{nav.report}">Report</a>
        <a th:href="@{/ai/assistant}" th:text="#{nav.ai}">AI</a>
        <a th:href="@{/tools/security-center}" th:text="#{nav.tools}">Tools</a>
        <a th:href="@{/notifications}">🔔 <span th:text="#{nav.notifications}">Notifications</span></a>

        <a sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_CYBER_PRO','ROLE_FORENSICS','ROLE_ANALYST')"
           th:href="@{/report-attack/admin}"
           style="color:#C9A227; font-weight:bold;">👑 <span th:text="#{nav.admin}">Admin</span></a>

        <!-- HAKUNA LANGUAGE SWITCH KWA INTERNAL PAGES -->

        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="logout-btn" th:text="#{nav.logout}">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
