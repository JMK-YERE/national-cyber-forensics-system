<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div class="navbar" th:fragment="navbar">
    <div class="logo">🛡️ Cyber Forensics System</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/report-attack}">Report</a>
        <a th:href="@{/ai/assistant}">AI</a>
        <a th:href="@{/tools/security-center}">Tools</a>
        <a th:href="@{/notifications}">🔔 Notifications</a>

        <a sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_CYBER_PRO','ROLE_FORENSICS','ROLE_ANALYST')"
           th:href="@{/report-attack/admin}"
           style="color:#c9a227; font-weight:bold;">👑 Admin Panel</a>

        <span style="margin-left:15px; padding-left:15px; border-left:1px solid rgba(255,255,255,0.3);">
            <a th:href="@{/dashboard?lang=sw}" th:classappend="${#locale.language == 'sw'} ? 'active-lang'" style="color:white; padding:4px 8px; text-decoration:none;">🇹🇿 SW</a>
            <a th:href="@{/dashboard?lang=en}" th:classappend="${#locale.language == 'en'} ? 'active-lang'" style="color:white; padding:4px 8px; text-decoration:none;">🇬🇧 EN</a>
            <a th:href="@{/dashboard?lang=fr}" th:classappend="${#locale.language == 'fr'} ? 'active-lang'" style="color:white; padding:4px 8px; text-decoration:none;">🇫🇷 FR</a>
            <a th:href="@{/dashboard?lang=ar}" th:classappend="${#locale.language == 'ar'} ? 'active-lang'" style="color:white; padding:4px 8px; text-decoration:none;">🇸🇦 AR</a>
        </span>

        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
