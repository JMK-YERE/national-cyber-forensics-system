<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header">
<header class="app-header">
<button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Menu">☰</button>
<div class="header-logo"><span class="logo-icon">🛡</span><span>Cyber Forensics TZ</span></div>
<div class="header-clock"><span>📅</span><span class="clock-date" id="clockDate">—</span><span>•</span><span class="clock-time" id="clockTime">--:--:--</span></div>
<div class="header-profile">
<button class="profile-btn" onclick="toggleProfileMenu()" aria-haspopup="true" aria-expanded="false">
<div class="profile-avatar" th:text="${#authentication != null and #authentication.name != null ? #strings.substring(#authentication.name,0,1).toUpperCase() : 'U'}">U</div>
<span th:text="${#authentication != null ? #authentication.name : 'User'}">User</span><span>⌄</span>
</button>
<div class="profile-dropdown" id="profileDropdown">
<a th:href="@{/dashboard}" class="dropdown-item"><span>⌂</span>Dashboard</a>
<a th:href="@{/change-password}" class="dropdown-item"><span>🔐</span>Change Password</a>
<div class="dropdown-divider"></div>
<form th:action="@{/logout}" method="post"><button type="submit" class="dropdown-item danger"><span>🚪</span>Logout</button></form>
</div>
</div>
</header>
<a th:href="@{/ai/assistant}" class="ai-floating" aria-label="Uliza AI — Cyber Security Assistant">
<span class="ai-robot"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><linearGradient id="aiGradHeader" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#06D6D6"/></linearGradient></defs>
<circle cx="50" cy="50" r="46" fill="#fff" stroke="#06D6D6" stroke-width="3"/><rect x="27" y="28" width="46" height="44" rx="14" fill="url(#aiGradHeader)"/>
<circle cx="42" cy="48" r="4" fill="#071827"/><circle cx="58" cy="48" r="4" fill="#071827"/><path d="M40 58 Q50 66 60 58" fill="none" stroke="#071827" stroke-width="3" stroke-linecap="round"/>
<path d="M50 28V17" stroke="#06D6D6" stroke-width="4"/><circle cx="50" cy="13" r="4" fill="#06D6D6"/></svg></span>
<span class="ai-floating-label">Uliza AI →</span></a>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
</th:block>
</body></html>
