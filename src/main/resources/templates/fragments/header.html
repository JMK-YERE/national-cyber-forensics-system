<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header">
<header class="app-header">
<button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Menu" aria-expanded="false" aria-controls="appSidebar">☰</button>
<div class="header-logo"><span class="logo-icon">🛡</span><span>Cyber Forensics TZ</span></div>
<div class="header-clock"><span>📅</span><span class="clock-date" id="clockDate">—</span><span>•</span><span class="clock-time" id="clockTime">--:--:--</span><button type="button" class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">☾</button><div class="header-language"><button type="button" class="language-btn" onclick="toggleLanguageMenu()" aria-label="Language">🌐 <span th:text="${#locale.language == 'sw' ? 'SW' : 'EN'}">EN</span></button><div class="language-menu" id="languageMenu"><a th:href="@{/lang(lang='sw')}">SW — Kiswahili</a><a th:href="@{/lang(lang='en')}">EN — English</a></div></div></div>
<div class="header-profile">
<button class="profile-btn" onclick="toggleProfileMenu()" aria-haspopup="true" aria-expanded="false">
<div class="profile-avatar" th:text="${#authentication != null and #authentication.name != null and #authentication.name.length() > 0 ? #strings.substring(#authentication.name,0,1).toUpperCase() : 'U'}">U</div>
<span th:text="${#authentication != null ? #authentication.name : 'User'}">User</span><span>⌄</span>
</button>
<div class="profile-dropdown" id="profileDropdown">
<a th:href="@{/dashboard}" class="dropdown-item"><span>⌂</span><span th:text="#{nav.dashboard}">Dashboard</span></a>
<a th:href="@{/change-password}" class="dropdown-item"><span>🔐</span><span th:text="#{nav.changePassword}">Change Password</span></a>
<div class="dropdown-divider"></div>
<form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="dropdown-item danger"><span>🚪</span><span th:text="#{nav.logout}">Logout</span></button></form>
</div>
</div>
</header>
<a th:href="@{/ai/assistant}" class="ai-floating" aria-label="Uliza AI — Cyber Security Assistant">
<span class="ai-robot"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><linearGradient id="aiGradHeader" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#60A5FA"/></linearGradient></defs>
<circle cx="50" cy="50" r="46" fill="#fff" stroke="#2563EB" stroke-width="3"/><rect x="27" y="28" width="46" height="44" rx="14" fill="url(#aiGradHeader)"/>
<circle cx="42" cy="48" r="4" fill="#071827"/><circle cx="58" cy="48" r="4" fill="#071827"/><path d="M40 58 Q50 66 60 58" fill="none" stroke="#071827" stroke-width="3" stroke-linecap="round"/>
<path d="M50 28V17" stroke="#60A5FA" stroke-width="4"/><circle cx="50" cy="13" r="4" fill="#2563EB"/></svg></span>
<span class="ai-floating-label">Uliza AI →</span></a>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()" aria-hidden="true"></div>
<style>
.theme-btn{height:34px;width:34px;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:7px;font-size:16px;font-weight:900;cursor:pointer}.header-language{position:relative;margin-left:8px}.language-btn{height:34px;padding:0 9px;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:7px;font-size:11px;font-weight:900;cursor:pointer}.language-menu{display:none;position:absolute;right:0;top:40px;min-width:155px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 12px 30px rgba(15,23,42,.12);z-index:99999}.language-menu.show{display:block}.language-menu a{display:block;padding:11px 13px;color:#334155!important;font-size:12px;font-weight:800;text-decoration:none}.language-menu a:hover{background:#eff6ff;color:#1d4ed8!important}@media(max-width:600px){.header-language{margin-left:2px}.language-btn{height:38px;padding:0 8px}.language-menu{right:-42px}}
</style>
<script>
function toggleLanguageMenu(){const m=document.getElementById('languageMenu');if(m)m.classList.toggle('show')}
document.addEventListener('click',e=>{const m=document.getElementById('languageMenu'),b=document.querySelector('.language-btn');if(m&&b&&!m.contains(e.target)&&!b.contains(e.target))m.classList.remove('show')});
</script>
</th:block>
</body></html>
