<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{whistleblower.portalTitle}">Whistleblower Portal</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ <span th:text="#{app.title}">Cyber Forensics System</span></div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}" th:text="#{whistleblower.home}">Home</a>
        <a th:href="@{/whistleblower/track}" th:text="#{whistleblower.trackTitle}">Track Report</a>
        <a th:href="@{/login}" th:text="#{whistleblower.login}">Login</a>
        <span style="margin-left:15px; padding-left:15px; border-left:1px solid rgba(255,255,255,0.3);">
            <a th:href="@{/lang?lang=sw}" th:classappend="${#locale.language == 'sw'} ? 'active-lang'" style="color:white; padding:4px 8px;">SW</a>
            <a th:href="@{/lang?lang=en}" th:classappend="${#locale.language == 'en'} ? 'active-lang'" style="color:white; padding:4px 8px;">EN</a>
            <a th:href="@{/lang?lang=fr}" th:classappend="${#locale.language == 'fr'} ? 'active-lang'" style="color:white; padding:4px 8px;">FR</a>
            <a th:href="@{/lang?lang=ar}" th:classappend="${#locale.language == 'ar'} ? 'active-lang'" style="color:white; padding:4px 8px;">AR</a>
        </span>
    </div>
</div>
<div class="container">
    <div class="hero" style="text-align:center; padding:40px; background:linear-gradient(135deg, #0f2557, #1a3a70); color:white; border-radius:10px;">
        <h1 th:text="#{whistleblower.portalTitle}">Whistleblower Portal</h1>
        <p th:text="#{whistleblower.portalSubtitle}">Report corruption, bribery, harassment anonymously.</p>
        <div style="margin-top:30px;">
            <a th:href="@{/whistleblower/report}" class="btn btn-primary" th:text="#{whistleblower.reportNow}">Report Now</a>
            <a th:href="@{/whistleblower/track}" class="btn" th:text="#{whistleblower.trackTitle}">Track Report</a>
        </div>
    </div>
    <div class="card" style="margin-top:30px;">
        <h2 th:text="#{whistleblower.whatReport}">What can you report?</h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-top:20px;">
            <div class="stat-box"><div class="stat-value">💰</div><div class="stat-label" th:text="#{category.CORRUPTION}">Corruption</div></div>
            <div class="stat-box"><div class="stat-value">🎭</div><div class="stat-label" th:text="#{category.FRAUD}">Fraud</div></div>
            <div class="stat-box"><div class="stat-value">💻</div><div class="stat-label" th:text="#{category.CYBER_ATTACK}">Cyber Attack</div></div>
            <div class="stat-box"><div class="stat-value">😢</div><div class="stat-label" th:text="#{category.HARASSMENT}">Harassment</div></div>
        </div>
    </div>
</div>
</body>
</html>
