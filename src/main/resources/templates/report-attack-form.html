<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Attack</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;">🚨 Report Cyber Attack</h1>
        <p style="color: rgba(255,255,255,0.9);">Toa taarifa ya tukio la kimtandao</p>
    </div>

    <!-- NEW REPORT FORM -->
    <div class="card">
        <h2>📝 New Report</h2>
        <form th:action="@{/report-attack/new}" method="post" enctype="multipart/form-data">
            <div style="display:grid; gap:15px;">
                <div>
                    <label><strong>Title</strong></label>
                    <input type="text" name="title" required style="width:100%; padding:10px; margin-top:5px;">
                </div>
                <div>
                    <label><strong>Attack Type</strong></label>
                    <select name="attackType" required style="width:100%; padding:10px; margin-top:5px;">
                        <option value="PHISHING">🎣 Phishing</option>
                        <option value="RANSOMWARE">🔒 Ransomware</option>
                        <option value="HACKING">💻 Hacking</option>
                        <option value="FRAUD">💰 Fraud</option>
                        <option value="CYBERBULLYING">😢 Cyberbullying</option>
                        <option value="DATA_BREACH">📊 Data Breach</option>
                        <option value="OTHER">❓ Other</option>
                    </select>
                </div>
                <div>
                    <label><strong>Description</strong></label>
                    <textarea name="description" rows="5" required style="width:100%; padding:10px; margin-top:5px;"></textarea>
                </div>
                <div>
                    <label><strong>Region</strong></label>
                    <input type="text" name="region" style="width:100%; padding:10px; margin-top:5px;">
                </div>
                <div>
                    <label><strong>Evidence File (optional)</strong></label>
                    <input type="file" name="evidenceFile" style="width:100%; padding:10px; margin-top:5px;">
                </div>
                <button type="submit" class="btn btn-danger" style="padding:15px; font-size:16px;">🚨 SUBMIT REPORT</button>
            </div>
        </form>
    </div>

    <!-- MY REPORTS — INAONEKANA KWA WOTE -->
    <div class="card">
        <h2>📋 My Reports</h2>
        <p style="color:#666;">Reports zako binafsi</p>

        <div th:if="${myReports == null || myReports.isEmpty()}" style="text-align:center; padding:40px; color:#888;">
            <p>Hakuna reports bado.</p>
        </div>

        <div th:each="r : ${myReports}" style="padding:15px; margin:10px 0; border-radius:8px; background:rgba(15,37,87,0.03); border-left:4px solid #0f2557;">
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                <div>
                    <strong th:text="${r.reportId}"></strong>
                    <span style="color:#666;"> — </span>
                    <span th:text="${r.title}"></span>
                    <br>
                    <small style="color:#888;">
                        Status: <strong th:text="${r.status}"></strong> |
                        <span th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="btn btn-primary" style="text-decoration:none;">👁️ View</a>
            </div>
        </div>
    </div>

    <!-- ADMIN VIEW: ALL REPORTS -->
    <div class="card" th:if="${canSeeAll}" style="border-left:4px solid #c9a227;">
        <h2 style="color:#c9a227;">👑 All Reports (Admin View)</h2>
        <p style="color:#666;">Reports zote kutoka watumiaji wote</p>

        <div th:each="r : ${allReports}" style="padding:15px; margin:10px 0; border-radius:8px; background:rgba(201,162,39,0.05); border-left:4px solid #c9a227;">
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                <div>
                    <strong th:text="${r.reportId}"></strong>
                    <span th:text="${r.title}"></span>
                    <br>
                    <small style="color:#888;">
                        By: <span th:text="${r.reporterName}"></span> |
                        Status: <strong th:text="${r.status}"></strong>
                    </small>
                </div>
                <a th:href="@{'/report-attack/view/' + ${r.id}}" class="btn" style="text-decoration:none;">👁️ View</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
