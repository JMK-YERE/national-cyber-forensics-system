<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{report.title} + ' - ' + #{app.title}">Report</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card" style="text-align:center; background:linear-gradient(135deg, var(--deep-red), var(--red-light)); color:white; padding:30px;">
        <h1 style="color:white; font-size:28px; margin:0;" th:text="#{report.title}">Report Attack</h1>
        <p style="color:white; margin:10px 0 0 0;" th:text="#{report.subtitle}">Report any incident</p>
    </div>

    <div class="card" th:if="${canSeeAll}">
        <h2 th:text="#{report.adminView}">Admin View</h2>
        <a th:href="@{/report-attack/admin}" class="btn btn-primary" th:text="#{report.viewAll}">View All</a>
    </div>

    <div class="card">
        <h2 th:text="#{report.title}">Report</h2>
        <form th:action="@{/report-attack/new}" method="post" enctype="multipart/form-data">

            <label th:text="#{report.country} + ' *'">Country *</label>
            <select name="country" required>
                <option th:each="c : ${countries}" th:value="${c.code}" th:text="${c.name}"></option>
            </select>

            <label th:text="#{report.attackType} + ' *'">Attack Type *</label>
            <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:15px 0;">
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="PHONE_STOLEN" required style="display:none;">
                    <div style="font-size:30px;">📱</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.PHONE_STOLEN}">Phone</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="SOCIAL_MEDIA_HACKED" style="display:none;">
                    <div style="font-size:30px;">👤</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.SOCIAL_MEDIA_HACKED}">Social</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="BANK_CARD_LOST" style="display:none;">
                    <div style="font-size:30px;">💳</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.BANK_CARD_LOST}">Card</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="MONEY_STOLEN" style="display:none;">
                    <div style="font-size:30px;">💰</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.MONEY_STOLEN}">Money</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="EMAIL_HACKED" style="display:none;">
                    <div style="font-size:30px;">📧</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.EMAIL_HACKED}">Email</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="PHISHING" style="display:none;">
                    <div style="font-size:30px;">🎣</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.PHISHING}">Phishing</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="RANSOMWARE" style="display:none;">
                    <div style="font-size:30px;">🦠</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.RANSOMWARE}">Ransomware</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="SIM_SWAP" style="display:none;">
                    <div style="font-size:30px;">📲</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.SIM_SWAP}">SIM Swap</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="HOME_BREAK_IN" style="display:none;">
                    <div style="font-size:30px;">🏠</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.HOME_BREAK_IN}">Break-In</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="IDENTITY_THEFT" style="display:none;">
                    <div style="font-size:30px;">🆔</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.IDENTITY_THEFT}">ID Theft</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="DOCUMENTS_STOLEN" style="display:none;">
                    <div style="font-size:30px;">💼</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.DOCUMENTS_STOLEN}">Documents</div>
                </label>
                <label style="cursor:pointer; text-align:center; padding:15px; border:2px solid rgba(15,37,87,0.2); border-radius:8px; background:white;" onclick="selectAttack(this)">
                    <input type="radio" name="attackType" value="OTHER" style="display:none;">
                    <div style="font-size:30px;">⚠️</div>
                    <div style="font-size:11px; font-weight:600;" th:text="#{attack.OTHER}">Other</div>
                </label>
            </div>

            <label th:text="#{report.title2} + ' *'">Title *</label>
            <input type="text" name="title" required>

            <label th:text="#{report.description} + ' *'">Description *</label>
            <textarea name="description" rows="5" required></textarea>

            <label th:text="#{report.region} + ' *'">Region *</label>
            <select name="region" required>
                <option value="">--</option>
                <option th:each="r : ${defaultCountry.regions}" th:value="${r}" th:text="${r}"></option>
            </select>

            <label th:text="#{report.location}">Location</label>
            <input type="text" name="location">

            <label th:text="#{report.dateOccurred}">Date Occurred</label>
            <input type="datetime-local" name="dateOccurred">

            <label th:text="#{report.financialLoss}">Financial Loss</label>
            <input type="number" name="financialLossTzs" placeholder="0">

            <div style="background:rgba(201,162,39,0.08); border-left:4px solid var(--gold); padding:20px; border-radius:8px; margin:20px 0;">
                <h4 th:text="#{report.contact}">Contact Info</h4>

                <label th:text="#{report.fullName} + ' *'">Full Name *</label>
                <input type="text" name="reporterName" required th:value="${user.fullName != null ? user.fullName : user.username}">

                <label th:text="#{report.phone} + ' *'">Phone *</label>
                <input type="tel" name="reporterPhone" required th:value="${user.phone != null ? user.phone : ''}">

                <label th:text="#{report.email} + ' *'">Email *</label>
                <input type="email" name="reporterEmail" required th:value="${user.email}">

                <label th:text="#{report.idNumber}">ID Number</label>
                <input type="text" name="reporterIdNumber">

                <label th:text="#{report.address}">Address</label>
                <input type="text" name="reporterAddress">
            </div>

            <div style="background:rgba(15,37,87,0.05); border-left:4px solid var(--dark-blue); padding:20px; border-radius:8px;">
                <h4 th:text="#{report.evidence}">Evidence</h4>

                <label th:text="#{report.uploadFile}">Upload File</label>
                <input type="file" name="evidenceFile" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt">

                <label th:text="#{report.evidenceDesc}">Describe evidence</label>
                <textarea name="evidenceDescription" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-danger" style="width:100%; padding:18px; font-size:16px; margin-top:20px;">
                🚨 <span th:text="#{report.submit}">SUBMIT REPORT</span>
            </button>
        </form>
    </div>
</div>

<script>
function selectAttack(el) {
    document.querySelectorAll('.attack-option').forEach(o => o.style.borderColor = 'rgba(15,37,87,0.2)');
    el.style.borderColor = 'var(--deep-red)';
    el.style.background = 'rgba(139,26,26,0.08)';
}
</script>
</body>
</html>
