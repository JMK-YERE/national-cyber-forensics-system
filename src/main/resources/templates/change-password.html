<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{password.change}">Change Password</title><link rel="stylesheet" th:href="@{/css/theme.css}"><style>
.password-page{max-width:720px;margin:0 auto}.password-head{border-left:3px solid #22c55e;padding-left:15px;margin-bottom:24px}.password-head h1{margin:0;color:#022c22;font-size:28px}.password-head p{margin:5px 0 0;color:#61736d;font-size:12px}.password-form{max-width:520px}.password-field{margin-bottom:18px}.password-field label{display:block;margin-bottom:6px;color:#064e3b;font-size:12px;font-weight:900}.password-field input{width:100%;height:46px;border:0;border-bottom:1px solid #b8d1c6;border-radius:0;background:#fff;padding:0 3px;font-size:14px;outline:0}.password-field input:focus{border-bottom:2px solid #16a34a}.password-actions{display:flex;gap:12px;align-items:center}.password-actions .app-btn{min-height:45px}.password-message{padding:10px 0;font-size:12px;margin-bottom:12px}.password-success{color:#08785a}.password-error{color:#b4232c}@media(max-width:600px){.password-page{padding:0 4px}.password-head h1{font-size:24px}.password-actions{display:block}.password-actions .app-btn{width:100%;margin-bottom:10px}}
</style></head><body>
<div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container"><section class="password-page">
<header class="password-head"><h1>🔐 <span th:text="#{password.change}">Change Password</span></h1><p>Update your account password securely from this workspace.</p></header>
<div class="password-message password-success" th:if="${success}" th:text="${success}"></div><div class="password-message password-error" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/change-password}" method="post" class="password-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="password-field"><label th:text="#{password.current}">Current Password</label><input type="password" name="currentPassword" autocomplete="current-password" required></div>
<div class="password-field"><label th:text="#{password.new}">New Password</label><input type="password" name="newPassword" autocomplete="new-password" minlength="6" required></div>
<div class="password-field"><label th:text="#{password.confirm}">Confirm New Password</label><input type="password" name="confirmPassword" autocomplete="new-password" minlength="6" required></div>
<div class="password-actions"><button type="submit" class="app-btn app-btn-primary" th:text="#{password.changeBtn}">CHANGE PASSWORD</button><a th:href="@{/dashboard}" class="app-btn app-btn-outline" th:text="#{nav.dashboard}">Dashboard</a></div>
</form></section></div></main><script th:src="@{/js/app.js}"></script></body></html>
