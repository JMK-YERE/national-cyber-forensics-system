<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{password.change}">Change Password</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div></main>
<div th:replace="~{fragments/sidebar :: sidebar}"></div></main>

<div class="app-container" style="max-width: 500px; margin: 40px auto;">
    <div class="app-card" style="background: linear-gradient(135deg, #0F4C3A, #1B7A4A); color: white; padding: 30px;">
        <h1 style="color: white; margin: 0;">🔐 <span th:text="#{password.change}">Change Password</span></h1>
        <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Badilisha neno la siri lako</p>
    </div></main>

    <div class="app-card" th:if="${success}" style="background: rgba(16,185,129,0.1); border-left: 4px solid #10B981; padding: 15px;">
        <p style="color: #10B981; margin: 0;" th:text="${success}"></p>
    </div></main>

    <div class="app-card" th:if="${error}" style="background: rgba(220,38,38,0.1); border-left: 4px solid #DC2626; padding: 15px;">
        <p style="color: #DC2626; margin: 0;" th:text="${error}"></p>
    </div></main>

    <form th:action="@{/change-password}" method="post" class="app-card">
        <div style="margin-bottom: 15px;">
            <label style="font-weight: 600; color: #0F4C3A;" th:text="#{password.current}">Current Password</label>
            <input type="password" name="currentPassword" required style="width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 10px; margin-top: 6px;">
        </div></main>
        <div style="margin-bottom: 15px;">
            <label style="font-weight: 600; color: #0F4C3A;" th:text="#{password.new}">New Password</label>
            <input type="password" name="newPassword" required minlength="6" style="width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 10px; margin-top: 6px;">
        </div></main>
        <div style="margin-bottom: 20px;">
            <label style="font-weight: 600; color: #0F4C3A;" th:text="#{password.confirm}">Confirm New Password</label>
            <input type="password" name="confirmPassword" required minlength="6" style="width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 10px; margin-top: 6px;">
        </div></main>
        <button type="submit" class="app-btn app-btn-primary" style="width: 100%; padding: 14px; font-size: 15px; font-weight: 700;" th:text="#{password.changeBtn}">
            CHANGE PASSWORD
        </button>
    </form>
</div></main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
