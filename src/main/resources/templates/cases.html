<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📁 Case Files - Cyber Forensics</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🇹🇿 CYBER FORENSICS TZ</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">🏠 Dashboard</a>
        <a th:href="@{/incidents}">📋 Incidents</a>
        <a th:href="@{/cases}">📁 Cases</a>
        <a th:href="@{/audit}">📊 Audit</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="logout-btn">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1>📁 Case Management</h1>
        <p>Kufuatilia kesi za uchunguzi wa matukio ya usalama.</p>
        <a th:href="@{/cases/new}" class="btn btn-primary" style="margin-top:15px;">➕ Create New Case</a>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value" th:text="${openCount}">0</div>
            <div class="stat-label">Open Cases</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${investigatingCount}">0</div>
            <div class="stat-label">Investigating</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" th:text="${closedCount}">0</div>
            <div class="stat-label">Closed</div>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Case #</th>
                <th>Title</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assigned</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${cases.isEmpty()}">
                <td colspan="7" style="text-align:center;">Hakuna kesi bado.</td>
            </tr>
            <tr th:each="c : ${cases}" th:class="${c.statusClass}">
                <td th:text="${c.caseNumber}"></td>
                <td th:text="${c.title}"></td>
                <td th:text="${c.priority}"></td>
                <td th:text="${c.status}"></td>
                <td th:text="${c.assignedToName != null ? c.assignedToName : 'Unassigned'}"></td>
                <td th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd')}"></td>
                <td><a th:href="@{'/cases/' + ${c.id}}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
