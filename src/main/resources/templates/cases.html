<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.cases} + ' - ' + #{app.title}">Cases</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card">
        <h1 th:text="#{nav.cases}">Cases</h1>
        <a th:href="@{/cases/new}" class="btn btn-primary" style="margin-top:15px;">➕ Add</a>
    </div>

    <div class="stats-grid">
        <div class="stat-box"><div class="stat-value" th:text="${openCount}">0</div><div class="stat-label">Open</div></div>
        <div class="stat-box"><div class="stat-value" th:text="${investigatingCount}">0</div><div class="stat-label">Investigating</div></div>
        <div class="stat-box"><div class="stat-value" th:text="${closedCount}">0</div><div class="stat-label">Closed</div></div>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Case #</th>
                <th th:text="#{report.title2}">Title</th>
                <th th:text="#{general.priority}">Priority</th>
                <th th:text="#{report.status}">Status</th>
                <th th:text="#{admin.assigned}">Assigned</th>
                <th th:text="#{general.action}">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${cases.isEmpty()}"><td colspan="6" style="text-align:center;">No cases yet.</td></tr>
            <tr th:each="c : ${cases}" th:class="${c.statusClass}">
                <td th:text="${c.caseNumber}"></td>
                <td th:text="${c.title}"></td>
                <td th:text="${c.priority}"></td>
                <td th:text="${c.status}"></td>
                <td th:text="${c.assignedToName != null ? c.assignedToName : '—'}"></td>
                <td><a th:href="@{'/cases/' + ${c.id}}" th:text="#{general.view}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
