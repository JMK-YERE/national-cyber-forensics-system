<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Forensics TZ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#f5f9f7;color:#10241f}
body{display:grid;place-items:center;padding:24px}
.error-shell{width:min(680px,100%);text-align:center}
.brand{font-size:15px;font-weight:900;color:#06382c;margin-bottom:34px}.brand span{color:#10a56f}
.signal{width:58px;height:58px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:#e8faf3;color:#08785a;font-size:25px;border:1px solid #b9dccf}
.status{font-size:11px;font-weight:900;letter-spacing:.12em;color:#08785a;margin-bottom:9px}
h1{margin:0;color:#031f18;font-size:30px}.message{max-width:520px;margin:12px auto 0;color:#60766e;font-size:14px;line-height:1.7}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:800}
.primary{background:linear-gradient(135deg,#06382c,#10a56f);color:#fff}.secondary{border:1px solid #bfd6cc;color:#075a43;background:#fff}
.primary:hover{background:#08785a}.secondary:hover{background:#edf7f3}
@media(max-width:560px){body{padding:22px 16px}.brand{margin-bottom:30px}h1{font-size:25px}.message{font-size:13px}.actions{display:grid;grid-template-columns:1fr;width:min(340px,100%);margin-left:auto;margin-right:auto}}
html[data-theme="dark"] body{background:#061710;color:#e5f5ef}
html[data-theme="dark"] .brand,html[data-theme="dark"] h1{color:#e5f5ef!important}
html[data-theme="dark"] .signal{background:#0b261e;border-color:#285646;color:#7df0cf}
html[data-theme="dark"] .message{color:#a8c8bd}
html[data-theme="dark"] .secondary{background:#0b261e;color:#7df0cf;border-color:#285646}
</style>
</head>
<body>
<main class="error-shell">
<div class="brand">Cyber Forensics <span>TZ</span></div>
<div class="signal">!</div>
<div class="status">HTTP <span th:text="${status}">500</span></div>
<h1>Hitilafu imetokea</h1>
<p class="message">Samahani kwa usumbufu. Mfumo umepata tatizo wakati wa kufungua ukurasa huu. Jaribu tena au rudi kwenye ukurasa salama wa kuanzia.</p>
<div class="actions">
<a class="btn primary" th:href="@{/login}">Rudi Login</a>
<a class="btn secondary" th:href="@{/}">Mwanzo</a>
</div>
</main>
</body>
</html>
