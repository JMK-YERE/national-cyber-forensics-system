<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Error | Cyber Forensics TZ</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7f9;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#102033;display:grid;place-items:center;padding:24px}.error-shell{width:min(760px,94vw);background:#fff;border:1px solid #dce5eb;border-radius:16px;box-shadow:0 18px 55px rgba(4,28,48,.10);overflow:hidden}.error-head{padding:20px 26px;background:#123047;color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.badge{border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:16px;font-size:11px}.error-body{text-align:center;padding:44px 28px}.icon{font-size:54px}.status{display:inline-block;margin:14px 0 8px;padding:6px 11px;border-radius:16px;background:#fff3f3;color:#a61b2b;font-weight:800;font-size:12px}h1{margin:8px 0;color:#18364d;font-size:28px}.message{color:#607184;max-width:560px;margin:0 auto;line-height:1.6;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-block;text-decoration:none;padding:11px 18px;border-radius:9px;font-weight:750;font-size:12px}.primary{background:#155e8a;color:#fff}.secondary{border:1px solid #b8c8d8;color:#155e8a;background:#fff}@media(max-width:560px){.error-head{padding:17px 18px}.error-body{padding:34px 18px}.error-head .badge{display:none}}</style>
</head><body><main class="error-shell"><header class="error-head"><div class="brand">Cyber Forensics TZ</div><div class="badge">System Error</div></header><section class="error-body"><div class="icon">⚠</div><div class="status">HTTP <span th:text="${status}">500</span></div><h1>Hitilafu Imetokea</h1><p class="message">Samahani kwa usumbufu. Mfumo umepata hitilafu wakati wa kufungua ukurasa huu. Jaribu tena au rudi kwenye ukurasa wa kuingia.</p><div class="actions"><a class="btn primary" th:href="@{/login}">Rudi Login</a><a class="btn secondary" th:href="@{/}">Mwanzo</a></div></section></main></body></html>
