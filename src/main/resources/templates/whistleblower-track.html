<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Report</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ Whistleblower Portal</div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}">Home</a>
        <a th:href="@{/whistleblower/track}">Track Report</a>
    </div>
</div>

<div class="container" style="max-width: 600px; margin: 50px auto;">
    <div class="card" style="text-align: center; padding: 30px; background: linear-gradient(135deg, #0f2557, #1a3a70); color: white;">
        <div style="font-size: 50px;">🔍</div>
        <h1 style="color: white; margin: 15px 0;">Track Your Report</h1>
        <p style="color: rgba(255,255,255,0.9);">Ingiza tracking code yako kuona updates</p>
    </div>

    <div class="card" th:if="${error}" style="background: rgba(220,38,38,0.1); border-left: 4px solid #dc2626;">
        <p style="color: #dc2626; margin: 0;" th:text="${error}"></p>
    </div>

    <form th:action="@{/whistleblower/track}" method="post" class="card" style="margin-top: 20px;">
        <label style="display: block; font-weight: 600; margin-bottom: 10px;">Tracking Code</label>
        <input type="text" name="code" required placeholder="WB-XXXXXXXX"
               style="width: 100%; padding: 15px; font-size: 18px; font-family: monospace; text-align: center; letter-spacing: 3px; border: 2px solid #0f2557; border-radius: 8px; text-transform: uppercase;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 16px; margin-top: 15px;">
            🔍 TRACK REPORT
        </button>
    </form>
</div>
</body>
</html>
