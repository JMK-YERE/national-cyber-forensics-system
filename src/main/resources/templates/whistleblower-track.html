<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{whistleblower.trackTitle} + ' - ' + #{app.title}">Track Report</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        .lang-switcher { display: flex; gap: 8px; align-items: center; margin-left: 15px; padding-left: 15px; border-left: 1px solid rgba(255,255,255,0.3); }
        .lang-switcher a { color: white !important; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.1); }
        .lang-switcher a.active-lang { background: #c9a227; color: #0f2557 !important; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ <span th:text="#{app.title}">Cyber Forensics System</span></div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}" th:text="#{whistleblower.home}">Home</a>
        <a th:href="@{/whistleblower/report}" th:text="#{whistleblower.reportNow}">Report</a>
        <a th:href="@{/login}" th:text="#{whistleblower.login}">Login</a>
        <div class="lang-switcher">
            <a th:href="@{/lang?lang=sw}" th:classappend="${#locale.language == 'sw'} ? 'active-lang'">SW</a>
            <a th:href="@{/lang?lang=en}" th:classappend="${#locale.language == 'en'} ? 'active-lang'">EN</a>
            <a th:href="@{/lang?lang=fr}" th:classappend="${#locale.language == 'fr'} ? 'active-lang'">FR</a>
            <a th:href="@{/lang?lang=ar}" th:classappend="${#locale.language == 'ar'} ? 'active-lang'">AR</a>
        </div>
    </div>
</div>

<div class="container">
    <div class="card" style="max-width:600px; margin: 50px auto;">
        <h1 style="text-align:center;">🔍 <span th:text="#{whistleblower.trackTitle}">Track Report</span></h1>
        <p style="text-align:center;" th:text="#{whistleblower.trackDesc}">Follow up using your tracking code</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/whistleblower/track}" method="post" style="margin-top:30px;">
            <label th:text="#{whistleblower.trackingCode}">Tracking Code</label>
            <input type="text" name="code" required placeholder="WB-XXXXXXXX"
                   style="text-transform:uppercase; text-align:center; font-size:20px; letter-spacing:3px;">
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:15px; padding:15px;">
                🔍 <span th:text="#{whistleblower.trackBtn}">Track</span>
            </button>
        </form>
    </div>
</div>
</body>
</html>
