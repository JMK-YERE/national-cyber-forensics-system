<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>🔍 Track - Whistleblower</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo"> CYBER FORENSICS TZ</div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}">🕵️ Home</a>
        <a th:href="@{/whistleblower/report}">📝 Ripoti</a>
    </div>
</div>

<div class="container">
    <div class="card" style="max-width:600px; margin: 50px auto;">
        <h1 style="text-align:center;">🔍 Fuatilia Taarifa Yako</h1>
        <p style="text-align:center;">Weka tracking code yako kuona hali ya taarifa.</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/whistleblower/track}" method="post" style="margin-top:30px;">
            <label>TRACKING CODE</label>
            <input type="text" name="code" required placeholder="mfano: WB-ABCD1234"
                   style="text-transform:uppercase; text-align:center; font-size:20px; letter-spacing:3px;">
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:15px; padding:15px;">
                🔍 Angalia Status
            </button>
        </form>
    </div>
</div>
</body>
</html>
