<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📊 Audit Log - Cyber Forensics</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>


<main class="app-main"><div class="app-container">
    <div class="app-card">
        <h1>📊 Audit Log</h1>
        <p>Kila kitendo kwenye mfumo kinarekodiwa kwa uwazi na usalama.</p>
        <div style="margin-top:10px; padding:10px; background:#eff6ff; border-left:3px solid #244f7d; font-size:12px;">
            🔒 <strong>Restricted Access:</strong> Audit log inaonekana kwa <strong>Admin, Cyber Professionals, na Forensics Analysts</strong> pekee.
        </div>
    </div>

    <div class="app-card">
        <table>
            <thead>
            <tr>
                <th>Time</th>
                <th>User</th>
                <th>Action</th>
                <th>Entity</th>
                <th>Details</th>
                <th>IP</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${logs.isEmpty()}">
                <td colspan="6" style="text-align:center;">Hakuna kumbukumbu bado.</td>
            </tr>
            <tr th:each="log : ${logs}">
                <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${log.username != null ? log.username : 'system'}"></td>
                <td th:text="${log.action}"></td>
                <td th:text="${log.entityType}"></td>
                <td th:text="${log.details}"></td>
                <td th:text="${log.ipAddress}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</main></body>
</html>
