<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        .lang-switch {
            display: flex; justify-content: center; gap: 10px;
            margin-bottom: 20px; padding: 15px 0;
        }
        .lang-switch a {
            padding: 8px 18px; border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: white; text-decoration: none;
            font-weight: 600; font-size: 14px;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .lang-switch a:hover { background: rgba(255,255,255,0.2); }
        .lang-switch a.active-lang {
            background: #c9a227; color: #0f2557;
            border-color: #c9a227;
        }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="lang-switch">
        <a th:href="@{/login?lang=sw}" th:classappend="${#locale.language == 'sw'} ? 'active-lang'">🇹🇿 Kiswahili</a>
        <a th:href="@{/login?lang=en}" th:classappend="${#locale.language == 'en'} ? 'active-lang'">🇬🇧 English</a>
        <a th:href="@{/login?lang=fr}" th:classappend="${#locale.language == 'fr'} ? 'active-lang'">🇫🇷 Français</a>
        <a th:href="@{/login?lang=ar}" th:classappend="${#locale.language == 'ar'} ? 'active-lang'">🇸🇦 العربية</a>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">🔐</div>
            <h1 th:text="#{login.title}">Cyber Forensics System</h1>
            <p th:text="#{login.subtitle}">International Security Platform</p>
        </div>

        <div class="card" th:if="${param.error}" style="background: rgba(220,38,38,0.1); border-left: 4px solid #dc2626; padding: 15px;">
            <p style="color: #dc2626; margin: 0;" th:text="#{login.error}">Invalid username or password</p>
        </div>

        <div class="card" th:if="${param.logout}" style="background: rgba(27,122,74,0.1); border-left: 4px solid #1b7a4a; padding: 15px;">
            <p style="color: #1b7a4a; margin: 0;" th:text="#{login.loggedOut}">You have been logged out</p>
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label th:text="#{login.username}">Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label th:text="#{login.password}">Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                🔓 <span th:text="#{login.access}">Access System</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>
                <span th:text="#{login.noAccount}">Don't have an account?</span>
                <a th:href="@{/register}" th:text="#{login.register}">Register here</a>
            </p>
            <p style="margin-top: 15px;">
                <a th:href="@{/whistleblower}" style="color: #c9a227; font-weight: bold;">
                    🕵️ <span th:text="#{login.whistleblower}">Whistleblower Portal</span>
                </a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
