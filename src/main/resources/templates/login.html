<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login - Cyber Forensics System</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="auth-container">
    <h1 style="text-align:center;font-size:20px;">🔐 CYBER FORENSICS</h1>
    <p style="text-align:center;margin-bottom:25px;font-size:11px;">🇹🇿 TANZANIA NATIONAL SYSTEM</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${param.logout}" class="alert alert-success">Umetoka kwa mafanikio.</div>

    <form th:action="@{/login}" method="post">
        <label>USERNAME</label>
        <input type="text" name="username" required autofocus>

        <label>PASSWORD</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">
            🔓 ACCESS SYSTEM
        </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;">
        Huna akaunti? <a th:href="@{/register}">SAJILI HAPA</a>
    </p>
</div>
</body>
</html>
