<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login - Cyber Forensics System</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 8px 14px;
            background: white;
            border: 2px solid rgba(15, 37, 87, 0.2);
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--dark-blue);
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .lang-btn:hover {
            border-color: var(--dark-blue);
            background: rgba(15, 37, 87, 0.05);
        }
        .lang-btn.active {
            background: var(--dark-blue);
            color: white;
            border-color: var(--dark-blue);
        }
    </style>
</head>
<body>
<div class="auth-container">
    <!-- LANGUAGE SWITCHER -->
    <div class="lang-selector">
        <a th:href="@{/login?lang=sw}" class="lang-btn" 
           th:classappend="${#locale.language == 'sw'} ? 'active'">🇹🇿 Kiswahili</a>
        <a th:href="@{/login?lang=en}" class="lang-btn" 
           th:classappend="${#locale.language == 'en'} ? 'active'">🇬🇧 English</a>
        <a th:href="@{/login?lang=fr}" class="lang-btn" 
           th:classappend="${#locale.language == 'fr'} ? 'active'">🇫🇷 Français</a>
        <a th:href="@{/login?lang=ar}" class="lang-btn" 
           th:classappend="${#locale.language == 'ar'} ? 'active'">🇸🇦 العربية</a>
    </div>

    <h1 style="text-align:center;font-size:20px;">🔐 CYBER FORENSICS</h1>
    <p style="text-align:center;margin-bottom:25px;font-size:11px;">🌍 INTERNATIONAL SYSTEM</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${param.logout}" class="alert alert-success">Umetoka kwa mafanikio.</div>

    <form th:action="@{/login}" method="post">
        <label th:text="#{login.username}">Username</label>
        <input type="text" name="username" required autofocus>

        <label th:text="#{login.password}">Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px; padding:14px;">
            🔓 <span th:text="#{login.button}">Access System</span>
        </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;">
        <span th:text="#{login.noAccount}">Don't have an account?</span> 
        <a th:href="@{/register}" th:text="#{login.register}">Register here</a>
    </p>

    <p style="text-align:center;margin-top:10px;font-size:11px;">
        🕵️ <a th:href="@{/whistleblower}">Whistleblower Portal</a>
    </p>
</div>
</body>
</html>
