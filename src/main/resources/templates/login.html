<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Cyber Forensics TZ</title>
<style>
:root{--g:#07543e;--g2:#0aa879;--c:#08c7d8;--ink:#10251f;--muted:#667b74;--line:#d8e8e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#d9fff0,#f7fbfa 48%,#eaf8f5);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}.auth{width:min(430px,94vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 55px rgba(3,70,48,.16);overflow:hidden}.topbar{height:7px;background:linear-gradient(90deg,var(--g),var(--g2),var(--c))}.box{padding:26px 28px 24px}.brand{text-align:center;font-weight:900;color:var(--g);font-size:15px}.brand span{color:var(--c)}.shield{width:48px;height:48px;margin:0 auto 9px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:25px;box-shadow:0 8px 20px rgba(10,168,121,.2)}h1{text-align:center;font-size:24px;margin:17px 0 4px;color:var(--g)}.sub{text-align:center;color:var(--muted);font-size:11px;margin:0 0 17px}.alert{padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:12px}.err{background:#fff1f2;color:#b4232c;border:1px solid #ffd2d7}.ok{background:#effcf6;color:#08785a;border:1px solid #ccefe0}.google{height:42px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #dadce0;border-radius:9px;background:#fff;color:#202124;text-decoration:none;font-size:12px;font-weight:750}.google svg{width:18px;height:18px}.divider{display:flex;align-items:center;gap:9px;color:#98a8a2;font-size:10px;margin:13px 0}.divider:before,.divider:after{content:"";height:1px;background:#e6eee9;flex:1}.field{margin-bottom:11px}label{display:block;font-size:10px;font-weight:850;color:var(--g);margin-bottom:5px}input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:12px;outline:0}input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(10,168,121,.1)}.password-wrap{position:relative}.password-wrap input{padding-right:42px}.eye{position:absolute;right:8px;top:5px;width:30px;height:30px;border:0;background:transparent;cursor:pointer;color:#55736a}.forgot{display:block;text-align:right;color:#08785a;font-size:10px;font-weight:800;text-decoration:none;margin:2px 0 12px}.submit{width:100%;height:42px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:12px;font-weight:900;cursor:pointer}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:14px}.footer a{color:#08785a;font-weight:900;text-decoration:none}.whistle{text-align:center;margin-top:12px}.whistle a{color:#08785a;font-size:10px;font-weight:800;text-decoration:none}@media(max-width:420px){body{padding:10px}.box{padding:22px 18px 20px}h1{font-size:22px}}
</style></head><body><main class="auth"><div class="topbar"></div><section class="box"><div class="shield">🛡</div><div class="brand">Cyber Forensics <span>TZ</span></div><h1>Karibu Tena</h1><p class="sub">Ingia kwenye workspace yako salama</p>
<div class="alert err" th:if="${param.error}">Jina la mtumiaji au password si sahihi.</div><div class="alert ok" th:if="${param.logout}">Umetoka kwenye mfumo kwa mafanikio.</div><div class="alert ok" th:if="${param.registered}">Akaunti imeandaliwa. Kamilisha password yako kupitia email/OTP.</div>
<a class="google" th:href="@{/oauth2/authorization/google}"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.26z"/><path fill="#34A853" d="M12 21.68c2.63 0 4.84-.87 6.45-2.37l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.68z"/><path fill="#FBBC05" d="M6.54 13.76a5.86 5.86 0 0 1 0-3.52V7.71H3.3a9.75 9.75 0 0 0 0 8.58l3.24-2.53z"/><path fill="#EA4335" d="M12 6.2c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.3 14.63 2.32 12 2.32a9.74 9.74 0 0 0-8.7 5.39l3.24 2.53C7.31 7.92 9.46 6.2 12 6.2z"/></svg>Continue with Google</a>
<div class="divider">au</div><form th:action="@{/login}" method="post"><div class="field"><label>Jina la Mtumiaji</label><input name="username" autocomplete="username" required autofocus></div><div class="field"><label>Password</label><div class="password-wrap"><input id="loginPassword" type="password" name="password" autocomplete="current-password" required><button type="button" class="eye" onclick="togglePassword('loginPassword',this)">👁</button></div></div><a class="forgot" th:href="@{/forgot-password}">Umesahau password?</a><button class="submit" type="submit">🔐 Ingia</button></form>
<div class="footer">Huna akaunti? <a th:href="@{/register}">Unda akaunti</a></div><div class="whistle"><a th:href="@{/whistleblower}">🕵️ Ripoti kwa Siri</a></div></section></main><script>function togglePassword(id,b){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'}</script></body></html>
