<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0F4C3A, #1B7A4A);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .auth-container {
            background: white; border-radius: 24px;
            padding: 45px; max-width: 440px; width: 100%;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
        }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-logo { font-size: 60px; margin-bottom: 10px; }
        .auth-header h1 { color: #0F4C3A; font-size: 24px; margin: 0; font-weight: 800; }
        .auth-header p { color: #64748B; font-size: 13px; margin-top: 8px; }
        .social-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .social-btn {
            flex: 1; padding: 12px; border-radius: 10px;
            border: 2px solid #E2E8F0; background: white; cursor: pointer;
            font-weight: 600; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .social-btn:hover { border-color: #1B7A4A; background: #F0FDF4; }
        .divider {
            display: flex; align-items: center; gap: 15px;
            margin: 20px 0; color: #94A3B8; font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #E2E8F0;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-weight: 600; color: #0F4C3A;
            margin-bottom: 8px; font-size: 14px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #E2E8F0; border-radius: 10px;
            font-size: 14px; transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none; border-color: #1B7A4A;
            box-shadow: 0 0 0 4px rgba(27,122,74,0.1);
        }
        .forgot-link {
            display: block; text-align: right;
            color: #1B7A4A; font-size: 13px; margin-top: -8px;
            margin-bottom: 18px; text-decoration: none; font-weight: 600;
        }
        .forgot-link:hover { text-decoration: underline; }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #0F4C3A, #1B7A4A);
            color: white; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(15,76,58,0.4);
        }
        .auth-footer { text-align: center; margin-top: 25px; font-size: 13px; }
        .auth-footer a { color: #1B7A4A; text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .alert-error { background: rgba(220,38,38,0.1); border-left: 4px solid #DC2626; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; color: #DC2626; font-size: 13px; }
        .alert-success { background: rgba(16,185,129,0.1); border-left: 4px solid #10B981; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; color: #10B981; font-size: 13px; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-header">
        <div class="auth-logo">🔐</div>
        <h1 th:text="#{login.title}">Cyber Forensics System</h1>
        <p th:text="#{login.subtitle}">International Security Platform</p>
    </div>

    <div class="alert-error" th:if="${param.error}" th:text="#{login.error}">Invalid credentials</div>
    <div class="alert-success" th:if="${param.logout}" th:text="#{login.loggedOut}">Logged out</div>

    <!-- SOCIAL LOGIN -->
    <div class="social-buttons">
        <button type="button" class="social-btn" onclick="alert('Google login coming soon')">
            <span style="font-size: 18px;">🔍</span> <span th:text="#{social.google}">Google</span>
        </button>
        <button type="button" class="social-btn" onclick="alert('Apple login coming soon')">
            <span style="font-size: 18px;">🍎</span> <span th:text="#{social.apple}">Apple</span>
        </button>
    </div>

    <div class="divider" th:text="#{register.orContinue}">Or continue with</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label th:text="#{login.username}">Username</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label th:text="#{login.password}">Password</label>
            <input type="password" name="password" required>
        </div>

        <a th:href="@{/forgot-password}" class="forgot-link" th:text="#{password.forgot}">Forgot Password?</a>

        <button type="submit" class="btn-login">🔓 <span th:text="#{login.access}">Access System</span></button>
    </form>

    <div class="auth-footer">
        <p>
            <span th:text="#{login.noAccount}">Don't have an account?</span>
            <a th:href="@{/register}" th:text="#{login.register}">Register here</a>
        </p>
        <p style="margin-top: 12px;">
            <a th:href="@{/whistleblower}" style="color: #C9A227;">🕵️ <span th:text="#{login.whistleblower}">Whistleblower</span></a>
        </p>
    </div>
</div>
</body>
</html>
