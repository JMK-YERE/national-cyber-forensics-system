<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify OTP | Cyber Forensics TZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#202124;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;min-height:100svh}main{width:min(360px,100%);text-align:center}
.brand{font-size:16px;font-weight:700;color:#202124;margin-bottom:16px}.brand span{color:#1a73e8}.shield{font-size:24px;margin-bottom:7px}
h1{font-size:20px;font-weight:500;margin:0 0 6px}.sub{font-size:12px;color:#5f6368;line-height:1.45;margin:0 auto 16px;max-width:350px}
.alert{font-size:13px;line-height:1.55;margin:0 auto 14px}.err{color:#b3261e}.ok{color:#137333}
.field{text-align:left;margin-bottom:9px}label{display:block;font-size:13px;font-weight:600;color:#3c4043;margin-bottom:7px}
input{width:100%;height:42px;border:1px solid #dadce0;border-radius:4px;padding:0 13px;font-size:15px;outline:none;background:#fff}
input:focus{border:2px solid #1a73e8}.otp{text-align:center;font-size:25px;letter-spacing:9px;font-weight:600}
button{width:100%;height:42px;border:0;border-radius:23px;background:#1a73e8;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#185abc}.timer{font-size:13px;color:#5f6368;margin:9px 0}.timer strong{color:#b3261e}
.back{display:inline-block;margin-top:16px;color:#1a73e8;font-size:14px;font-weight:600;text-decoration:none}.note{font-size:12px;color:#5f6368;line-height:1.55;margin-top:18px}
@media(max-width:480px){body{padding:28px 18px}.brand{margin-bottom:20px}.shield{font-size:25px;margin-bottom:8px}h1{font-size:21px}.sub{font-size:12px;margin-bottom:18px}.otp{letter-spacing:5px}.note{margin-top:20px}}
</style>

<style>
/* CFTZ final recovery/OTP design */
html,body{background:#f5f9f7!important;color:#10241f!important;font-family:Inter,"Segoe UI",system-ui,sans-serif!important}
body{padding:28px 18px!important;align-items:flex-start!important}main{width:min(430px,100%)!important;text-align:center!important}.brand{color:#06382c!important;font-size:17px!important;font-weight:900!important}.brand span{color:#10a56f!important}.shield{font-size:25px!important}
h1{color:#031f18!important;font-weight:800!important}.sub{color:#60766e!important}.field label{color:#075a43!important}input{border-color:#bfd6cc!important;border-radius:8px!important;background:#fff!important;color:#10241f!important}input:focus{border-color:#10a56f!important;box-shadow:0 0 0 3px rgba(16,165,111,.10)!important}button{background:linear-gradient(135deg,#06382c,#10a56f)!important;border-radius:8px!important;height:44px!important}button:hover{background:#08785a!important}.timer{color:#60766e!important}.timer strong{color:#b4232c!important}.back{color:#08785a!important}.note{color:#60766e!important}
html[data-theme="dark"] body{background:#061710!important;color:#e5f5ef!important}html[data-theme="dark"] .brand,html[data-theme="dark"] h1{color:#e5f5ef!important}html[data-theme="dark"] .sub,html[data-theme="dark"] .note,html[data-theme="dark"] .timer{color:#a8c8bd!important}html[data-theme="dark"] input{background:#0b261e!important;color:#e5f5ef!important;border-color:#285646!important}html[data-theme="dark"] .back{color:#7df0cf!important}
</style></head>
<body><main>
<div class="shield">🔐</div><div class="brand">Cyber Forensics <span>TZ</span></div>
<h1>Thibitisha OTP</h1>
<p class="sub">Ingiza OTP ya tarakimu 6 iliyotumwa kwenye email yako. OTP ita-expire ndani ya sekunde 60.</p>
<div class="alert err" th:if="${error}" th:text="${error}"></div>
<div class="alert ok" th:if="${param.sent}">Password imebadilishwa kwa mafanikio. Unaelekezwa Dashboard...</div>
<form th:action="@{/reset-password}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label for="otp">OTP ya uthibitisho</label><input id="otp" class="otp" name="token" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus placeholder="••••••"></div>
<div class="field"><label for="password">Password mpya</label><input id="password" type="password" name="password" minlength="6" required autocomplete="new-password" placeholder="Angalau herufi 6"></div>
<div class="field"><label for="confirmPassword">Thibitisha password mpya</label><input id="confirmPassword" type="password" name="confirmPassword" minlength="6" required autocomplete="new-password"></div>
<div class="timer">OTP expires in <strong id="countdown">60</strong> seconds</div>
<button id="submitBtn" type="submit">Badilisha Password</button>
</form>
<script>document.querySelector("form").addEventListener("submit",function(){const p=document.getElementById("password"),q=document.getElementById("confirmPassword");if(p.value!==q.value){q.setCustomValidity("Passwords do not match.");}else{q.setCustomValidity("");}});</script>
<a class="back" th:href="@{/forgot-password}">← Omba OTP mpya</a>
<div class="note">Usimpe mtu mwingine OTP yako.</div>
</main>
<script>
(function(){const start=Date.now(), end=start+60000, t=document.getElementById('countdown'), b=document.getElementById('submitBtn');
function tick(){const left=Math.max(0,Math.ceil((end-Date.now())/1000));t.textContent=left;if(left<=0){b.disabled=true;b.style.opacity='.55';}}tick();setInterval(tick,250);})();
</script>
<script th:if="${param.sent}">setTimeout(function(){window.location.replace("/dashboard");},350);</script>
</body></html>
