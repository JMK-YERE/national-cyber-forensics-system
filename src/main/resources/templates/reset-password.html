<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify OTP | Cyber Forensics TZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#202124;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;padding:34px 20px;min-height:100svh}main{width:min(400px,100%);text-align:center}
.brand{font-size:18px;font-weight:700;color:#202124;margin-bottom:24px}.brand span{color:#1a73e8}.shield{font-size:28px;margin-bottom:10px}
h1{font-size:22px;font-weight:500;margin:0 0 8px}.sub{font-size:13px;color:#5f6368;line-height:1.55;margin:0 auto 26px;max-width:390px}
.alert{font-size:13px;line-height:1.55;margin:0 auto 20px}.err{color:#b3261e}.ok{color:#137333}
.field{text-align:left;margin-bottom:12px}label{display:block;font-size:13px;font-weight:600;color:#3c4043;margin-bottom:7px}
input{width:100%;height:46px;border:1px solid #dadce0;border-radius:4px;padding:0 13px;font-size:15px;outline:none;background:#fff}
input:focus{border:2px solid #1a73e8}.otp{text-align:center;font-size:25px;letter-spacing:9px;font-weight:600}
button{width:100%;height:44px;border:0;border-radius:23px;background:#1a73e8;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#185abc}.timer{font-size:13px;color:#5f6368;margin:13px 0}.timer strong{color:#b3261e}
.back{display:inline-block;margin-top:22px;color:#1a73e8;font-size:14px;font-weight:600;text-decoration:none}.note{font-size:12px;color:#5f6368;line-height:1.55;margin-top:28px}
@media(max-width:480px){body{padding:28px 18px}.brand{margin-bottom:20px}.shield{font-size:25px;margin-bottom:8px}h1{font-size:21px}.sub{font-size:12px;margin-bottom:18px}.otp{letter-spacing:5px}.note{margin-top:20px}}
</style>
</head>
<body><main>
<div class="shield">🔐</div><div class="brand">Cyber Forensics <span>TZ</span></div>
<h1>Thibitisha OTP</h1>
<p class="sub">Ingiza OTP ya tarakimu 6 iliyotumwa kwenye email yako. OTP ita-expire ndani ya sekunde 60.</p>
<div class="alert err" th:if="${error}" th:text="${error}"></div>
<div class="alert ok" th:if="${param.sent}">Password imebadilishwa kwa mafanikio. Unaelekezwa Dashboard...</div>
<form th:action="@{/reset-password}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label for="otp">OTP ya uthibitisho</label><input id="otp" class="otp" name="token" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus placeholder="••••••"></div>
<div class="field"><label for="password">Password mpya</label><input id="password" type="password" name="password" minlength="6" required autocomplete="new-password" placeholder="Angalau herufi 6"></div>
<div class="field"><label for="confirmPassword">Thibitisha password mpya</label><input id="confirmPassword" type="password" name="confirmPassword" minlength="6" required autocomplete="new-password"></div>
<div class="timer">OTP expires in <strong id="countdown">60</strong> seconds</div>
<button id="submitBtn" type="submit">Badilisha Password</button>
</form>
<script>document.querySelector("form").addEventListener("submit",function(){const p=document.getElementById("password"),q=document.getElementById("confirmPassword");if(p.value!==q.value){q.setCustomValidity("Passwords do not match.");}else{q.setCustomValidity("");}});</script>
<a class="back" th:href="@{/forgot-password}">← Omba OTP mpya</a>
<div class="note">Usimpe mtu mwingine OTP yako.</div>
</main>
<script>
(function(){const start=Date.now(), end=start+60000, t=document.getElementById('countdown'), b=document.getElementById('submitBtn');
function tick(){const left=Math.max(0,Math.ceil((end-Date.now())/1000));t.textContent=left;if(left<=0){b.disabled=true;b.style.opacity='.55';}}tick();setInterval(tick,250);})();
</script>
<script th:if="${param.sent}">setTimeout(function(){window.location.replace("/dashboard");},1200);</script>
</body></html>
