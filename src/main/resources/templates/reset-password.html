<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Cyber Forensics TZ</title><style>:root{--g:#07543e;--g2:#0aa879;--c:#08c7d8;--ink:#10251f;--muted:#667b74;--line:#d8e8e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#d9fff0,#f7fbfa 48%,#eaf8f5);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}.card{width:min(430px,95vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 55px rgba(3,70,48,.16);overflow:hidden}.bar{height:7px;background:linear-gradient(90deg,var(--g),var(--g2),var(--c))}.inner{padding:26px 28px 24px}.icon{width:48px;height:48px;margin:0 auto 10px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:24px}.brand{text-align:center;color:var(--g);font-weight:900;font-size:15px}.brand span{color:var(--c)}h1{text-align:center;color:var(--g);font-size:23px;margin:16px 0 5px}.sub{text-align:center;color:var(--muted);font-size:11px;margin:0 0 17px}.alert{padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:12px}.ok{background:#effcf6;color:#08785a;border:1px solid #ccefe0}.err{background:#fff1f2;color:#b4232c;border:1px solid #ffd2d7}.field{margin-bottom:12px}label{display:block;font-size:10px;font-weight:850;color:var(--g);margin-bottom:5px}input{width:100%;height:41px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:12px;outline:0}input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(10,168,121,.1)}.pw{position:relative}.pw input{padding-right:43px}.eye{position:absolute;right:8px;top:5px;width:30px;height:30px;border:0;background:transparent;cursor:pointer}.submit{width:100%;height:42px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:12px;font-weight:900;cursor:pointer}.back{display:block;text-align:center;margin-top:13px;color:#08785a;font-size:10px;font-weight:850;text-decoration:none}@media(max-width:430px){body{padding:10px}.inner{padding:22px 18px}} </style></head><body><main class="card"><div class="bar"></div><section class="inner"><div class="icon">🔑</div><div class="brand">Cyber Forensics <span>TZ</span></div><h1>Reset Password</h1><p class="sub">Weka password mpya ya akaunti yako.</p><div class="alert err" th:if="${error}" th:text="${error}"></div><div class="alert ok" th:if="${param.sent}">Maelekezo yametumwa.</div><form th:action="@{/reset-password}" method="post"><div class="field" th:if="${smsMode}"><label>SMS OTP</label><input name="token" inputmode="numeric" maxlength="6" required placeholder="Ingiza code ya SMS"></div><input th:unless="${smsMode}" type="hidden" name="token" th:value="${token}"><div class="field"><label>Password mpya</label><div class="pw"><input id="r1" type="password" name="password" minlength="6" required><button type="button" class="eye" onclick="showPw('r1',this)">👁</button></div></div><div class="field"><label>Thibitisha password</label><div class="pw"><input id="r2" type="password" name="confirmPassword" minlength="6" required><button type="button" class="eye" onclick="showPw('r2',this)">👁</button></div></div><button class="submit" type="submit">✓ Badilisha Password</button></form><a class="back" th:href="@{/login}">← Rudi Login</a></section></main><script>function showPw(id,b){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'}</script></body></html>
