<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Communication | Cyber Forensics TZ</title><link rel="stylesheet" th:href="@{/css/theme.css}">
<style>.comm-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:16px}.comm-head h1{margin:0;font-size:24px;color:#0f172a}.comm-head p{margin:4px 0 0;color:#64748b;font-size:12px}.msg{padding:12px 0;border-bottom:1px solid #e2e8f0}.msg-meta{font-size:11px;color:#64748b}.msg-body{margin-top:6px;color:#1e293b;white-space:pre-wrap}.tlp{display:inline-block;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:900;margin-left:6px}.tlp-CLEAR{background:#f1f5f9;color:#475569}.tlp-GREEN{background:#ecfdf5;color:#047857}.tlp-AMBER{background:#fffbeb;color:#b45309}.tlp-RED{background:#fef2f2;color:#b91c1c}.compose{display:grid;gap:9px}.compose textarea{min-height:110px;resize:vertical}.compose-row{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.compose-row>div{min-width:180px}</style></head>
<body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main"><div class="app-container">
<header class="comm-head"><div><h1>Case Communication</h1><p><strong th:text="${caseFile.caseNumber}">CASE</strong> · secure operational discussion and escalation.</p></div><a th:href="@{'/cases/' + ${caseFile.id}}" class="app-btn app-btn-outline">← Case</a></header>
<div class="app-card"><div th:if="${communications == null or communications.isEmpty()}" style="color:#64748b">No messages yet.</div>
<div class="msg" th:each="m : ${communications}"><div class="msg-meta"><strong th:text="${m.authorName}">User</strong> · <span th:text="${m.authorRole}">ROLE</span> · <span th:text="${#temporals.format(m.createdAt,'yyyy-MM-dd HH:mm')}">time</span><span class="tlp" th:classappend="${'tlp-' + m.tlp}" th:text="${'TLP:' + m.tlp}">TLP:CLEAR</span></div><div class="msg-body" th:text="${m.message}">Message</div></div></div>
<div class="app-card"><h3>Send case message</h3><form class="compose" th:action="@{'/case-communications/' + ${caseFile.id} + '/send'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea name="message" maxlength="10000" required placeholder="Operational update, finding, request or decision..."></textarea><div class="compose-row"><div><label>TLP</label><select name="tlp"><option>CLEAR</option><option>GREEN</option><option>AMBER</option><option>RED</option></select></div><button class="app-btn app-btn-primary" type="submit">Send Message</button></div></form></div>
<div class="app-card"><h3>Escalation</h3><p style="color:#64748b">Operational path: Analyst → Forensics → Cyber Pro → Admin.</p><form th:action="@{'/case-communications/' + ${caseFile.id} + '/escalate'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="app-btn app-btn-outline" type="submit">Escalate Case</button></form></div>
</div></main><script th:src="@{/js/app.js}"></script></body></html>
