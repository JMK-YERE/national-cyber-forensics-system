<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Cyber Forensics TZ</title>
<style>
:root{--g:#07543e;--g2:#0aa879;--c:#08c7d8;--ink:#10251f;--muted:#667b74;--line:#d8e8e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#d9fff0,#f7fbfa 48%,#eaf8f5);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}.auth{width:min(470px,95vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 55px rgba(3,70,48,.16);overflow:hidden}.topbar{height:7px;background:linear-gradient(90deg,var(--g),var(--g2),var(--c))}.box{padding:25px 28px 23px}.shield{width:44px;height:44px;margin:0 auto 8px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:23px}.brand{text-align:center;font-weight:900;color:var(--g);font-size:15px}.brand span{color:var(--c)}h1{text-align:center;color:var(--g);font-size:23px;margin:15px 0 4px}.sub{text-align:center;color:var(--muted);font-size:11px;margin:0 0 16px}.alert{padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:11px}.err{background:#fff1f2;color:#b4232c;border:1px solid #ffd2d7}.google{height:40px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #dadce0;border-radius:9px;background:#fff;color:#202124;text-decoration:none;font-size:11px;font-weight:750}.google svg{width:18px;height:18px}.divider{display:flex;align-items:center;gap:9px;color:#98a8a2;font-size:10px;margin:12px 0}.divider:before,.divider:after{content:"";height:1px;background:#e6eee9;flex:1}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}label{display:block;font-size:10px;font-weight:850;color:var(--g);margin-bottom:4px}input,select{width:100%;height:39px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:11px;outline:0;background:#fff}input:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(10,168,121,.1)}.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}.method{border:1px solid var(--line);border-radius:9px;padding:9px;font-size:10px;display:flex;gap:7px;align-items:center;cursor:pointer}.method input{width:auto;height:auto}.hint{background:#f1fbf7;border:1px solid #d5efe4;border-radius:9px;padding:9px 10px;color:#38675a;font-size:10px;margin:2px 0 12px}.submit{width:100%;height:42px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:12px;font-weight:900;cursor:pointer}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:13px}.footer a{color:#08785a;font-weight:900;text-decoration:none}@media(max-width:520px){body{padding:10px}.box{padding:21px 17px}.row,.methods{grid-template-columns:1fr}h1{font-size:21px}}
</style></head><body><main class="auth"><div class="topbar"></div><section class="box"><div class="shield">🛡</div><div class="brand">Cyber Forensics <span>TZ</span></div><h1>Unda Akaunti</h1><p class="sub">Jaza taarifa za msingi — password utaitengeneza baada ya uthibitisho.</p>
<div class="alert err" th:if="${error}" th:text="${error}"></div>
<a class="google" th:href="@{/oauth2/authorization/google}"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.26z"/><path fill="#34A853" d="M12 21.68c2.63 0 4.84-.87 6.45-2.37l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.68z"/><path fill="#FBBC05" d="M6.54 13.76a5.86 5.86 0 0 1 0-3.52V7.71H3.3a9.75 9.75 0 0 0 0 8.58l3.24-2.53z"/><path fill="#EA4335" d="M12 6.2c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.3 14.63 2.32 12 2.32a9.74 9.74 0 0 0-8.7 5.39l3.24 2.53C7.31 7.92 9.46 6.2 12 6.2z"/></svg>Continue with Google</a>
<div class="divider">au</div><form th:action="@{/register}" method="post"><div class="row"><div class="field"><label>Jina la Mtumiaji</label><input name="username" required></div><div class="field"><label>Barua Pepe</label><input type="email" name="email" required></div></div><div class="row"><div class="field"><label>Jina Kamili</label><input name="fullName"></div><div class="field"><label>Namba ya Simu</label><input name="phone" placeholder="+255..." required></div></div>
<div class="field"><label>Utapokea link/code wapi?</label><div class="methods"><label class="method"><input type="radio" name="verificationChannel" value="EMAIL" checked> 📧 Email link</label><label class="method"><input type="radio" name="verificationChannel" value="SMS"> 📱 SMS OTP</label></div></div>
<div class="hint">Baada ya kutuma, mfumo utakutumia njia uliyochagua ya kutengeneza password. Hakuna password inayowekwa hapa.</div>
<button class="submit" type="submit">✓ Tuma Taarifa</button></form><div class="footer">Una akaunti? <a th:href="@{/login}">Ingia</a></div></section></main></body></html>
