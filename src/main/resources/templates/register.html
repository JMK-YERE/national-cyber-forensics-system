<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Register - Cyber Forensics System</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="auth-container">
    <h1 style="text-align:center;font-size:18px;">📝 REGISTER</h1>
    <p style="text-align:center;margin-bottom:25px;font-size:11px;">CYBER FORENSICS - TANZANIA</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <label>USERNAME</label>
        <input type="text" name="username" required>

        <label>EMAIL</label>
        <input type="email" name="email" required>

        <label>FULL NAME</label>
        <input type="text" name="fullName" required>

        <label>ORGANIZATION</label>
        <input type="text" name="organization" placeholder="mfano: TCRA, Police, Bank">

        <label>PASSWORD</label>
        <input type="password" name="password" required minlength="6">

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">
            ✍️ SAJILI
        </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;">
        Una akaunti? <a th:href="@{/login}">INGIA HAPA</a>
    </p>
</div>
</body>
</html>
