<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title} + ' - ' + #{app.title}">Register</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="auth-container">
    <div style="display:flex; justify-content:center; gap:8px; margin-bottom:25px; flex-wrap:wrap;">
        <a th:href="@{/lang?lang=sw}" style="padding:6px 12px; background:white; border:2px solid rgba(15,37,87,0.2); border-radius:20px; color:var(--dark-blue); font-size:11px; font-weight:600; text-decoration:none;">SW</a>
        <a th:href="@{/lang?lang=en}" style="padding:6px 12px; background:white; border:2px solid rgba(15,37,87,0.2); border-radius:20px; color:var(--dark-blue); font-size:11px; font-weight:600; text-decoration:none;">EN</a>
        <a th:href="@{/lang?lang=fr}" style="padding:6px 12px; background:white; border:2px solid rgba(15,37,87,0.2); border-radius:20px; color:var(--dark-blue); font-size:11px; font-weight:600; text-decoration:none;">FR</a>
        <a th:href="@{/lang?lang=ar}" style="padding:6px 12px; background:white; border:2px solid rgba(15,37,87,0.2); border-radius:20px; color:var(--dark-blue); font-size:11px; font-weight:600; text-decoration:none;">AR</a>
    </div>

    <h1 style="text-align:center;font-size:20px;">📝 <span th:text="#{register.title}">Register</span></h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <label th:text="#{register.username}">Username</label>
        <input type="text" name="username" required>

        <label th:text="#{register.email}">Email</label>
        <input type="email" name="email" required>

        <label th:text="#{register.fullName}">Full Name</label>
        <input type="text" name="fullName" required>

        <label th:text="#{register.organization}">Organization</label>
        <input type="text" name="organization">

        <label th:text="#{register.phone}">Phone</label>
        <input type="text" name="phone">

        <label th:text="#{register.password}">Password</label>
        <input type="password" name="password" required minlength="6">

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">
            <span th:text="#{register.button}">Register</span>
        </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;">
        <span th:text="#{register.haveAccount}">Have account?</span>
        <a th:href="@{/login}" th:text="#{register.login}">Login</a>
    </p>
</div>
</body>
</html>
