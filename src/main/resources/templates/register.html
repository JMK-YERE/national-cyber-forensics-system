<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title}">Register</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            background: #F8FAFC;
        }
        .register-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            width: 100%;
        }
        .reg-image {
            background: linear-gradient(135deg, rgba(15,76,58,0.92), rgba(27,122,74,0.75)),
                        url('https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=1200') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            color: white;
        }
        .reg-image .brand {
            display: flex; align-items: center; gap: 15px;
            font-size: 22px; font-weight: 700;
        }
        .reg-image h2 {
            font-size: 40px; font-weight: 800; line-height: 1.2;
            margin-bottom: 20px;
        }
        .reg-image p {
            font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.92);
        }
        .reg-form-side {
            display: flex; align-items: center; justify-content: center;
            padding: 40px 30px; background: white; overflow-y: auto;
        }
        .reg-form-wrap { width: 100%; max-width: 460px; }
        .back-home {
            display: inline-flex; align-items: center; gap: 8px;
            color: #0F4C3A; text-decoration: none;
            font-size: 13px; font-weight: 600;
            margin-bottom: 20px; padding: 8px 15px;
            background: #F0FDF4; border-radius: 20px;
        }
        .back-home:hover { background: #DCFCE7; }
        .form-header { margin-bottom: 22px; }
        .form-header h1 { font-size: 26px; color: #0F4C3A; font-weight: 800; margin-bottom: 6px; }
        .form-header p { color: #64748B; font-size: 13px; }
        .social-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .social-btn {
            flex: 1; padding: 11px; border-radius: 12px;
            border: 2px solid #E2E8F0; background: white;
            cursor: pointer; font-weight: 600; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: all 0.2s; text-decoration: none;
            color: #1E293B;
        }
        .social-btn:hover { border-color: #1B7A4A; background: #F0FDF4; }
        .social-btn.apple { background: #000; color: white; border-color: #000; }
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 15px 0; color: #94A3B8; font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #E2E8F0;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block; font-weight: 600; color: #0F4C3A;
            margin-bottom: 5px; font-size: 12px;
        }
        .form-group input {
            width: 100%; padding: 11px 14px;
            border: 2px solid #E2E8F0; border-radius: 10px;
            font-size: 13px; transition: all 0.2s; font-family: inherit;
        }
        .form-group input:focus {
            outline: none; border-color: #1B7A4A;
            box-shadow: 0 0 0 3px rgba(27,122,74,0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .terms { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 12px 0; }
        .terms input { width: auto; }
        .btn-register {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #0F4C3A, #1B7A4A);
            color: white; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; letter-spacing: 0.3px;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(15,76,58,0.35);
        }
        .form-footer { text-align: center; margin-top: 18px; font-size: 13px; }
        .form-footer a { color: #1B7A4A; text-decoration: none; font-weight: 700; }
        @media (max-width: 900px) {
            .register-container { grid-template-columns: 1fr; }
            .reg-image { padding: 30px 25px; min-height: 220px; }
            .reg-image h2 { font-size: 26px; }
            .reg-form-side { padding: 25px 20px; }
        }
        @media (max-width: 480px) {
            .reg-image { padding: 20px; min-height: 160px; }
            .reg-image h2 { font-size: 20px; }
            .reg-image p { display: none; }
            .form-row { grid-template-columns: 1fr; }
            .social-buttons { flex-direction: column; }
            .reg-form-side { padding: 20px 15px; }
        }
    </style>
</head>
<body>
<div class="register-container">
    <!-- LEFT IMAGE -->
    <div class="reg-image">
        <div class="brand">
            <span style="font-size: 36px;">🛡️</span>
            <span>Cyber Forensics Tanzania</span>
        </div>
        <div>
            <h2>Jiunge Nasi Leo</h2>
            <p>Unda akaunti bure na uanze kulinda taarifa zako mtandaoni. Pata msaada wa AI, ripoti matukio, na zaidi.</p>
        </div>
        <div style="font-size: 13px; color: rgba(255,255,255,0.7);">
            © 2026 Cyber Forensics Tanzania
        </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="reg-form-side">
        <div class="reg-form-wrap">
            <a th:href="@{/}" class="back-home">← Rudi Nyumbani</a>

            <div class="form-header">
                <h1 th:text="#{register.title}">Unda Akaunti</h1>
                <p th:text="#{register.subtitle}">Jiunge na Mfumo wa Uchunguzi wa Mtandao</p>
            </div>

            <!-- SOCIAL -->
            <div class="social-buttons">
                <a th:href="@{/oauth2/authorization/google}" class="social-btn">
                    <svg width="16" height="16" viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                    </svg>
                    <span>Google</span>
                </a>
                <a href="javascript:void(0)" onclick="alert('Apple Sign In - Coming soon!')" class="social-btn apple">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="white">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    <span>Apple</span>
                </a>
            </div>

            <div class="divider" th:text="#{register.orContinue}">au</div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label th:text="#{register.username}">Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label th:text="#{register.email}">Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{register.fullName}">Jina Kamili</label>
                        <input type="text" name="fullName">
                    </div>
                    <div class="form-group">
                        <label th:text="#{register.phone}">Simu</label>
                        <input type="tel" name="phone">
                    </div>
                </div>
                <div class="form-group">
                    <label th:text="#{register.organization}">Taasisi</label>
                    <input type="text" name="organization">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{register.password}">Neno la Siri</label>
                        <input type="password" name="password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label th:text="#{register.confirmPassword}">Thibitisha</label>
                        <input type="password" name="confirmPassword" required minlength="6">
                    </div>
                </div>
                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" th:text="#{register.agreeTerms}">Nakubali Masharti</label>
                </div>
                <button type="submit" class="btn-register" th:text="#{register.button}">UNDA AKAUNTI</button>
            </form>

            <div class="form-footer">
                <span th:text="#{register.haveAccount}">Una akaunti?</span>
                <a th:href="@{/login}" th:text="#{register.login}">Ingia</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
