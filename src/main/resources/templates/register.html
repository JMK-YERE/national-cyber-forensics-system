<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title}">Register</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0F4C3A 0%, #1B7A4A 50%, #34D399 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .register-container {
            background: white;
            border-radius: 24px;
            padding: 45px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
        }
        .reg-header { text-align: center; margin-bottom: 30px; }
        .reg-logo { font-size: 60px; margin-bottom: 10px; }
        .reg-header h1 { color: #0F4C3A; font-size: 26px; margin: 0; font-weight: 800; }
        .reg-header p { color: #64748B; font-size: 13px; margin-top: 8px; }
        .social-buttons {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .social-btn {
            flex: 1; padding: 12px; border-radius: 10px;
            border: 2px solid #E2E8F0; background: white;
            cursor: pointer; font-weight: 600; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: all 0.2s;
        }
        .social-btn:hover { border-color: #1B7A4A; background: #F0FDF4; }
        .divider {
            display: flex; align-items: center; gap: 15px;
            margin: 20px 0; color: #94A3B8; font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #E2E8F0;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; font-weight: 600; color: #0F4C3A;
            margin-bottom: 6px; font-size: 13px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #E2E8F0; border-radius: 10px;
            font-size: 14px; transition: all 0.2s;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none; border-color: #1B7A4A;
            box-shadow: 0 0 0 4px rgba(27,122,74,0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-register {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #0F4C3A, #1B7A4A);
            color: white; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(15,76,58,0.4);
        }
        .reg-footer { text-align: center; margin-top: 25px; font-size: 13px; }
        .reg-footer a { color: #1B7A4A; text-decoration: none; font-weight: 600; }
        .reg-footer a:hover { text-decoration: underline; }
        .terms { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 15px 0; }
        .terms input { width: auto; }
        @media (max-width: 480px) {
            .register-container { padding: 30px 20px; }
            .form-row { grid-template-columns: 1fr; }
            .social-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="reg-header">
        <div class="reg-logo">🛡️</div>
        <h1 th:text="#{register.title}">Create Account</h1>
        <p th:text="#{register.subtitle}">Join Cyber Forensics System</p>
    </div>

    <!-- SOCIAL LOGIN -->
    <div class="social-buttons">
        <button type="button" class="social-btn" onclick="alert('Google login coming soon')">
            <span style="font-size: 18px;">🔍</span> <span th:text="#{social.google}">Google</span>
        </button>
        <button type="button" class="social-btn" onclick="alert('Apple login coming soon')">
            <span style="font-size: 18px;">🍎</span> <span th:text="#{social.apple}">Apple</span>
        </button>
    </div>

    <div class="divider" th:text="#{register.orContinue}">Or continue with</div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label th:text="#{register.username}">Username</label>
            <input type="text" name="username" required autofocus>
        </div>

        <div class="form-group">
            <label th:text="#{register.email}">Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label th:text="#{register.fullName}">Full Name</label>
                <input type="text" name="fullName">
            </div>
            <div class="form-group">
                <label th:text="#{register.phone}">Phone</label>
                <input type="tel" name="phone">
            </div>
        </div>

        <div class="form-group">
            <label th:text="#{register.organization}">Organization</label>
            <input type="text" name="organization">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label th:text="#{register.password}">Password</label>
                <input type="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label th:text="#{register.confirmPassword}">Confirm</label>
                <input type="password" name="confirmPassword" required minlength="6">
            </div>
        </div>

        <div class="terms">
            <input type="checkbox" id="terms" required>
            <label for="terms" th:text="#{register.agreeTerms}">I agree to Terms</label>
        </div>

        <button type="submit" class="btn-register">
            ✨ <span th:text="#{register.button}">CREATE ACCOUNT</span>
        </button>
    </form>

    <div class="reg-footer">
        <p>
            <span th:text="#{register.haveAccount}">Already have an account?</span>
            <a th:href="@{/login}" th:text="#{register.login}">Login here</a>
        </p>
    </div>
</div>
</body>
</html>
