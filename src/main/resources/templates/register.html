<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Cyber Forensics</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; background: #F0FDF4; }
        .reg-wrap { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; width: 100%; }
        .reg-img { background: linear-gradient(135deg, rgba(10,22,40,0.9), rgba(15,39,68,0.7)), url('https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=1200') center/cover; display: flex; flex-direction: column; justify-content: space-between; padding: 35px; color: white; }
        .reg-img .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
        .reg-img h2 { font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 15px; }
        .reg-img p { font-size: 14px; color: rgba(255,255,255,0.9); }
        .reg-form-side { display: flex; align-items: center; justify-content: center; padding: 30px 25px; background: white; overflow-y: auto; }
        .reg-box { width: 100%; max-width: 400px; }
        .back-home { display: inline-flex; align-items: center; gap: 6px; color: #0A1628; text-decoration: none; font-size: 12px; font-weight: 600; margin-bottom: 18px; padding: 7px 14px; background: #F0FDF4; border-radius: 18px; }
        h1.form-title { font-size: 22px; color: #0A1628; margin-bottom: 5px; font-weight: 800; }
        p.form-sub { color: #64748B; font-size: 13px; margin-bottom: 18px; }
        .social-buttons { display: flex; gap: 9px; margin-bottom: 12px; }
        .social-btn { flex: 1; padding: 10px; border-radius: 9px; border: 2px solid #E2E8F0; background: white; cursor: pointer; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #1E293B; }
        .social-btn:hover { border-color: #16A34A; background: #F0FDF4; }
        .social-btn.apple { background: #000; color: white; border-color: #000; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 14px 0; color: #94A3B8; font-size: 11px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #E2E8F0; }
        .form-group { margin-bottom: 11px; }
        .form-group label { display: block; font-weight: 600; color: #0A1628; margin-bottom: 4px; font-size: 12px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 2px solid #E2E8F0; border-radius: 9px; font-size: 13px; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .terms { display: flex; align-items: center; gap: 7px; font-size: 11px; margin: 10px 0; }
        .btn-register { width: 100%; padding: 12px; background: linear-gradient(135deg, #166534, #16A34A); color: white; border: none; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(22,163,74,0.4); }
        .form-footer { text-align: center; margin-top: 15px; font-size: 12px; color: #64748B; }
        .form-footer a { color: #16A34A; text-decoration: none; font-weight: 700; }
        @media (max-width: 800px) {
            .reg-wrap { grid-template-columns: 1fr; }
            .reg-img { min-height: 180px; padding: 25px 20px; }
            .reg-img h2 { font-size: 22px; }
            .reg-form-side { padding: 25px 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="reg-wrap">
    <div class="reg-img">
        <div class="brand">🛡️ Cyber Forensics TZ</div></main>
        <div>
            <h2>Jiunge Nasi Leo</h2>
            <p>Unda akaunti bure na uanze kulinda taarifa zako mtandaoni.</p>
        </div></main>
        <div style="font-size:12px; color:rgba(255,255,255,0.6);">© 2026 Cyber Forensics Tanzania 🇹🇿</div></main>
    </div></main>

    <div class="reg-form-side">
        <div class="reg-box">
            <a th:href="@{/}" class="back-home">← Rudi Nyumbani</a>
            <h1 class="form-title">Unda Akaunti</h1>
            <p class="form-sub">Jiunge na mfumo bure</p>

            <div class="social-buttons">
                <a th:href="@{/oauth2/authorization/google}" class="social-btn">
                    <svg width="14" height="14" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                    <span>Google</span>
                </a>
                <a href="javascript:void(0)" onclick="alert('Apple Sign In - Coming soon!')" class="social-btn apple">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                    <span>Apple</span>
                </a>
            </div></main>

            <div class="divider">au</div></main>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label>Jina la Mtumiaji</label>
                    <input type="text" name="username" required>
                </div></main>
                <div class="form-group">
                    <label>Barua Pepe</label>
                    <input type="email" name="email" required>
                </div></main>
                <div class="form-row">
                    <div class="form-group">
                        <label>Jina Kamili</label>
                        <input type="text" name="fullName">
                    </div></main>
                    <div class="form-group">
                        <label>Simu</label>
                        <input type="tel" name="phone">
                    </div></main>
                </div></main>
                <div class="form-row">
                    <div class="form-group">
                        <label>Neno la Siri</label>
                        <input type="password" name="password" required minlength="6">
                    </div></main>
                    <div class="form-group">
                        <label>Thibitisha</label>
                        <input type="password" name="confirmPassword" required minlength="6">
                    </div></main>
                </div></main>
                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Nakubali Masharti</label>
                </div></main>
                <button type="submit" class="btn-register">✨ UNDA AKAUNTI</button>
            </form>

            <div class="form-footer">
                Una akaunti? <a th:href="@{/login}">Ingia</a>
            </div></main>
        </div></main>
    </div></main>
</div></main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
