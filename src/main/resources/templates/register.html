<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; background: #F0FDF4; }
        .reg-wrap { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; width: 100%; }
        .reg-img { background: linear-gradient(135deg, rgba(10,22,40,0.88), rgba(6,78,59,0.7)), url('https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=1200') center/cover; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; color: white; }
        .reg-img .brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; }
        .reg-img h2 { font-size: 26px; font-weight: 800; line-height: 1.2; margin-bottom: 12px; }
        .reg-img p { font-size: 13px; color: rgba(255,255,255,0.9); }
        .reg-form-side { display: flex; align-items: center; justify-content: center; padding: 25px 20px; background: white; overflow-y: auto; }
        .reg-box { width: 100%; max-width: 370px; }
        .back-home { display: inline-flex; align-items: center; gap: 6px; color: #0A1628; text-decoration: none; font-size: 11px; font-weight: 600; margin-bottom: 14px; padding: 6px 12px; background: #F0FDF4; border-radius: 16px; }
        h1.form-title { font-size: 20px; color: #0A1628; margin-bottom: 4px; font-weight: 800; }
        p.form-sub { color: #64748B; font-size: 12px; margin-bottom: 14px; }
        .social-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
        .social-btn { flex: 1; padding: 9px; border-radius: 8px; border: 2px solid #E2E8F0; background: white; cursor: pointer; font-weight: 600; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #1E293B; }
        .social-btn:hover { border-color: #16A34A; background: #F0FDF4; }
        .social-btn.apple { background: #000; color: white; border-color: #000; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: #94A3B8; font-size: 11px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #E2E8F0; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: 600; color: #0A1628; margin-bottom: 4px; font-size: 11px; }
        .form-group input { width: 100%; padding: 9px 11px; border: 2px solid #E2E8F0; border-radius: 8px; font-size: 12px; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .terms { display: flex; align-items: center; gap: 6px; font-size: 10px; margin: 9px 0; }
        .btn-register { width: 100%; padding: 11px; background: linear-gradient(135deg, #166534, #16A34A); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(22,163,74,0.4); }
        .form-footer { text-align: center; margin-top: 12px; font-size: 11px; color: #64748B; }
        .form-footer a { color: #16A34A; text-decoration: none; font-weight: 700; }
        @media (max-width: 800px) {
            .reg-wrap { grid-template-columns: 1fr; }
            .reg-img { min-height: 160px; padding: 20px; }
            .reg-img h2 { font-size: 18px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="reg-wrap">
    <div class="reg-img">
        <div class="brand">🛡️ Cyber Forensics TZ</div>
        <div>
            <h2>Jiunge Nasi Leo</h2>
            <p>Unda akaunti bure na uanze kulinda taarifa zako mtandaoni.</p>
        </div>
        <div style="font-size:11px; color:rgba(255,255,255,0.6);">© 2026 Cyber Forensics Tanzania 🇹🇿</div>
    </div>

    <div class="reg-form-side">
        <div class="reg-box">
            <a th:href="@{/}" class="back-home">← Rudi Nyumbani</a>
            <h1 class="form-title">Unda Akaunti</h1>
            <p class="form-sub">Jiunge na mfumo bure</p>

            <div class="social-buttons">
                <a th:href="@{/oauth2/authorization/google}" class="social-btn">Google</a>
                <a href="javascript:void(0)" onclick="alert('Apple - Coming soon!')" class="social-btn apple">Apple</a>
            </div>

            <div class="divider">au</div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label>Jina la Mtumiaji</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Barua Pepe</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Jina Kamili</label>
                        <input type="text" name="fullName">
                    </div>
                    <div class="form-group">
                        <label>Simu</label>
                        <input type="tel" name="phone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Neno la Siri</label>
                        <input type="password" name="password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Thibitisha</label>
                        <input type="password" name="confirmPassword" required minlength="6">
                    </div>
                </div>
                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Nakubali Masharti</label>
                </div>
                <button type="submit" class="btn-register">✨ UNDA AKAUNTI</button>
            </form>

            <div class="form-footer">
                Una akaunti? <a th:href="@{/login}">Ingia</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
