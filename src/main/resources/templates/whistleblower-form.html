<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Report - Whistleblower Portal</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ CYBER FORENSICS</div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}">🏠 Home</a>
        <a th:href="@{/whistleblower/track}">🔍 Track Report</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1>📝 Submit Confidential Report</h1>
        <p>Your identity will remain anonymous. We protect your privacy.</p>
    </div>

    <div class="card">
        <form th:action="@{/whistleblower/submit}" method="post" th:object="${report}">

            <label>Report Type *</label>
            <select th:field="*{category}" required>
                <option value="">-- Select --</option>
                <option value="CORRUPTION">💰 Corruption / Bribery</option>
                <option value="FRAUD">🎭 Fraud</option>
                <option value="CYBER_ATTACK">💻 Cyber Attack</option>
                <option value="HARASSMENT">😢 Harassment</option>
                <option value="DRUGS">💊 Drug Trafficking</option>
                <option value="HUMAN_TRAFFICKING">🚨 Human Trafficking</option>
                <option value="TAX_EVASION">📊 Tax Evasion</option>
                <option value="MONEY_LAUNDERING">💵 Money Laundering</option>
                <option value="TERRORISM">💥 Terrorism</option>
                <option value="OTHER">⚠️ Other</option>
            </select>

            <label>Urgency Level</label>
            <select th:field="*{urgency}">
                <option value="NORMAL">🟢 Normal</option>
                <option value="URGENT">🟠 Urgent</option>
                <option value="CRITICAL">🔴 Critical</option>
            </select>

            <label>Title *</label>
            <input type="text" th:field="*{title}" required placeholder="Brief description of the issue">

            <label>Full Description *</label>
            <textarea th:field="*{description}" rows="6" required placeholder="Describe what happened in detail..."></textarea>

            <label>Involved Parties (Optional)</label>
            <textarea th:field="*{involvedParties}" rows="3" placeholder="Names, positions, organizations..."></textarea>

            <label>Location (Optional)</label>
            <input type="text" th:field="*{location}" placeholder="City, address...">

            <label>Region</label>
            <input type="text" th:field="*{region}" placeholder="Region">

            <label>Date Occurred (Optional)</label>
            <input type="datetime-local" name="dateOccurred">

            <label>Evidence You Have (Optional)</label>
            <textarea th:field="*{evidence}" rows="3" placeholder="Documents, photos, recordings..."></textarea>

            <label>Your Contact Info (Optional — encrypted)</label>
            <input type="text" th:field="*{contactEncrypted}" placeholder="Email or phone (encrypted)">

            <div style="margin: 15px 0;">
                <label style="display:inline; text-transform:none;">
                    <input type="checkbox" th:field="*{wantsUpdates}" style="width:auto;">
                    I want to receive updates about my report
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; padding:15px; font-size:16px;">
                🔒 SUBMIT REPORT ANONYMOUSLY
            </button>
        </form>
    </div>

    <div class="card" style="background:rgba(201, 162, 39, 0.08); border-left:4px solid var(--gold);">
        <h3>⚠️ Important</h3>
        <ul style="padding-left:20px; line-height:1.8;">
            <li>Your identity is protected</li>
            <li>No IP tracking</li>
            <li>Encrypted submission</li>
            <li>You will receive a <strong>tracking code</strong></li>
        </ul>
    </div>
</div>
</body>
</html>
