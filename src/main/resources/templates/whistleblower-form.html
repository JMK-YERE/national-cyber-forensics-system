<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Report - Whistleblower Portal</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
    <style>
        .alert-banner { background: linear-gradient(135deg, #0f2557, #1a3a70); color: white; padding: 25px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .alert-banner h2 { color: white; margin: 0; font-size: 24px; }
        .alert-banner p { color: rgba(255,255,255,0.9); margin: 10px 0 0 0; }
        .privacy-box { background: rgba(201, 162, 39, 0.1); border-left: 4px solid #c9a227; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .privacy-box ul { padding-left: 20px; line-height: 1.8; color: #555; }
        .required-star { color: #8b1a1a; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ Cyber Forensics System</div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}">Home</a>
        <a th:href="@{/whistleblower/track}">Track Report</a>
        <a th:href="@{/login}">Login</a>
        <span style="margin-left:15px; padding-left:15px; border-left:1px solid rgba(255,255,255,0.3);">
            <a th:href="@{/lang?lang=sw}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'sw'} ? 'active-lang'">SW</a>
            <a th:href="@{/lang?lang=en}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'en'} ? 'active-lang'">EN</a>
            <a th:href="@{/lang?lang=fr}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'fr'} ? 'active-lang'">FR</a>
            <a th:href="@{/lang?lang=ar}" style="color:white; padding:4px 8px;" th:classappend="${#locale.language == 'ar'} ? 'active-lang'">AR</a>
        </span>
    </div>
</div>

<div class="container">
    <div class="alert-banner">
        <h2>🔒 Submit Confidential Report</h2>
        <p>Your identity will remain anonymous.</p>
    </div>

    <div class="card">
        <form th:action="@{/whistleblower/submit}" method="post" enctype="multipart/form-data">

            <label>Country *</label>
            <select name="country" required>
                <option th:each="c : ${countries}" th:value="${c.code}" th:text="${c.name}"></option>
            </select>

            <label>Report Type *</label>
            <select name="category" required>
                <option value="">Select Report Type</option>
                <option value="CORRUPTION">Corruption / Bribery</option>
                <option value="FRAUD">Fraud</option>
                <option value="CYBER_ATTACK">Cyber Attack</option>
                <option value="HARASSMENT">Harassment</option>
                <option value="DRUGS">Drug Trafficking</option>
                <option value="HUMAN_TRAFFICKING">Human Trafficking</option>
                <option value="TAX_EVASION">Tax Evasion</option>
                <option value="MONEY_LAUNDERING">Money Laundering</option>
                <option value="TERRORISM">Terrorism</option>
                <option value="OTHER">Other</option>
            </select>

            <label>Urgency Level</label>
            <select name="urgency">
                <option value="NORMAL">Normal</option>
                <option value="URGENT">Urgent</option>
                <option value="CRITICAL">Critical</option>
            </select>

            <label>Title *</label>
            <input type="text" name="title" required placeholder="Brief description">

            <label>Full Description *</label>
            <textarea name="description" rows="6" required placeholder="Describe what happened..."></textarea>

            <label>Involved Parties (Optional)</label>
            <textarea name="involvedParties" rows="3" placeholder="Names, positions, organizations"></textarea>

            <label>Location (Optional)</label>
            <input type="text" name="location" placeholder="City, street, specific place">

            <label>Region (Optional)</label>
            <input type="text" name="region" placeholder="Region or area name">

            <label>Date Occurred (Optional)</label>
            <input type="datetime-local" name="dateOccurred">

            <label>Evidence Description (Optional)</label>
            <textarea name="evidence" rows="3" placeholder="Describe evidence you have"></textarea>

            <div class="privacy-box">
                <h4 style="color: #0f2557; margin-bottom: 10px;">📎 Upload Evidence (Optional)</h4>
                <p style="font-size: 12px; color: #666; margin-bottom: 15px;">
                    Upload photo, video, audio, or document
                </p>
                <input type="file" name="evidenceFile" 
                       accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip">
            </div>

            <div class="privacy-box">
                <h4 style="color: #0f2557; margin-bottom: 10px;">📞 Contact Info (Optional)</h4>
                <p style="font-size: 12px; color: #666; margin-bottom: 15px;">
                    Provide contact to receive updates. Encrypted.
                </p>
                <input type="text" name="contactEncrypted" placeholder="Email or phone">
                <div style="margin-top: 10px;">
                    <label style="display: inline; text-transform: none;">
                        <input type="checkbox" name="wantsUpdates" value="true" style="width: auto;">
                        I want to receive updates
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 16px;">
                🔒 SUBMIT REPORT ANONYMOUSLY
            </button>
        </form>
    </div>
</div>
</body>
</html>
