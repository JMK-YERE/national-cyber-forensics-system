<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Password | Cyber Forensics TZ</title><style>:root{--g:#173b66;--g2:#315b87;--c:#244f7d;--ink:#10251f;--muted:#667b74;--line:#d8e8e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#e7eef8,#f8fafc 48%,#eef3f9);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}.card{width:min(430px,95vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 55px rgba(11,31,58,.12);overflow:hidden}.bar{height:7px;background:linear-gradient(90deg,var(--g),var(--g2))}.inner{padding:26px 28px 24px}.icon{width:48px;height:48px;margin:0 auto 10px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:24px}.brand{text-align:center;color:var(--g);font-weight:900;font-size:15px}.brand span{color:var(--c)}h1{text-align:center;color:var(--g);font-size:23px;margin:16px 0 5px}.sub{text-align:center;color:var(--muted);font-size:11px;margin:0 0 17px}.alert{padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:12px}.ok{background:#eff6ff;color:#244f7d;border:1px solid #dbe7f5}.err{background:#eff6ff;color:#1e3a8a;border:1px solid #dbe7f5}.field{margin-bottom:12px}label{display:block;font-size:10px;font-weight:850;color:var(--g);margin-bottom:5px}input{width:100%;height:41px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:12px;outline:0}input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(10,168,121,.1)}.pw{position:relative}.pw input{padding-right:43px}.eye{position:absolute;right:8px;top:5px;width:30px;height:30px;border:0;background:transparent;cursor:pointer}.submit{width:100%;height:42px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-size:12px;font-weight:900;cursor:pointer}.back{display:block;text-align:center;margin-top:13px;color:#244f7d;font-size:10px;font-weight:850;text-decoration:none}@media(max-width:430px){body{padding:10px}.inner{padding:22px 18px}} </style></head><body><main class="card"><div class="bar"></div><section class="inner"><div class="icon">🔐</div><div class="brand">Cyber Forensics <span>TZ</span></div><h1>Tengeneza Password</h1><p class="sub">Kamilisha akaunti yako kwa password mpya.</p><div class="alert err" th:if="${error}" th:text="${error}"></div><form th:action="@{/set-password}" method="post"><input type="hidden" name="token" th:value="${token}"><input type="hidden" name="phone" th:value="${phone}" th:if="${smsMode}"><div class="field" th:if="${!smsMode and (token == null or token == '')}"><label>Namba ya simu iliyosajiliwa</label><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+255..."></div><div class="field" th:if="${smsMode or token == null or token == ''}"><label>Code ya muda / OTP</label><input name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="Ingiza code ya tarakimu 6"></div><div class="field"><label>Password mpya</label><div class="pw"><input id="p1" type="password" name="password" minlength="6" required autocomplete="new-password"><button type="button" class="eye" onclick="showPw('p1',this)">👁</button></div></div><div class="field"><label>Thibitisha password</label><div class="pw"><input id="p2" type="password" name="confirmPassword" minlength="6" required autocomplete="new-password"><button type="button" class="eye" onclick="showPw('p2',this)">👁</button></div></div><button class="submit" type="submit">✓ Weka Password & Endelea</button></form><a class="back" th:href="@{/login}">← Rudi Login</a></section></main><script>function showPw(id,b){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'}</script></body></html>
