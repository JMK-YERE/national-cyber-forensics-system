<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{whistleblower.successTitle}">Success</title>
    <link rel="stylesheet" th:href="@{/css/cyber.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">🛡️ <span th:text="#{app.title}">Cyber Forensics System</span></div>
    <div class="nav-links">
        <a th:href="@{/whistleblower}">Home</a>
        <a th:href="@{/whistleblower/track}">Track Report</a>
    </div>
</div>

<div class="container">
    <div class="card" style="text-align:center; padding:40px;">
        <div style="font-size:80px;">✅</div>
        <h1 th:text="#{whistleblower.reportReceived}">Report Received!</h1>
        <p th:text="#{whistleblower.thankYou}">Thank you for your courage.</p>
    </div>

    <div class="card" style="background:rgba(201,162,39,0.1); border-left:4px solid #c9a227;">
        <h2 style="color:#0f2557;" th:text="#{whistleblower.yourCode}">Your Tracking Code</h2>
        <p th:text="#{whistleblower.saveCode}">Save this code safely!</p>
        <div style="background:#0f2557; padding:25px; border-radius:8px; text-align:center; margin:20px 0;">
            <div style="font-family:monospace; font-size:32px; color:#ffd700; letter-spacing:5px; font-weight:bold;"
                 th:text="${successCode}"></div>
        </div>
        <p style="font-size:12px; color:#888;" th:text="#{whistleblower.codeWarning}">Important: Save this code now!</p>
    </div>

    <div style="text-align:center; margin:30px 0;">
        <a th:href="@{/whistleblower/track}" class="btn btn-primary" style="padding:15px 30px;">🔍 Track Report</a>
        <a th:href="@{/whistleblower}" class="btn" style="padding:15px 30px;">🏠 Home</a>
    </div>
</div>
</body>
</html>
